<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// ============================================================
// 설정값은 config.js에서 불러와요 (이 파일에서는 수정할 필요 없음)
// ============================================================
const APP_CONFIG = window.APP_CONFIG || {};
const API_URL = APP_CONFIG.API_URL || 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
const CLUB_NAME = APP_CONFIG.CLUB_NAME || '점농회';
const ADMIN_CODE = APP_CONFIG.ADMIN_CODE || 'HOOP2026';
const POSITIONS = ['가드', '포워드', '센터'];

// ============================================================
// API 레이어 (Apps Script 백엔드와 통신)
// ============================================================
const api = {
  async get(key) {
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'get failed');
    return data.value === null ? null : { key, value: data.value };
  },
  async set(key, value) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'set', key, value }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'set failed');
    return true;
  },
  async delete(key) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', key }),
    });
    const data = await res.json();
    return data.ok;
  },
  async list(prefix) {
    const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix || '')}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'list failed');
    return { keys: data.keys };
  },
};

async function apiSetWithRetry(key, value) {
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      return await api.set(key, value);
    } catch (e) {
      lastErr = e;
      if (attempt < 2) await new Promise((r) => setTimeout(r, 400 * (attempt + 1)));
    }
  }
  throw lastErr;
}

// ============================================================
// 유틸 함수
// ============================================================
function isStandaloneApp() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}

function openInstallPrompt() {
  window.dispatchEvent(new Event('open-install-prompt'));
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function sha256Hex(pw) {
  const data = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function simpleHashHex(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

async function hashPassword(pw) {
  try {
    if (window.crypto && window.crypto.subtle && window.crypto.subtle.digest) {
      return { hash: await sha256Hex(pw), method: 'sha256' };
    }
  } catch (e) { /* 폴백으로 진행 */ }
  return { hash: simpleHashHex(pw), method: 'simple' };
}

async function verifyPassword(pw, player) {
  const method = player.passwordMethod || 'sha256';
  if (method === 'simple') return simpleHashHex(pw) === player.passwordHash;
  try {
    return (await sha256Hex(pw)) === player.passwordHash;
  } catch (e) {
    return false;
  }
}

// ============================================================
// 점수 계산
// - 팀 배정: Rating(엘로 점수) + 키 + 포지션 (아래 '팀 배정' 부분 참고)
// - Rating 랭킹: 엘로 점수, 20경기 이상만 순위에 포함
// - 승률 랭킹: 윌슨 점수, 20경기 이상만 순위에 포함
// - 적중률 랭킹: 윌슨 점수 (95% 신뢰구간 하한, 판수가 적을수록 낮게 매김)
// 승률과 적중률은 서로 섞지 않고 따로 계산해요.
// ============================================================
const RANKING_MIN_GAMES = 20; // 승률 랭킹, Rating 랭킹에 들어가기 위한 최소 경기 수

function gamesPlayed(p) {
  return (p?.wins || 0) + (p?.losses || 0);
}

function wilsonScore(success, total) {
  if (!total) return 0;
  const z = 1.96;
  const z2 = z * z;
  const p = success / total;
  const center = p + z2 / (2 * total);
  const margin = z * Math.sqrt((p * (1 - p)) / total + z2 / (4 * total * total));
  return (center - margin) / (1 + z2 / total);
}

// 승부예측 기록: 예측한 횟수와 맞힌 횟수
function predictionStats(p) {
  const history = p?.history || [];
  const total = history.filter((h) => h.predicted).length;
  const correct = history.filter((h) => h.predicted && h.predictionCorrect).length;
  return { correct, total };
}

function pct(success, total) {
  return total ? `${Math.round((success / total) * 100)}%` : '-';
}

function winRatePct(p) {
  return pct(p?.wins || 0, gamesPlayed(p));
}

// ============================================================
// Rating (엘로 점수)
// 경기 전 두 팀의 예상 승리 확률을 계산하고, 예상보다 잘하면 오르고 못하면 내려가요.
// ============================================================
const ELO_BASE = 1500;     // 처음 시작 점수
const ELO_K_NEW = 40;      // 경기 수가 적은 사람은 점수가 빨리 자리 잡도록 크게 움직임
const ELO_K = 24;          // 경기를 어느 정도 한 사람
const ELO_NEW_GAMES = 10;  // 이 경기 수 미만이면 '새로 온 사람'으로 봄

function eloOf(p) {
  return typeof p?.elo === 'number' ? p.elo : ELO_BASE;
}

function teamAverageElo(ids, playerMap) {
  const list = ids.map((id) => playerMap[id]).filter(Boolean);
  if (!list.length) return ELO_BASE;
  return list.reduce((sum, p) => sum + eloOf(p), 0) / list.length;
}

// A팀이 이길 예상 확률
function expectedWinA(eloA, eloB) {
  return 1 / (1 + Math.pow(10, (eloB - eloA) / 400));
}

// ============================================================
// 팀 배정
// 1) 무조건 지킬 규칙을 어기면 큰 벌점
// 2) 리바운드 > 포지션 구성 > 실력 > 평균 키 순으로 두 팀의 차이를 점수화
// 3) 가능한 조합을 전부 계산해서 가장 공평한 조합들 중 하나를 무작위로 선택
// ============================================================
const POSITION_HEIGHT_BONUS = { '가드': 0, '포워드': 3, '센터': 6 }; // 리바운드용 유효 키 보정(cm)
const TEAM_WEIGHTS = { rebound: 4, position: 3, skill: 2, height: 1 };
const MIN_HEIGHT = 140;
const MAX_HEIGHT = 220;
const DEFAULT_HEIGHT = 175;
const MAX_EXHAUSTIVE_PLAYERS = 22; // 이 인원까지는 모든 조합을 다 계산
const HARD_PENALTY = 1000;

function validHeight(h) {
  const n = Number(h);
  return n >= MIN_HEIGHT && n <= MAX_HEIGHT ? n : null;
}

function stdDev(values, floor) {
  if (values.length < 2) return floor;
  const mean = values.reduce((a, b) => a + b, 0) / values.length;
  const variance = values.reduce((a, b) => a + (b - mean) * (b - mean), 0) / values.length;
  return Math.max(Math.sqrt(variance), floor);
}

function generateTeams(attendeePlayers) {
  const n = attendeePlayers.length;
  if (n < 2) return { A: attendeePlayers.map((p) => p.id), B: [] };

  // 키를 입력하지 않은 사람은 오늘 참석자 평균 키로 계산
  const known = attendeePlayers.map((p) => validHeight(p.height)).filter((h) => h !== null);
  const fallbackHeight = known.length ? known.reduce((a, b) => a + b, 0) / known.length : DEFAULT_HEIGHT;

  const pos = attendeePlayers.map((p) => (POSITIONS.includes(p.position) ? p.position : '포워드'));
  const height = attendeePlayers.map((p) => validHeight(p.height) ?? fallbackHeight);
  const eff = height.map((h, i) => h + (POSITION_HEIGHT_BONUS[pos[i]] || 0));
  const elo = attendeePlayers.map(eloOf);
  const isC = pos.map((p) => (p === '센터' ? 1 : 0));
  const isF = pos.map((p) => (p === '포워드' ? 1 : 0));
  const isG = pos.map((p) => (p === '가드' ? 1 : 0));
  const totalC = isC.reduce((a, b) => a + b, 0);
  const totalG = isG.reduce((a, b) => a + b, 0);

  // 단위가 다른 값을 같은 눈금으로 맞추기 위한 기준 (오늘 참석자들 사이의 표준편차)
  const sdEff = stdDev(eff, 3);
  const sdHeight = stdDev(height, 3);
  const sdElo = stdDev(elo, 50);

  const sizeA = Math.floor(n / 2);
  const inA = new Uint8Array(n);

  function cost() {
    let nA = 0, nB = 0, eloA = 0, eloB = 0, hA = 0, hB = 0;
    let cA = 0, cB = 0, fA = 0, fB = 0, gA = 0, gB = 0;
    let a1 = -Infinity, a2 = -Infinity, b1 = -Infinity, b2 = -Infinity;
    for (let i = 0; i < n; i++) {
      const v = eff[i];
      if (inA[i]) {
        nA++; eloA += elo[i]; hA += height[i]; cA += isC[i]; fA += isF[i]; gA += isG[i];
        if (v > a1) { a2 = a1; a1 = v; } else if (v > a2) { a2 = v; }
      } else {
        nB++; eloB += elo[i]; hB += height[i]; cB += isC[i]; fB += isF[i]; gB += isG[i];
        if (v > b1) { b2 = b1; b1 = v; } else if (v > b2) { b2 = v; }
      }
    }

    // 1) 무조건 지킬 규칙
    let penalty = 0;
    if (totalC >= 2 && (cA === 0 || cB === 0)) penalty += HARD_PENALTY;       // 센터 2명 이상이면 팀마다 1명 이상
    if (Math.abs((cA + fA) - (cB + fB)) > 1) penalty += HARD_PENALTY;         // 빅맨 수 차이 1명 이하
    if (totalG >= 2 && (gA === 0 || gB === 0)) penalty += HARD_PENALTY;       // 가드 2명 이상이면 팀마다 1명 이상

    // 2) 리바운드: 팀에서 가장 큰 빅맨끼리, 두 번째 빅맨끼리 비교 (첫 번째가 더 중요)
    const d1 = (a1 - b1) / sdEff;
    const d2 = Number.isFinite(a2) && Number.isFinite(b2) ? (a2 - b2) / sdEff : 0;
    const rebound = d1 * d1 + 0.5 * d2 * d2;

    // 포지션 구성: 센터 차이를 가장 크게, 가드 차이를 가장 작게 봄
    const dC = cA - cB, dF = fA - fB, dG = gA - gB;
    const position = dC * dC + 0.5 * dF * dF + 0.25 * dG * dG;

    // 실력: 팀 평균 엘로 점수 차이
    const dSkill = (eloA / nA - eloB / nB) / sdElo;
    const skill = dSkill * dSkill;

    // 평균 키 차이
    const dHeight = (hA / nA - hB / nB) / sdHeight;
    const heightTerm = dHeight * dHeight;

    return penalty
      + TEAM_WEIGHTS.rebound * rebound
      + TEAM_WEIGHTS.position * position
      + TEAM_WEIGHTS.skill * skill
      + TEAM_WEIGHTS.height * heightTerm;
  }

  // 가장 공평한 점수에 아주 가까운 조합까지 후보로 인정 (다시 나누기를 누를 때마다 다른 조합이 나오도록)
  const nearBest = (best) => best + Math.max(0.15, best * 0.1);
  let chosen = null;

  if (n <= MAX_EXHAUSTIVE_PLAYERS) {
    // 모든 조합 계산 (인원이 짝수면 1번 선수를 A팀에 고정해서 같은 조합을 두 번 세지 않음)
    const masks = [];
    const costs = [];
    const limit = 1 << n;
    let m = (1 << sizeA) - 1;
    let best = Infinity;
    while (m < limit) {
      if (n % 2 === 1 || (m & 1)) {
        for (let i = 0; i < n; i++) inA[i] = (m >> i) & 1;
        const c = cost();
        masks.push(m);
        costs.push(c);
        if (c < best) best = c;
      }
      // 같은 인원 수를 유지하면서 다음 조합으로 이동
      const low = m & -m;
      const r = m + low;
      m = (((r ^ m) >> 2) / low) | r;
    }
    const threshold = nearBest(best);
    const pool = [];
    for (let k = 0; k < costs.length; k++) if (costs[k] <= threshold) pool.push(masks[k]);
    const mask = pool[Math.floor(Math.random() * pool.length)];
    chosen = new Uint8Array(n);
    for (let i = 0; i < n; i++) chosen[i] = (mask >> i) & 1;
  } else {
    const candidates = []; // { cost, pick: Uint8Array }
    // 인원이 아주 많으면: 무작위로 나눈 뒤 선수를 한 명씩 맞바꾸며 개선하는 방식
    const order = [...Array(n).keys()];
    for (let t = 0; t < 150; t++) {
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      inA.fill(0);
      for (let k = 0; k < sizeA; k++) inA[order[k]] = 1;
      let current = cost();
      let improved = true;
      while (improved) {
        improved = false;
        for (let i = 0; i < n && !improved; i++) {
          if (!inA[i]) continue;
          for (let j = 0; j < n; j++) {
            if (inA[j]) continue;
            inA[i] = 0; inA[j] = 1;
            const c = cost();
            if (c < current - 1e-9) { current = c; improved = true; break; }
            inA[i] = 1; inA[j] = 0;
          }
        }
      }
      candidates.push({ cost: current, pick: Uint8Array.from(inA) });
    }
    let best = Infinity;
    for (const c of candidates) if (c.cost < best) best = c.cost;
    const threshold = nearBest(best);
    const pool = candidates.filter((c) => c.cost <= threshold);
    chosen = pool[Math.floor(Math.random() * pool.length)].pick;
  }

  let A = [];
  let B = [];
  attendeePlayers.forEach((p, i) => (chosen[i] ? A : B).push(p.id));
  if (Math.random() < 0.5) [A, B] = [B, A];
  return { A, B };
}

// 팀 배정 결과 화면에 보여줄 팀별 요약
function teamSummary(ids, playerMap) {
  const list = ids.map((id) => playerMap[id]).filter(Boolean);
  const heights = list.map((p) => validHeight(p.height)).filter((h) => h !== null);
  return {
    avgHeight: heights.length ? Math.round(heights.reduce((a, b) => a + b, 0) / heights.length) : null,
    maxHeight: heights.length ? Math.max(...heights) : null,
    centers: list.filter((p) => p.position === '센터').length,
    forwards: list.filter((p) => p.position === '포워드').length,
    guards: list.filter((p) => p.position === '가드').length,
    avgElo: list.length ? Math.round(teamAverageElo(ids, playerMap)) : null,
  };
}

function Spinner({ size = 16, dark = false }) {
  const track = dark ? 'rgba(15,23,42,0.15)' : 'rgba(255,255,255,0.35)';
  const head = dark ? '#0f172a' : '#fff';
  return (
    <span style={{ display: 'inline-block', width: size, height: size, border: `2px solid ${track}`, borderTopColor: head, borderRadius: '50%', animation: 'spin 0.7s linear infinite' }} />
  );
}

const POSITION_STYLE = {
  '가드': 'bg-blue-100 text-blue-700',
  '포워드': 'bg-orange-100 text-orange-700',
  '센터': 'bg-slate-200 text-slate-700',
};

function PositionBadge({ position }) {
  return (
    <span className={`text-xs font-bold px-1.5 py-0.5 rounded ${POSITION_STYLE[position] || 'bg-gray-100 text-gray-700'}`}>
      {position}
    </span>
  );
}

function Avatar({ name, size = 'md', tone = 'bg-slate-700' }) {
  const sizes = { sm: 'w-6 h-6 text-xs', md: 'w-9 h-9 text-xs', lg: 'w-11 h-11 text-sm' };
  return (
    <div className={`${sizes[size]} rounded-full flex items-center justify-center font-black text-white ${tone} shrink-0 ring-2 ring-white`}>
      {name ? name.slice(0, 1) : '?'}
    </div>
  );
}

function PlayerRow({ player, tone }) {
  if (!player) return null;
  return (
    <div className="flex items-center gap-2 py-1.5">
      <Avatar name={player.name} size="sm" tone={tone} />
      <span className="text-sm font-semibold text-slate-800 flex-1 truncate">{player.name}</span>
      <PositionBadge position={player.position} />
      <span className="text-xs text-slate-500 font-medium w-9 text-right">{winRatePct(player)}</span>
    </div>
  );
}

function BasketballClubApp() {
  const [dateKey] = useState(() => todayKey());
  const [loading, setLoading] = useState(true);
  const [players, setPlayers] = useState({});
  const [daily, setDaily] = useState({ attendance: {}, teams: null, predictions: {}, result: null });

  const handleSubmitResult = async (winner) => {
    if (!daily.teams || daily.result?.finalized) return;
    setBusy(true);
    try {
      // 다른 사람이 방금 가입하거나 정보를 바꿨을 수 있으니 최신 데이터로 계산
      const pRes = await api.get('players').catch(() => null);
      const freshPlayers = pRes ? JSON.parse(pRes.value) : players;

      const allIds = new Set([...daily.teams.A, ...daily.teams.B, ...Object.keys(daily.predictions || {})]);
      const nextPlayers = { ...freshPlayers };
      const deltas = [];

      // 엘로: 경기 전 점수로 예상 승률을 계산하고, 결과와의 차이만큼 점수 조정
      const eloA = teamAverageElo(daily.teams.A, freshPlayers);
      const eloB = teamAverageElo(daily.teams.B, freshPlayers);
      const expectA = expectedWinA(eloA, eloB);
      const scoreA = winner === 'A' ? 1 : 0;

      allIds.forEach((id) => {
        if (!nextPlayers[id]) return;
        const onA = daily.teams.A.includes(id);
        const onB = daily.teams.B.includes(id);
        const team = onA ? 'A' : (onB ? 'B' : null);
        const predicted = daily.predictions?.[id] || null;
        const won = team ? team === winner : null;
        const predictionCorrect = predicted ? predicted === winner : null;

        const winsDelta = won === true ? 1 : 0;
        const lossesDelta = won === false ? 1 : 0;
        const predictionScoreDelta = predictionCorrect ? 1 : 0;

        let eloDelta = 0;
        if (team) {
          const k = gamesPlayed(nextPlayers[id]) < ELO_NEW_GAMES ? ELO_K_NEW : ELO_K;
          const actual = team === 'A' ? scoreA : 1 - scoreA;
          const expected = team === 'A' ? expectA : 1 - expectA;
          eloDelta = Math.round(k * (actual - expected) * 10) / 10;
        }

        const historyEntry = { date: dateKey, team, result: team ? (won ? 'win' : 'loss') : null, predicted, predictionCorrect, eloDelta: team ? eloDelta : null };

        nextPlayers[id] = {
          ...nextPlayers[id],
          wins: (nextPlayers[id].wins || 0) + winsDelta,
          losses: (nextPlayers[id].losses || 0) + lossesDelta,
          predictionScore: (nextPlayers[id].predictionScore || 0) + predictionScoreDelta,
          elo: eloOf(nextPlayers[id]) + eloDelta,
          history: [...(nextPlayers[id].history || []), historyEntry],
        };
        deltas.push({ playerId: id, winsDelta, lossesDelta, predictionScoreDelta, eloDelta });
      });

      await savePlayers(nextPlayers);
      const result = { winner, finalized: true, timestamp: new Date().toISOString(), enteredBy: me?.name || currentPlayerId };
      await saveDaily({ ...daily, result });

      const logEntry = {
        id: `${dateKey}-${Date.now()}`, date: dateKey, timestamp: new Date().toISOString(),
        adminName: me?.name || currentPlayerId, winner, playerDeltas: deltas, undone: false,
      };
      await saveLogs([logEntry, ...logs]);
      setConfirmingWinner(null);

      setError(`결과 입력 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);

    }

    setBusy(true);
    try {
      const pRes = await api.get('players').catch(() => null);
      const freshPlayers = pRes ? JSON.parse(pRes.value) : players;
      const nextPlayers = { ...freshPlayers };
      entry.playerDeltas.forEach((d) => {
        if (!nextPlayers[d.playerId]) return;
        const filteredHistory = (nextPlayers[d.playerId].history || []).filter((h) => h.date !== entry.date);
        nextPlayers[d.playerId] = {
          ...nextPlayers[d.playerId],
          wins: (nextPlayers[d.playerId].wins || 0) - d.winsDelta,
          losses: (nextPlayers[d.playerId].losses || 0) - d.lossesDelta,
          predictionScore: (nextPlayers[d.playerId].predictionScore || 0) - d.predictionScoreDelta,
          elo: eloOf(nextPlayers[d.playerId]) - (d.eloDelta || 0),
          history: filteredHistory,
        };
      });
      await savePlayers(nextPlayers);

      if (entry.date === dateKey) {
        await saveDaily({ ...daily, result: null });
      } else {
        const dRes = await api.get(`daily:${entry.date}`).catch(() => null);
        if (dRes) {

          dayData.result = null;
          await apiSetWithRetry(`daily:${entry.date}`, JSON.stringify(dayData));

  // 랭킹 3가지를 각각 따로 정렬
  // - 승률 랭킹: 윌슨 점수, 20경기 이상만 순위 (나머지는 '랭킹 진입 전'에 경기 수 많은 순)
  // - 적중률 랭킹: 윌슨 점수
  // - Rating 랭킹: 엘로 점수, 20경기 이상만 순위
  const scoredPlayers = Object.values(players).map((p) => {
    const games = gamesPlayed(p);
    const pred = predictionStats(p);
    const lastElo = [...(p.history || [])].reverse().find((h) => typeof h.eloDelta === 'number');
    return {
      ...p,
      games,
      pred,
      winScore: wilsonScore(p.wins || 0, games),
      predScore: wilsonScore(pred.correct, pred.total),
      skill: eloOf(p),
      lastEloDelta: lastElo ? lastElo.eloDelta : null,
    };
  });
  const qualifies = (p) => p.games >= RANKING_MIN_GAMES;
  const winRanking = [...scoredPlayers].sort((a, b) =>
    (qualifies(b) - qualifies(a))
    || (qualifies(a) ? (b.winScore - a.winScore) || (b.games - a.games) : (b.games - a.games) || (b.winScore - a.winScore)));
  const predRanking = [...scoredPlayers].sort((a, b) => (b.predScore - a.predScore) || (b.pred.total - a.pred.total));
  const skillRanking = [...scoredPlayers].sort((a, b) =>
    (qualifies(b) - qualifies(a))

  const rankedPlayers = rankMode === 'skill' ? skillRanking : (rankMode === 'prediction' ? predRanking : winRanking);

  const myWinRankIdx = winRanking.findIndex((p) => p.id === currentPlayerId);
  const myPredRankIdx = predRanking.findIndex((p) => p.id === currentPlayerId);
  const mySkillRankIdx = skillRanking.findIndex((p) => p.id === currentPlayerId);

  const mySkillRankLabel = myGames >= RANKING_MIN_GAMES && mySkillRankIdx >= 0 ? `Rating 랭킹 ${mySkillRankIdx + 1}위` : entryLabel;

  if (!apiConfigured) {
    return (

          </p>

  if (loading) {

  if (!currentPlayerId) {

              </button>
              <button

            </div>

            {authMode === 'login' ? (
              <div className="space-y-3">
                <input

                />
                <input
                  value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} type="password"
                  placeholder="비밀번호" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                {error && <p className="text-red-500 text-xs font-medium">{error}</p>}
                <button

                <input value={regName} onChange={(e) => setRegName(e.target.value)} placeholder="이름" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regEmpId} onChange={(e) => setRegEmpId(e.target.value)} placeholder="사번" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regHeight} onChange={(e) => setRegHeight(e.target.value.replace(/[^0-9]/g, ''))} inputMode="numeric" placeholder="키 (cm, 예: 178)" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <div className="flex gap-2">
                  {POSITIONS.map((pos) => (
                    <button

                      {pos}

                </div>
                <input value={regPassword} onChange={(e) => setRegPassword(e.target.value)} type="password" placeholder="비밀번호 (4자 이상)" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regPasswordConfirm} onChange={(e) => setRegPasswordConfirm(e.target.value)} type="password" placeholder="비밀번호 확인" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />

                      {daily.teams.A.map((id) => <PlayerRow key={id} player={players[id]} tone="bg-blue-600" />)}

                    <div className="p-3">
                      {daily.teams.B.map((id) => <PlayerRow key={id} player={players[id]} tone="bg-orange-600" />)}
                    </div>
                  </div>
                  <div className="grid grid-cols-2 divide-x divide-slate-100 border-t border-slate-100 bg-slate-50">

                      return (

                          <p>평균 Rating <span className="font-bold text-slate-700">{s.avgElo ?? '-'}</span></p>
                        </div>
                      );
                    })}
                  </div>
                  {me.isAdmin && !daily.result?.finalized && (
                    <button onClick={handleGenerateTeams} disabled={busy} className="w-full py-2.5 text-xs font-bold text-slate-500 border-t border-slate-100">
                      ↻ 팀 다시 나누기 (예측 초기화)
                    </button>
                  )}
                </div>
              )}

              {daily.teams && (
                <div className="bg-white rounded-2xl p-4 shadow-sm">
                  <p className="text-slate-800 font-bold text-sm mb-3">승부예측</p>
                  <div className="grid grid-cols-2 gap-2">
                    {['A', 'B'].map((team) => {
                      const count = Object.values(daily.predictions || {}).filter((v) => v === team).length;
                      const mine = daily.predictions?.[currentPlayerId] === team;
                      const locked = daily.result?.finalized;
                      return (

                          disabled={busy || locked}
                          className={`rounded-xl py-3 text-center border-2 transition ${mine ? (team === 'A' ? 'border-blue-600 bg-blue-50' : 'border-orange-600 bg-orange-50') : 'border-slate-100'} disabled:opacity-70`}
                        >

                          <p className="text-slate-400 text-xs font-medium mt-0.5">{count}표{mine && ' · 내 예측'}</p>
                        </button>
                      );

                  </div>
                  {daily.result?.finalized && (
                    <p className="text-center text-xs font-bold mt-3">
                      {daily.predictions?.[currentPlayerId]
                        ? (daily.predictions[currentPlayerId] === daily.result.winner
                            ? <span className="text-emerald-600">내 예측 적중! 🎉</span>
                            : <span className="text-slate-400">내 예측은 빗나갔어요</span>)
                        : <span className="text-slate-400">이번 경기는 예측하지 않았어요</span>}

              {me.isAdmin && daily.teams && !daily.result?.finalized && (
                <div className="bg-white rounded-2xl p-4 shadow-sm">

                  {!confirmingWinner ? (
                    <div className="grid grid-cols-2 gap-2">

                      <button onClick={() => setConfirmingWinner('B')} className="bg-orange-600 text-white rounded-xl py-2.5 text-sm font-bold">B팀 승리</button>
                    </div>
                  ) : (

                      <p className="text-sm font-bold text-slate-700 mb-3">{confirmingWinner}팀 승리로 확정할까요?</p>
                      <div className="grid grid-cols-2 gap-2">
                        <button onClick={() => setConfirmingWinner(null)} className="py-2 rounded-lg text-sm font-bold text-slate-500 bg-white">취소</button>
                        <button onClick={() => handleSubmitResult(confirmingWinner)} disabled={busy} className="py-2 rounded-lg text-sm font-bold text-white bg-slate-900">확정</button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {daily.result?.finalized && (
                <div className={`rounded-2xl p-4 text-center ${daily.result.winner === 'A' ? 'bg-blue-600' : 'bg-orange-600'}`}>
                  <p className="text-white text-xs font-bold opacity-80">경기 종료</p>
                  <p className="font-display text-2xl text-white mt-0.5">{daily.result.winner}팀 승리</p>
                  <p className="text-white text-xs mt-1 opacity-80">{formatDateTime(daily.result.timestamp)} 기록</p>
                </div>
              )}
            </div>
          )}

          {tab === 'ranking' && (
            <div className="space-y-3">

                  <button
                    key={mode}
                    onClick={() => setRankMode(mode)}
                    className={`flex-1 py-2 rounded-md text-xs font-bold ${rankMode === mode ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
                  >
                    {label}
                  </button>
                ))}
              </div>
              <p className="text-xs text-slate-400 leading-relaxed px-1">
                {rankMode === 'skill' && `팀 전력까지 고려한 Rating 순이에요. 예상보다 잘하면 오르고 못하면 내려가요. ${RANKING_MIN_GAMES}경기 이상 뛴 사람만 순위에 들어가요.`}
                {rankMode === 'winrate' && `승률과 판수를 함께 보고 매긴 점수 순이에요. 판수가 적으면 점수가 낮게 나오고, 기록이 쌓일수록 실제 승률에 가까워져요. ${RANKING_MIN_GAMES}경기 이상 뛴 사람만 순위에 들어가요.`}
                {rankMode === 'prediction' && '적중률과 예측 횟수를 함께 보고 매긴 점수 순이에요. 예측 횟수가 적으면 점수가 낮게 나오고, 기록이 쌓일수록 실제 적중률에 가까워져요.'}

                  const needsGames = rankMode !== 'prediction';
                  const ranked = needsGames ? p.games >= RANKING_MIN_GAMES : p.pred.total > 0;
                  const firstUnranked = needsGames && !ranked && (idx === 0 || rankedPlayers[idx - 1].games >= RANKING_MIN_GAMES);
                  const remaining = `랭킹 진입까지 ${RANKING_MIN_GAMES - p.games}경기`;

                  let detail;
                  let scoreLabel;
                  if (rankMode === 'skill') {
                    const recent = typeof p.lastEloDelta === 'number' ? ` · 최근 ${p.lastEloDelta >= 0 ? '+' : ''}${Math.round(p.lastEloDelta)}` : '';
                    detail = p.games === 0 ? '아직 경기 기록 없음' : `${p.games}경기${recent}${ranked ? '' : ` · ${remaining}`}`;
                    scoreLabel = p.games > 0 ? `${Math.round(p.skill)}` : '-';
                  } else if (rankMode === 'prediction') {
                    detail = ranked ? `${p.pred.total}번 중 ${p.pred.correct}번 적중 · ${pct(p.pred.correct, p.pred.total)}` : '아직 예측 기록 없음';
                    scoreLabel = ranked ? `${Math.round(p.predScore * 100)}점` : '-';

                    detail = p.games === 0 ? '아직 경기 기록 없음' : `${p.wins || 0}승 ${p.losses || 0}패 · 승률 ${pct(p.wins || 0, p.games)}${ranked ? '' : ` · ${remaining}`}`;
                    scoreLabel = p.games > 0 ? `${Math.round(p.winScore * 100)}점` : '-';

                  const isTop = idx === 0 && ranked;
                  return (

                      )}
                      <div className={`flex items-center gap-3 px-4 py-3 ${p.id === currentPlayerId ? 'bg-orange-50' : ''}`}>

                          <p className="text-xs text-slate-400 font-medium">{detail}</p>
                        </div>
                        <p className={`text-sm font-black shrink-0 ${ranked ? 'text-slate-800' : 'text-slate-300'}`}>{scoreLabel}</p>

// ============================================================
// 앱 설치 팝업 ("설치하시겠습니까?")
// ============================================================
const INSTALL_DISMISS_KEY = 'installPromptDismissedAt';
const INSTALL_DISMISS_MS = 24 * 60 * 60 * 1000; // '나중에'를 누르면 하루 동안 자동으로 안 띄움

function getInstallEnv() {
  const ua = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);
  const isKakao = /KAKAOTALK/i.test(ua);
  const isInApp = isKakao
    || /NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua)
    || (isAndroid && /; wv\)/i.test(ua));
  return { isIOS, isAndroid, isKakao, isInApp };
}

function recentlyDismissed() {
  try {
    const t = Number(localStorage.getItem(INSTALL_DISMISS_KEY) || 0);
    return Date.now() - t < INSTALL_DISMISS_MS;
  } catch (e) {
    return false;
  }
}

function openInExternalBrowser(env) {
  const here = window.location.href;
  if (env.isKakao) {
    window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here);
  } else if (env.isAndroid) {
    const u = new URL(here);
    window.location.href = `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=https;package=com.android.chrome;end`;
  }
}

function StepList({ steps }) {
  return (
    <ol className="space-y-2 text-left">
      {steps.map((s, i) => (
        <li key={i} className="flex gap-3 items-start bg-slate-50 rounded-xl px-3 py-2.5">
          <span className="w-5 h-5 rounded-full bg-orange-600 text-white text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">{i + 1}</span>
          <span className="text-sm text-slate-700 leading-relaxed">{s}</span>
        </li>
      ))}
    </ol>
  );
}

function InstallPrompt() {
  const [env] = useState(() => getInstallEnv());
  const [open, setOpen] = useState(false);
  const [mode, setMode] = useState('ask'); // ask: 물어보기 / guide: 설치 방법 안내 / installed: 설치 완료
  const [oneTapReady, setOneTapReady] = useState(() => !!window.__deferredInstallPrompt);
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (isStandaloneApp()) return undefined; // 이미 설치된 앱으로 실행 중이면 아무것도 안 띄움

    const onAvailable = () => {
      setOneTapReady(true);
      if (!recentlyDismissed()) setOpen(true);
    };
    const onInstalled = () => { setMode('installed'); setOpen(true); };
    const onManualOpen = () => { setMode('ask'); setOpen(true); };

    window.addEventListener('install-available', onAvailable);
    window.addEventListener('appinstalled', onInstalled);
    window.addEventListener('open-install-prompt', onManualOpen);

    // 카카오톡 안의 브라우저에서는 설치가 안 되니 외부 브라우저로 자동 전환
    if (env.isKakao) openInExternalBrowser(env);

    let timer;
    if (!recentlyDismissed() && (env.isIOS || env.isAndroid || env.isInApp || window.__deferredInstallPrompt)) {
      timer = setTimeout(() => setOpen(true), 700);
    }

    return () => {
      clearTimeout(timer);
      window.removeEventListener('install-available', onAvailable);
      window.removeEventListener('appinstalled', onInstalled);
      window.removeEventListener('open-install-prompt', onManualOpen);
    };
  }, []);

  const dismiss = () => {
    try { localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now())); } catch (e) { /* 무시 */ }
    setOpen(false);
  };

  const handleYes = async () => {
    const dp = window.__deferredInstallPrompt;
    if (!dp) { setMode('guide'); return; }
    try {
      dp.prompt(); // 브라우저 자체 설치 확인창이 뜸
      const choice = await dp.userChoice;
      window.__deferredInstallPrompt = null;
      setOneTapReady(false);
      if (choice && choice.outcome === 'accepted') setMode('installed');
      else setOpen(false);
    } catch (e) {
      setMode('guide');
    }
  };

  const copyLink = async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      setCopied(true);
    } catch (e) {
      setCopied(false);
    }
  };

  if (!open) return null;

  const primaryBtn = 'w-full bg-orange-600 text-white rounded-xl py-3 text-sm font-bold';
  const secondaryBtn = 'w-full bg-slate-100 text-slate-500 rounded-xl py-3 text-sm font-bold';

  let title;
  let body;
  let actions;

  if (mode === 'installed') {
    title = '설치 완료! 🎉';
    body = (
      <p className="text-sm text-slate-500 leading-relaxed">
        홈 화면(또는 앱 목록)에 생긴 🏀 아이콘으로 열어주세요.<br />다음부터는 링크 없이 아이콘만 누르면 돼요.
      </p>
    );
    actions = <button onClick={() => setOpen(false)} className={primaryBtn}>확인</button>;
  } else if (env.isInApp) {
    title = '브라우저에서 열어주세요';
    if (env.isKakao || env.isAndroid) {
      body = (
        <p className="text-sm text-slate-500 leading-relaxed">
          {env.isKakao ? '카카오톡' : '지금 앱'} 안에서는 설치가 안 돼요.<br />아래 버튼을 눌러 {env.isKakao ? '브라우저' : 'Chrome'}로 열어주세요.
        </p>
      );
      actions = (
        <div className="space-y-2">
          <button onClick={() => openInExternalBrowser(env)} className={primaryBtn}>
            {env.isKakao ? '브라우저로 열기' : 'Chrome으로 열기'}
          </button>
          <button onClick={dismiss} className={secondaryBtn}>닫기</button>
        </div>
      );
    } else {
      body = (
        <div className="space-y-3">
          <p className="text-sm text-slate-500 leading-relaxed">지금 앱 안에서는 설치가 안 돼요.</p>
          <StepList steps={['화면의 ••• 또는 공유 메뉴를 누르세요', "'Safari로 열기'를 누르세요", '열린 Safari에서 설치를 진행하세요']} />
          {copied && <p className="text-emerald-600 text-xs font-medium">링크를 복사했어요. Safari 주소창에 붙여넣어도 돼요.</p>}
        </div>
      );
      actions = (
        <div className="space-y-2">
          <button onClick={copyLink} className={primaryBtn}>링크 복사하기</button>
          <button onClick={dismiss} className={secondaryBtn}>닫기</button>
        </div>
      );
    }
  } else if (mode === 'ask') {
    title = `${CLUB_NAME} 앱을 설치하시겠습니까?`;
    body = (
      <p className="text-sm text-slate-500 leading-relaxed">
        홈 화면에 아이콘이 생기고, 주소창 없이 앱처럼 열려요.
      </p>
    );
    actions = (
      <div className="grid grid-cols-2 gap-2">
        <button onClick={dismiss} className={secondaryBtn}>나중에</button>
        <button onClick={handleYes} className={primaryBtn}>예, 설치할게요</button>
      </div>
    );
  } else {
    // guide: 버튼 한 번으로 설치할 수 없는 경우 직접 설치하는 방법 안내
    let steps;
    if (env.isIOS) {
      title = '두 번만 더 누르면 설치돼요';
      steps = [
        '화면 아래 공유 버튼(□↑)을 누르세요. 안 보이면 ••• 버튼 → 공유',
        "목록에서 '홈 화면에 추가'를 누르세요",
        "오른쪽 위 '추가'를 누르면 끝!",
      ];
    } else if (env.isAndroid) {
      title = '메뉴에서 설치해주세요';
      steps = [
        '오른쪽 위 ⋮ 메뉴를 누르세요 (삼성 인터넷은 아래 ≡ 메뉴)',
        "'앱 설치' 또는 '홈 화면에 추가'를 누르세요",
        "'설치'를 누르면 끝!",
      ];
    } else {
      title = '브라우저 메뉴에서 설치해주세요';
      steps = [
        '주소창 오른쪽의 설치 아이콘을 누르거나, 브라우저 메뉴(⋮)를 여세요',
        "'앱 설치' 또는 '홈 화면에 추가'를 누르세요",
      ];
    }
    body = (
      <div>
        <StepList steps={steps} />
        {env.isIOS && <div className="text-2xl mt-3 animate-bounce" aria-hidden="true">👇</div>}
      </div>
    );
    actions = (
      <div className="space-y-2">
        {oneTapReady && !env.isIOS && (
          <button onClick={handleYes} className={primaryBtn}>바로 설치하기</button>
        )}
        <button onClick={dismiss} className={secondaryBtn}>닫기</button>
      </div>
    );
  }

  return (
    <div
      className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 px-4"
      style={{ paddingBottom: 'calc(1rem + env(safe-area-inset-bottom))' }}
      onClick={() => (mode === 'installed' ? setOpen(false) : dismiss())}
    >
      <div
        className="w-full max-w-sm bg-white rounded-3xl p-5 shadow-2xl text-center"
        onClick={(e) => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
      >
        <img src="icon-192.png" alt="" className="w-16 h-16 rounded-2xl mx-auto mb-3 shadow" />
        <p className="text-slate-900 font-bold text-base mb-2">{title}</p>
        <div className="mb-4">{body}</div>
        {actions}
      </div>
    </div>
  );
}

function Root() {
  return (
    <React.Fragment>
      <BasketballClubApp />
      <InstallPrompt />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
