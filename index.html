const { useState, useEffect } = React;

// ============================================================
// 설정값은 config.js에서 불러와요 (이 파일에서는 수정할 필요 없음)
// ============================================================
const APP_CONFIG = window.APP_CONFIG || {};
const API_URL = APP_CONFIG.API_URL || 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
const CLUB_NAME = APP_CONFIG.CLUB_NAME || '점농회';
const ADMIN_CODE = APP_CONFIG.ADMIN_CODE || 'HOOP2026';
const POSITIONS = ['가드', '포워드', '센터'];

// ============================================================
// API 레이어 (Apps Script 백엔드와 통신)
// ============================================================
const api = {
  async get(key) {
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'get failed');
    return data.value === null ? null : { key, value: data.value };
  },
  async set(key, value) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'set', key, value }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'set failed');
    return true;
  },
  async delete(key) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', key }),
    });
    const data = await res.json();
    return data.ok;
  },
  async list(prefix) {
    const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix || '')}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'list failed');
    return { keys: data.keys };
  },
};

async function apiSetWithRetry(key, value) {
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      return await api.set(key, value);
    } catch (e) {
      lastErr = e;
      if (attempt < 2) await new Promise((r) => setTimeout(r, 400 * (attempt + 1)));
    }
  }
  throw lastErr;
}

// ============================================================
// 유틸 함수
// ============================================================
function isStandaloneApp() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}

function openInstallPrompt() {
  window.dispatchEvent(new Event('open-install-prompt'));
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function sha256Hex(pw) {
  const data = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function simpleHashHex(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

async function hashPassword(pw) {
  try {
    if (window.crypto && window.crypto.subtle && window.crypto.subtle.digest) {
      return { hash: await sha256Hex(pw), method: 'sha256' };
    }
  } catch (e) { /* 폴백으로 진행 */ }
  return { hash: simpleHashHex(pw), method: 'simple' };
}

async function verifyPassword(pw, player) {
  const method = player.passwordMethod || 'sha256';
  if (method === 'simple') return simpleHashHex(pw) === player.passwordHash;
  try {
    return (await sha256Hex(pw)) === player.passwordHash;
  } catch (e) {
    return false;
  }
}

function winRate(p) {
  const total = (p?.wins || 0) + (p?.losses || 0);
  return total === 0 ? 0.5 : p.wins / total;
}

function winRatePct(p) {
  const total = (p?.wins || 0) + (p?.losses || 0);
  if (total === 0) return '-';
  return `${Math.round((p.wins / total) * 100)}%`;
}

function generateTeams(attendeePlayers) {
  const byPos = {};
  POSITIONS.forEach((pos) => { byPos[pos] = []; });
  const fallback = POSITIONS[1];
  attendeePlayers.forEach((p) => {
    const pos = POSITIONS.includes(p.position) ? p.position : fallback;
    byPos[pos].push(p);
  });

  let teamA = [];
  let teamB = [];
  let aStarts = true;

  POSITIONS.forEach((pos) => {
    const sorted = [...byPos[pos]].sort((x, y) => winRate(y) - winRate(x));
    sorted.forEach((p, idx) => {
      const toA = aStarts ? idx % 2 === 0 : idx % 2 === 1;
      if (toA) teamA.push(p); else teamB.push(p);
    });
    aStarts = !aStarts;
  });

  while (teamA.length - teamB.length > 1) { teamB.push(teamA.pop()); }
  while (teamB.length - teamA.length > 1) { teamA.push(teamB.pop()); }

  return { A: teamA.map((p) => p.id), B: teamB.map((p) => p.id) };
}

// 작은 컴포넌트들
// ============================================================
function Spinner({ size = 16, dark = false }) {
  const track = dark ? 'rgba(15,23,42,0.15)' : 'rgba(255,255,255,0.35)';
  const head = dark ? '#0f172a' : '#fff';
  return (
    <span style={{ display: 'inline-block', width: size, height: size, border: `2px solid ${track}`, borderTopColor: head, borderRadius: '50%', animation: 'spin 0.7s linear infinite' }} />
  );
}

const POSITION_STYLE = {
  '가드': 'bg-blue-100 text-blue-700',
  '포워드': 'bg-orange-100 text-orange-700',
  '센터': 'bg-slate-200 text-slate-700',
};

function PositionBadge({ position }) {
  return (
    <span className={`text-xs font-bold px-1.5 py-0.5 rounded ${POSITION_STYLE[position] || 'bg-gray-100 text-gray-700'}`}>
      {position}
    </span>
  );
}

function Avatar({ name, size = 'md', tone = 'bg-slate-700' }) {
  const sizes = { sm: 'w-6 h-6 text-xs', md: 'w-9 h-9 text-xs', lg: 'w-11 h-11 text-sm' };
  return (
    <div className={`${sizes[size]} rounded-full flex items-center justify-center font-black text-white ${tone} shrink-0 ring-2 ring-white`}>
      {name ? name.slice(0, 1) : '?'}
    </div>
  );
}

function PlayerRow({ player, tone }) {
  if (!player) return null;
  return (
    <div className="flex items-center gap-2 py-1.5">
      <Avatar name={player.name} size="sm" tone={tone} />
      <span className="text-sm font-semibold text-slate-800 flex-1 truncate">{player.name}</span>
      <PositionBadge position={player.position} />
      <span className="text-xs text-slate-500 font-medium w-9 text-right">{winRatePct(player)}</span>
    </div>
  );
}

// ============================================================
// 메인 앱
// ============================================================
function BasketballClubApp() {
  const [dateKey] = useState(() => todayKey());
  const [loading, setLoading] = useState(true);
  const [players, setPlayers] = useState({});
  const [daily, setDaily] = useState({ attendance: {}, teams: null, predictions: {}, result: null });
  const [logs, setLogs] = useState([]);
  const [currentPlayerId, setCurrentPlayerId] = useState(null);
  const [tab, setTab] = useState('today');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [apiConfigured, setApiConfigured] = useState(true);

  const [authMode, setAuthMode] = useState('login');
  const [loginEmpId, setLoginEmpId] = useState('');
  const [loginPassword, setLoginPassword] = useState('');
  const [regName, setRegName] = useState('');
  const [regEmpId, setRegEmpId] = useState('');
  const [regPosition, setRegPosition] = useState(POSITIONS[0]);
  const [regPassword, setRegPassword] = useState('');
  const [regPasswordConfirm, setRegPasswordConfirm] = useState('');

  const [confirmingWinner, setConfirmingWinner] = useState(null);
  const [showAdminClaim, setShowAdminClaim] = useState(false);
  const [adminCodeInput, setAdminCodeInput] = useState('');
  const [rankMode, setRankMode] = useState('winrate');

  const [showChangePassword, setShowChangePassword] = useState(false);
  const [curPassword, setCurPassword] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [newPasswordConfirm, setNewPasswordConfirm] = useState('');
  const [pwChangeMsg, setPwChangeMsg] = useState('');
  const [historyShowCount, setHistoryShowCount] = useState(10);

  const [backupText, setBackupText] = useState('');
  const [backupMsg, setBackupMsg] = useState('');
  const [restoreText, setRestoreText] = useState('');
  const [confirmingRestore, setConfirmingRestore] = useState(false);

  useEffect(() => {
    if (!API_URL || API_URL.indexOf('PASTE_YOUR') === 0) {
      setApiConfigured(false);
      setLoading(false);
      return;
    }
    (async () => {
      setLoading(true);
      try {
        const pRes = await api.get('players').catch(() => null);
        const dRes = await api.get(`daily:${dateKey}`).catch(() => null);
        const lRes = await api.get('updateLog').catch(() => null);
        const p = pRes ? JSON.parse(pRes.value) : {};
        setPlayers(p);
        setDaily(dRes ? JSON.parse(dRes.value) : { attendance: {}, teams: null, predictions: {}, result: null });
        setLogs(lRes ? JSON.parse(lRes.value) : []);
        const savedId = localStorage.getItem('currentPlayerId');
        if (savedId && p[savedId]) setCurrentPlayerId(savedId);
      } catch (e) {
        console.error(e);
      } finally {
        setLoading(false);
      }
    })();
  }, [dateKey]);

  useEffect(() => {
    if (!apiConfigured) return;
    const id = setInterval(async () => {
      try {
        const pRes = await api.get('players').catch(() => null);
        const dRes = await api.get(`daily:${dateKey}`).catch(() => null);
        const lRes = await api.get('updateLog').catch(() => null);
        if (pRes) setPlayers(JSON.parse(pRes.value));
        if (dRes) setDaily(JSON.parse(dRes.value));
        if (lRes) setLogs(JSON.parse(lRes.value));
      } catch (e) { /* silent */ }
    }, 8000);
    return () => clearInterval(id);
  }, [dateKey, apiConfigured]);

  const manualRefresh = async () => {
    setBusy(true);
    try {
      const pRes = await api.get('players').catch(() => null);
      const dRes = await api.get(`daily:${dateKey}`).catch(() => null);
      const lRes = await api.get('updateLog').catch(() => null);
      if (pRes) setPlayers(JSON.parse(pRes.value));
      if (dRes) setDaily(JSON.parse(dRes.value));
      if (lRes) setLogs(JSON.parse(lRes.value));
    } finally {
      setBusy(false);
    }
  };

  const savePlayers = async (next) => {
    setPlayers(next);
    await apiSetWithRetry('players', JSON.stringify(next));
  };
  const saveDaily = async (next) => {
    setDaily(next);
    await apiSetWithRetry(`daily:${dateKey}`, JSON.stringify(next));
  };
  const saveLogs = async (next) => {
    setLogs(next);
    await apiSetWithRetry('updateLog', JSON.stringify(next));
  };

  const handleRegister = async () => {
    setError('');
    const name = regName.trim();
    const empId = regEmpId.trim();
    if (!name || !empId || !regPassword) { setError('이름, 사번, 비밀번호를 모두 입력해주세요.'); return; }
    if (regPassword.length < 4) { setError('비밀번호는 4자 이상으로 설정해주세요.'); return; }
    if (regPassword !== regPasswordConfirm) { setError('비밀번호가 일치하지 않습니다.'); return; }
    setBusy(true);
    try {
      const pRes = await api.get('players').catch(() => null);
      const fresh = pRes ? JSON.parse(pRes.value) : {};
      if (fresh[empId]) { setError('이미 등록된 사번입니다. 로그인해주세요.'); return; }
      const { hash, method } = await hashPassword(regPassword);
      const newPlayer = {
        id: empId, name, employeeId: empId, passwordHash: hash, passwordMethod: method,
        position: regPosition, wins: 0, losses: 0, predictionScore: 0,
        isAdmin: Object.keys(fresh).length === 0,
        createdAt: new Date().toISOString(),
      };
      const next = { ...fresh, [empId]: newPlayer };
      await savePlayers(next);
      localStorage.setItem('currentPlayerId', empId);
      setCurrentPlayerId(empId);
      setRegName(''); setRegEmpId(''); setRegPassword(''); setRegPasswordConfirm('');
    } catch (e) {
      setError(`가입 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handleLogin = async () => {
    setError('');
    const empId = loginEmpId.trim();
    if (!empId || !loginPassword) { setError('사번과 비밀번호를 입력해주세요.'); return; }
    setBusy(true);
    try {
      const pRes = await api.get('players').catch(() => null);
      const fresh = pRes ? JSON.parse(pRes.value) : {};
      setPlayers(fresh);
      const player = fresh[empId];
      if (!player) { setError('등록되지 않은 사번입니다. 회원가입을 먼저 해주세요.'); return; }
      const ok = await verifyPassword(loginPassword, player);
      if (!ok) { setError('비밀번호가 일치하지 않습니다.'); return; }
      localStorage.setItem('currentPlayerId', empId);
      setCurrentPlayerId(empId);
      setLoginEmpId(''); setLoginPassword('');
    } catch (e) {
      setError(`로그인 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handleLogout = () => {
    localStorage.removeItem('currentPlayerId');
    setCurrentPlayerId(null);
    setTab('today');
  };

  const me = currentPlayerId ? players[currentPlayerId] : null;

  const attendeeIds = Object.keys(daily.attendance || {}).filter((id) => daily.attendance[id]);
  const attendeePlayers = attendeeIds.map((id) => players[id]).filter(Boolean);
  const iAttend = currentPlayerId ? !!daily.attendance?.[currentPlayerId] : false;

  const sortedHistory = [...(me?.history || [])].sort((a, b) => (a.date < b.date ? 1 : -1));
  const totalPredictionsMade = (me?.history || []).filter((h) => h.predicted).length;
  const predictionAccuracyLabel = totalPredictionsMade === 0 ? '-' : `${Math.round(((me?.predictionScore || 0) / totalPredictionsMade) * 100)}%`;

  const handleToggleAttendance = async () => {
    if (daily.result?.finalized) return;
    setBusy(true);
    try {
      const next = { ...(daily.attendance || {}) };
      if (next[currentPlayerId]) delete next[currentPlayerId]; else next[currentPlayerId] = true;
      await saveDaily({ ...daily, attendance: next });
    } catch (e) {
      setError(`출석 처리 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handleGenerateTeams = async () => {
    if (attendeePlayers.length < 2) { setError('팀을 나누려면 최소 2명 이상 참석해야 해요.'); return; }
    setError('');
    setBusy(true);
    try {
      const teams = generateTeams(attendeePlayers);
      await saveDaily({ ...daily, teams, predictions: {}, result: null });
    } catch (e) {
      setError(`팀 나누기 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handlePredict = async (team) => {
    if (!daily.teams || daily.result?.finalized) return;
    setBusy(true);
    try {
      const next = { ...(daily.predictions || {}), [currentPlayerId]: team };
      await saveDaily({ ...daily, predictions: next });
    } catch (e) {
      setError(`예측 저장 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handleSubmitResult = async (winner) => {
    if (!daily.teams || daily.result?.finalized) return;
    setBusy(true);
    try {
      const allIds = new Set([...daily.teams.A, ...daily.teams.B, ...Object.keys(daily.predictions || {})]);
      const nextPlayers = { ...players };
      const deltas = [];

      allIds.forEach((id) => {
        if (!nextPlayers[id]) return;
        const onA = daily.teams.A.includes(id);
        const onB = daily.teams.B.includes(id);
        const team = onA ? 'A' : (onB ? 'B' : null);
        const predicted = daily.predictions?.[id] || null;
        const won = team ? team === winner : null;
        const predictionCorrect = predicted ? predicted === winner : null;

        const winsDelta = won === true ? 1 : 0;
        const lossesDelta = won === false ? 1 : 0;
        const predictionScoreDelta = predictionCorrect ? 1 : 0;

        const historyEntry = { date: dateKey, team, result: team ? (won ? 'win' : 'loss') : null, predicted, predictionCorrect };

        nextPlayers[id] = {
          ...nextPlayers[id],
          wins: (nextPlayers[id].wins || 0) + winsDelta,
          losses: (nextPlayers[id].losses || 0) + lossesDelta,
          predictionScore: (nextPlayers[id].predictionScore || 0) + predictionScoreDelta,
          history: [...(nextPlayers[id].history || []), historyEntry],
        };
        deltas.push({ playerId: id, winsDelta, lossesDelta, predictionScoreDelta });
      });

      await savePlayers(nextPlayers);
      const result = { winner, finalized: true, timestamp: new Date().toISOString(), enteredBy: me?.name || currentPlayerId };
      await saveDaily({ ...daily, result });

      const logEntry = {
        id: `${dateKey}-${Date.now()}`, date: dateKey, timestamp: new Date().toISOString(),
        adminName: me?.name || currentPlayerId, winner, playerDeltas: deltas, undone: false,
      };
      await saveLogs([logEntry, ...logs]);
      setConfirmingWinner(null);
    } catch (e) {
      setError(`결과 입력 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handleUndo = async (logId) => {
    const entry = logs.find((l) => l.id === logId);
    if (!entry || entry.undone) return;
    setBusy(true);
    try {
      const pRes = await api.get('players').catch(() => null);
      const freshPlayers = pRes ? JSON.parse(pRes.value) : players;
      const nextPlayers = { ...freshPlayers };
      entry.playerDeltas.forEach((d) => {
        if (!nextPlayers[d.playerId]) return;
        const filteredHistory = (nextPlayers[d.playerId].history || []).filter((h) => h.date !== entry.date);
        nextPlayers[d.playerId] = {
          ...nextPlayers[d.playerId],
          wins: (nextPlayers[d.playerId].wins || 0) - d.winsDelta,
          losses: (nextPlayers[d.playerId].losses || 0) - d.lossesDelta,
          predictionScore: (nextPlayers[d.playerId].predictionScore || 0) - d.predictionScoreDelta,
          history: filteredHistory,
        };
      });
      await savePlayers(nextPlayers);

      if (entry.date === dateKey) {
        await saveDaily({ ...daily, result: null });
      } else {
        const dRes = await api.get(`daily:${entry.date}`).catch(() => null);
        if (dRes) {
          const dayData = JSON.parse(dRes.value);
          dayData.result = null;
          await apiSetWithRetry(`daily:${entry.date}`, JSON.stringify(dayData));
        }
      }

      const nextLogs = logs.map((l) => (l.id === logId ? { ...l, undone: true } : l));
      await saveLogs(nextLogs);
    } catch (e) {
      setError(`취소 처리 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handleClaimAdmin = async () => {
    setError('');
    if (adminCodeInput !== ADMIN_CODE) { setError('관리자 코드가 올바르지 않습니다.'); return; }
    setBusy(true);
    try {
      const next = { ...players, [currentPlayerId]: { ...players[currentPlayerId], isAdmin: true } };
      await savePlayers(next);
      setShowAdminClaim(false);
      setAdminCodeInput('');
    } catch (e) {
      setError(`관리자 등록 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handlePositionChange = async (newPos) => {
    try {
      const next = { ...players, [currentPlayerId]: { ...players[currentPlayerId], position: newPos } };
      await savePlayers(next);
    } catch (e) {
      setError(`포지션 변경 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    }
  };

  const handleChangePassword = async () => {
    setError('');
    setPwChangeMsg('');
    if (!curPassword || !newPassword || !newPasswordConfirm) { setError('현재 비밀번호와 새 비밀번호를 모두 입력해주세요.'); return; }
    if (newPassword.length < 4) { setError('새 비밀번호는 4자 이상으로 설정해주세요.'); return; }
    if (newPassword !== newPasswordConfirm) { setError('새 비밀번호가 일치하지 않습니다.'); return; }
    setBusy(true);
    try {
      const pRes = await api.get('players').catch(() => null);
      const fresh = pRes ? JSON.parse(pRes.value) : players;
      const player = fresh[currentPlayerId];
      if (!player) { setError('내 정보를 찾을 수 없습니다.'); return; }
      const ok = await verifyPassword(curPassword, player);
      if (!ok) { setError('현재 비밀번호가 일치하지 않습니다.'); return; }
      const { hash, method } = await hashPassword(newPassword);
      const next = { ...fresh, [currentPlayerId]: { ...player, passwordHash: hash, passwordMethod: method } };
      await savePlayers(next);
      setCurPassword(''); setNewPassword(''); setNewPasswordConfirm('');
      setShowChangePassword(false);
      setPwChangeMsg('비밀번호가 변경됐어요.');
    } catch (e) {
      setError(`비밀번호 변경 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handleExportData = async () => {
    setError('');
    setBackupMsg('');
    setBusy(true);
    try {
      const pRes = await api.get('players').catch(() => null);
      const lRes = await api.get('updateLog').catch(() => null);
      const listRes = await api.list('daily:').catch(() => null);

      const dailyData = {};
      let skipped = 0;
      if (listRes?.keys) {
        for (const key of listRes.keys) {
          try {
            const dRes = await api.get(key);
            if (dRes) dailyData[key.replace('daily:', '')] = JSON.parse(dRes.value);
          } catch (e) {
            skipped += 1;
          }
        }
      }

      const backup = {
        version: 1,
        exportedAt: new Date().toISOString(),
        players: pRes ? JSON.parse(pRes.value) : {},
        updateLog: lRes ? JSON.parse(lRes.value) : [],
        daily: dailyData,
      };

      setBackupText(JSON.stringify(backup));
      const dayCount = Object.keys(dailyData).length;
      setBackupMsg(`백업 완료 (선수 ${Object.keys(backup.players).length}명, 경기기록 ${dayCount}일치${skipped ? `, ${skipped}일 누락` : ''})`);
    } catch (e) {
      setError(`백업 생성 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handleCopyBackup = async () => {
    try {
      await navigator.clipboard.writeText(backupText);
      setBackupMsg('클립보드에 복사했어요.');
    } catch (e) {
      setBackupMsg('자동 복사가 안 되면 위 텍스트 상자를 길게 눌러 전체 선택 후 복사해주세요.');
    }
  };

  const handleRestoreData = async () => {
    setError('');
    setBackupMsg('');
    let parsed;
    try {
      parsed = JSON.parse(restoreText.trim());
    } catch (e) {
      setError('백업 텍스트 형식이 올바르지 않습니다. 전체를 정확히 복사했는지 확인해주세요.');
      return;
    }
    if (!parsed || typeof parsed.players !== 'object') {
      setError('백업 데이터에 선수 정보가 없습니다. 올바른 백업 텍스트인지 확인해주세요.');
      return;
    }
    setBusy(true);
    try {
      await apiSetWithRetry('players', JSON.stringify(parsed.players || {}));
      await apiSetWithRetry('updateLog', JSON.stringify(parsed.updateLog || []));
      const dailyEntries = Object.entries(parsed.daily || {});
      for (const [date, data] of dailyEntries) {
        await apiSetWithRetry(`daily:${date}`, JSON.stringify(data));
      }
      setPlayers(parsed.players || {});
      setLogs(parsed.updateLog || []);
      if (parsed.daily && parsed.daily[dateKey]) setDaily(parsed.daily[dateKey]);

      if (!parsed.players[currentPlayerId]) {
        localStorage.removeItem('currentPlayerId');
        setCurrentPlayerId(null);
      }

      setRestoreText('');
      setConfirmingRestore(false);
      setBackupMsg(`복원 완료 (선수 ${Object.keys(parsed.players || {}).length}명, 경기기록 ${dailyEntries.length}일치 불러옴)`);
    } catch (e) {
      setError(`복원 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const rankedPlayers = Object.values(players).sort((a, b) => {
    if (rankMode === 'winrate') {
      const wr = winRate(b) - winRate(a);
      if (wr !== 0) return wr;
      return (b.wins + b.losses) - (a.wins + a.losses);
    }
    return (b.predictionScore || 0) - (a.predictionScore || 0);
  });

  if (!apiConfigured) {
    return (
      <div className="font-body min-h-screen bg-slate-900 flex items-center justify-center px-6">
        <div className="max-w-sm text-center">
          <p className="text-white font-bold text-lg mb-2">⚙️ 설정이 필요해요</p>
          <p className="text-slate-400 text-sm leading-relaxed">
            config.js 안의 <code className="bg-slate-800 text-orange-400 px-1.5 py-0.5 rounded text-xs">API_URL</code> 값을
            배포한 Apps Script 웹 앱 URL로 바꿔주세요.
          </p>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div className="min-h-screen bg-slate-50 flex items-center justify-center">
        <div className="flex flex-col items-center gap-3 text-slate-400">
          <Spinner size={28} dark />
          <span className="text-sm font-medium">불러오는 중...</span>
        </div>
      </div>
    );
  }

  if (!currentPlayerId) {
    return (
      <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center px-6 py-10">
        <div className="w-full max-w-sm">
          <div className="text-center mb-8">
            <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-600 mb-4 text-3xl">🏀</div>
            <h1 className="font-display text-3xl text-white tracking-wide">{CLUB_NAME}</h1>
            <p className="text-slate-400 text-sm mt-1 font-medium">출석 · 팀편성 · 승부예측</p>
          </div>

          <div className="bg-white rounded-2xl p-5 shadow-xl">
            <div className="flex rounded-lg bg-slate-100 p-1 mb-5">
              <button
                onClick={() => { setAuthMode('login'); setError(''); }}
                className={`flex-1 py-2 rounded-md text-sm font-bold transition ${authMode === 'login' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
              >
                로그인
              </button>
              <button
                onClick={() => { setAuthMode('register'); setError(''); }}
                className={`flex-1 py-2 rounded-md text-sm font-bold transition ${authMode === 'register' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
              >
                회원가입
              </button>
            </div>

            {authMode === 'login' ? (
              <div className="space-y-3">
                <input
                  value={loginEmpId} onChange={(e) => setLoginEmpId(e.target.value)}
                  placeholder="사번" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                <input
                  value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} type="password"
                  placeholder="비밀번호" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                {error && <p className="text-red-500 text-xs font-medium">{error}</p>}
                <button
                  onClick={handleLogin} disabled={busy}
                  className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-bold flex items-center justify-center gap-2 disabled:opacity-60"
                >
                  {busy ? <Spinner size={16} /> : '로그인하기'}
                </button>
              </div>
            ) : (
              <div className="space-y-3">
                <input value={regName} onChange={(e) => setRegName(e.target.value)} placeholder="이름" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regEmpId} onChange={(e) => setRegEmpId(e.target.value)} placeholder="사번" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <div className="flex gap-2">
                  {POSITIONS.map((pos) => (
                    <button
                      key={pos} onClick={() => setRegPosition(pos)}
                      className={`flex-1 py-2 rounded-lg text-xs font-bold border ${regPosition === pos ? 'bg-orange-600 text-white border-orange-600' : 'border-slate-200 text-slate-500'}`}
                    >
                      {pos}
                    </button>
                  ))}
                </div>
                <input value={regPassword} onChange={(e) => setRegPassword(e.target.value)} type="password" placeholder="비밀번호 (4자 이상)" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regPasswordConfirm} onChange={(e) => setRegPasswordConfirm(e.target.value)} type="password" placeholder="비밀번호 확인" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                {error && <p className="text-red-500 text-xs font-medium">{error}</p>}
                <button onClick={handleRegister} disabled={busy} className="w-full bg-orange-600 text-white rounded-lg py-2.5 text-sm font-bold flex items-center justify-center gap-2 disabled:opacity-60">
                  {busy ? <Spinner size={16} /> : '가입하기'}
                </button>
              </div>
            )}
          </div>
          <p className="text-center text-slate-500 text-xs mt-5 leading-relaxed">
            가장 먼저 가입하는 사람이 자동으로 관리자가 돼요.<br />비밀번호는 팀 내부용으로 간단히 보호되니 다른 곳과 같은 비밀번호는 피해주세요.
          </p>
          {!isStandaloneApp() && (
            <button onClick={openInstallPrompt} className="w-full mt-4 py-2 text-center text-orange-400 text-sm font-bold">
              📲 홈 화면에 앱으로 설치하기
            </button>
          )}
        </div>
      </div>
    );
  }

  if (!me) {
    return (
      <div className="min-h-screen bg-slate-50 flex items-center justify-center">
        <Spinner size={24} dark />
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-200">
      <div className="max-w-md mx-auto min-h-screen bg-slate-50 pb-24 relative shadow-xl">

        <div className="bg-slate-900 px-4 pt-5 pb-4 sticky top-0 z-10">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-orange-600 flex items-center justify-center text-base">🏀</div>
              <h1 className="font-display text-lg text-white tracking-wide">{CLUB_NAME}</h1>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={manualRefresh} className="text-slate-400 text-lg" aria-label="새로고침">🔄</button>
              <button onClick={handleLogout} className="text-slate-400 text-lg" aria-label="로그아웃">🚪</button>
            </div>
          </div>
          <button onClick={() => setTab('mypage')} className="flex items-center gap-2 mt-4">
            <Avatar name={me.name} size="sm" tone="bg-orange-600" />
            <div className="text-left">
              <p className="text-white text-sm font-bold leading-tight">
                {me.name}{me.isAdmin && <span className="ml-1 text-xs text-orange-400 font-bold">관리자</span>}
              </p>
              <p className="text-slate-400 text-xs font-medium">{me.position}</p>
            </div>
          </button>
        </div>

        <div className="px-4 pt-4">
          {error && (
            <div className="bg-red-50 text-red-600 text-xs font-medium px-3 py-2 rounded-lg mb-3">{error}</div>
          )}

          {tab === 'today' && (
            <div className="space-y-4">
              <p className="text-slate-400 text-xs font-bold tracking-wide">{formatDateLabel(dateKey)} 오늘의 경기</p>

              <div className="bg-white rounded-2xl p-4 shadow-sm">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-1.5 text-slate-800 font-bold text-sm">
                    👥 참석 인원 {attendeePlayers.length}명
                  </div>
                  {!daily.result?.finalized && (
                    <button
                      onClick={handleToggleAttendance} disabled={busy}
                      className={`text-xs font-bold px-4 py-2 rounded-full ${iAttend ? 'bg-slate-100 text-slate-500' : 'bg-orange-600 text-white'}`}
                    >
                      {iAttend ? '✕ 참석 취소' : '✓ 참석하기'}
                    </button>
                  )}
                </div>
                {attendeePlayers.length > 0 ? (
                  <div className="flex flex-wrap gap-2">
                    {attendeePlayers.map((p) => (
                      <div key={p.id} className="flex items-center gap-1 bg-slate-50 rounded-full pl-1 pr-2.5 py-1">
                        <Avatar name={p.name} size="sm" />
                        <span className="text-xs font-semibold text-slate-700">{p.name}</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p className="text-slate-400 text-xs">아직 참석 인원이 없어요. 참석 버튼을 눌러보세요!</p>
                )}
              </div>

              {me.isAdmin && !daily.teams && (
                <button
                  onClick={handleGenerateTeams} disabled={busy || attendeePlayers.length < 2}
                  className="w-full bg-slate-900 text-white rounded-xl py-3 text-sm font-bold flex items-center justify-center gap-2 disabled:opacity-40"
                >
                  👥 팀 나누기
                </button>
              )}

              {daily.teams && (
                <div className="bg-white rounded-2xl overflow-hidden shadow-sm">
                  <div className="bg-slate-900 py-3 flex items-center justify-center gap-3">
                    <span className="font-display text-xl text-blue-400">TEAM A</span>
                    <span className="font-display text-lg text-slate-500">VS</span>
                    <span className="font-display text-xl text-orange-400">TEAM B</span>
                  </div>
                  <div className="grid grid-cols-2 divide-x divide-slate-100">
                    <div className="p-3">
                      {daily.teams.A.map((id) => <PlayerRow key={id} player={players[id]} tone="bg-blue-600" />)}
                    </div>
                    <div className="p-3">
                      {daily.teams.B.map((id) => <PlayerRow key={id} player={players[id]} tone="bg-orange-600" />)}
                    </div>
                  </div>
                  {me.isAdmin && !daily.result?.finalized && (
                    <button onClick={handleGenerateTeams} disabled={busy} className="w-full py-2.5 text-xs font-bold text-slate-500 border-t border-slate-100">
                      ↻ 팀 다시 나누기 (예측 초기화)
                    </button>
                  )}
                </div>
              )}

              {daily.teams && (
                <div className="bg-white rounded-2xl p-4 shadow-sm">
                  <p className="text-slate-800 font-bold text-sm mb-3">승부예측</p>
                  <div className="grid grid-cols-2 gap-2">
                    {['A', 'B'].map((team) => {
                      const count = Object.values(daily.predictions || {}).filter((v) => v === team).length;
                      const mine = daily.predictions?.[currentPlayerId] === team;
                      const locked = daily.result?.finalized;
                      return (
                        <button
                          key={team}
                          onClick={() => handlePredict(team)}
                          disabled={busy || locked}
                          className={`rounded-xl py-3 text-center border-2 transition ${mine ? (team === 'A' ? 'border-blue-600 bg-blue-50' : 'border-orange-600 bg-orange-50') : 'border-slate-100'} disabled:opacity-70`}
                        >
                          <p className={`font-display text-lg ${team === 'A' ? 'text-blue-600' : 'text-orange-600'}`}>{team}팀 승리</p>
                          <p className="text-slate-400 text-xs font-medium mt-0.5">{count}표{mine && ' · 내 예측'}</p>
                        </button>
                      );
                    })}
                  </div>
                  {daily.result?.finalized && (
                    <p className="text-center text-xs font-bold mt-3">
                      {daily.predictions?.[currentPlayerId]
                        ? (daily.predictions[currentPlayerId] === daily.result.winner
                            ? <span className="text-emerald-600">내 예측 적중! 🎉</span>
                            : <span className="text-slate-400">내 예측은 빗나갔어요</span>)
                        : <span className="text-slate-400">이번 경기는 예측하지 않았어요</span>}
                    </p>
                  )}
                </div>
              )}

              {me.isAdmin && daily.teams && !daily.result?.finalized && (
                <div className="bg-white rounded-2xl p-4 shadow-sm">
                  <p className="text-slate-800 font-bold text-sm mb-3">경기 결과 입력</p>
                  {!confirmingWinner ? (
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={() => setConfirmingWinner('A')} className="bg-blue-600 text-white rounded-xl py-2.5 text-sm font-bold">A팀 승리</button>
                      <button onClick={() => setConfirmingWinner('B')} className="bg-orange-600 text-white rounded-xl py-2.5 text-sm font-bold">B팀 승리</button>
                    </div>
                  ) : (
                    <div className="bg-slate-50 rounded-xl p-3 text-center">
                      <p className="text-sm font-bold text-slate-700 mb-3">{confirmingWinner}팀 승리로 확정할까요?</p>
                      <div className="grid grid-cols-2 gap-2">
                        <button onClick={() => setConfirmingWinner(null)} className="py-2 rounded-lg text-sm font-bold text-slate-500 bg-white">취소</button>
                        <button onClick={() => handleSubmitResult(confirmingWinner)} disabled={busy} className="py-2 rounded-lg text-sm font-bold text-white bg-slate-900">확정</button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {daily.result?.finalized && (
                <div className={`rounded-2xl p-4 text-center ${daily.result.winner === 'A' ? 'bg-blue-600' : 'bg-orange-600'}`}>
                  <p className="text-white text-xs font-bold opacity-80">경기 종료</p>
                  <p className="font-display text-2xl text-white mt-0.5">{daily.result.winner}팀 승리</p>
                  <p className="text-white text-xs mt-1 opacity-80">{formatDateTime(daily.result.timestamp)} 기록</p>
                </div>
              )}
            </div>
          )}

          {tab === 'ranking' && (
            <div className="space-y-3">
              <div className="flex rounded-lg bg-slate-100 p-1">
                <button onClick={() => setRankMode('winrate')} className={`flex-1 py-2 rounded-md text-xs font-bold ${rankMode === 'winrate' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}>승률순</button>
                <button onClick={() => setRankMode('prediction')} className={`flex-1 py-2 rounded-md text-xs font-bold ${rankMode === 'prediction' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}>예측왕순</button>
              </div>
              <div className="bg-white rounded-2xl shadow-sm divide-y divide-slate-100">
                {rankedPlayers.length === 0 && <p className="text-slate-400 text-xs p-4 text-center">등록된 선수가 없어요.</p>}
                {rankedPlayers.map((p, idx) => (
                  <div key={p.id} className={`flex items-center gap-3 px-4 py-3 ${p.id === currentPlayerId ? 'bg-orange-50' : ''}`}>
                    <span className={`font-display text-sm w-5 text-center ${idx === 0 ? 'text-amber-500' : 'text-slate-300'}`}>{idx + 1}</span>
                    <Avatar name={p.name} size="sm" tone={idx === 0 ? 'bg-amber-500' : 'bg-slate-700'} />
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-1.5">

// ============================================================
// 앱 설치 팝업 ("설치하시겠습니까?")
// ============================================================
const INSTALL_DISMISS_KEY = 'installPromptDismissedAt';
const INSTALL_DISMISS_MS = 24 * 60 * 60 * 1000; // '나중에'를 누르면 하루 동안 자동으로 안 띄움

function getInstallEnv() {
  const ua = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);
  const isKakao = /KAKAOTALK/i.test(ua);
  const isInApp = isKakao
    || /NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua)
    || (isAndroid && /; wv\)/i.test(ua));
  return { isIOS, isAndroid, isKakao, isInApp };
}

function recentlyDismissed() {
  try {
    const t = Number(localStorage.getItem(INSTALL_DISMISS_KEY) || 0);
    return Date.now() - t < INSTALL_DISMISS_MS;
  } catch (e) {
    return false;
  }
}

function openInExternalBrowser(env) {
  const here = window.location.href;
  if (env.isKakao) {
    window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here);
  } else if (env.isAndroid) {
    const u = new URL(here);
    window.location.href = `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=https;package=com.android.chrome;end`;
  }
}

function StepList({ steps }) {
  return (
    <ol className="space-y-2 text-left">
      {steps.map((s, i) => (
        <li key={i} className="flex gap-3 items-start bg-slate-50 rounded-xl px-3 py-2.5">
          <span className="w-5 h-5 rounded-full bg-orange-600 text-white text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">{i + 1}</span>
          <span className="text-sm text-slate-700 leading-relaxed">{s}</span>
        </li>
      ))}
    </ol>
  );
}

function InstallPrompt() {
  const [env] = useState(() => getInstallEnv());
  const [open, setOpen] = useState(false);
  const [mode, setMode] = useState('ask'); // ask: 물어보기 / guide: 설치 방법 안내 / installed: 설치 완료
  const [oneTapReady, setOneTapReady] = useState(() => !!window.__deferredInstallPrompt);
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (isStandaloneApp()) return undefined; // 이미 설치된 앱으로 실행 중이면 아무것도 안 띄움

    const onAvailable = () => {
      setOneTapReady(true);
      if (!recentlyDismissed()) setOpen(true);
    };
    const onInstalled = () => { setMode('installed'); setOpen(true); };
    const onManualOpen = () => { setMode('ask'); setOpen(true); };

    window.addEventListener('install-available', onAvailable);
    window.addEventListener('appinstalled', onInstalled);
    window.addEventListener('open-install-prompt', onManualOpen);

    // 카카오톡 안의 브라우저에서는 설치가 안 되니 외부 브라우저로 자동 전환
    if (env.isKakao) openInExternalBrowser(env);

    let timer;
    if (!recentlyDismissed() && (env.isIOS || env.isAndroid || env.isInApp || window.__deferredInstallPrompt)) {
      timer = setTimeout(() => setOpen(true), 700);
    }

    return () => {
      clearTimeout(timer);
      window.removeEventListener('install-available', onAvailable);
      window.removeEventListener('appinstalled', onInstalled);
      window.removeEventListener('open-install-prompt', onManualOpen);
    };
  }, []);

  const dismiss = () => {
    try { localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now())); } catch (e) { /* 무시 */ }
    setOpen(false);
  };

  const handleYes = async () => {
    const dp = window.__deferredInstallPrompt;
    if (!dp) { setMode('guide'); return; }
    try {
      dp.prompt(); // 브라우저 자체 설치 확인창이 뜸
      const choice = await dp.userChoice;
      window.__deferredInstallPrompt = null;
      setOneTapReady(false);
      if (choice && choice.outcome === 'accepted') setMode('installed');
      else setOpen(false);
    } catch (e) {
      setMode('guide');
    }
  };

  const copyLink = async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      setCopied(true);
    } catch (e) {
      setCopied(false);
    }
  };

  if (!open) return null;

  const primaryBtn = 'w-full bg-orange-600 text-white rounded-xl py-3 text-sm font-bold';
  const secondaryBtn = 'w-full bg-slate-100 text-slate-500 rounded-xl py-3 text-sm font-bold';

  let title;
  let body;
  let actions;

  if (mode === 'installed') {
    title = '설치 완료! 🎉';
    body = (
      <p className="text-sm text-slate-500 leading-relaxed">
        홈 화면(또는 앱 목록)에 생긴 🏀 아이콘으로 열어주세요.<br />다음부터는 링크 없이 아이콘만 누르면 돼요.
      </p>
    );
    actions = <button onClick={() => setOpen(false)} className={primaryBtn}>확인</button>;
  } else if (env.isInApp) {
    title = '브라우저에서 열어주세요';
    if (env.isKakao || env.isAndroid) {
      body = (
        <p className="text-sm text-slate-500 leading-relaxed">
          {env.isKakao ? '카카오톡' : '지금 앱'} 안에서는 설치가 안 돼요.<br />아래 버튼을 눌러 {env.isKakao ? '브라우저' : 'Chrome'}로 열어주세요.
        </p>
      );
      actions = (
        <div className="space-y-2">
          <button onClick={() => openInExternalBrowser(env)} className={primaryBtn}>
            {env.isKakao ? '브라우저로 열기' : 'Chrome으로 열기'}
          </button>
          <button onClick={dismiss} className={secondaryBtn}>닫기</button>
        </div>
      );
    } else {
      body = (
        <div className="space-y-3">
          <p className="text-sm text-slate-500 leading-relaxed">지금 앱 안에서는 설치가 안 돼요.</p>
          <StepList steps={['화면의 ••• 또는 공유 메뉴를 누르세요', "'Safari로 열기'를 누르세요", '열린 Safari에서 설치를 진행하세요']} />
          {copied && <p className="text-emerald-600 text-xs font-medium">링크를 복사했어요. Safari 주소창에 붙여넣어도 돼요.</p>}
        </div>
      );
      actions = (
        <div className="space-y-2">
          <button onClick={copyLink} className={primaryBtn}>링크 복사하기</button>
          <button onClick={dismiss} className={secondaryBtn}>닫기</button>
        </div>
      );
    }
  } else if (mode === 'ask') {
    title = `${CLUB_NAME} 앱을 설치하시겠습니까?`;
    body = (
      <p className="text-sm text-slate-500 leading-relaxed">
        홈 화면에 아이콘이 생기고, 주소창 없이 앱처럼 열려요.
      </p>
    );
    actions = (
      <div className="grid grid-cols-2 gap-2">
        <button onClick={dismiss} className={secondaryBtn}>나중에</button>
        <button onClick={handleYes} className={primaryBtn}>예, 설치할게요</button>
      </div>
    );
  } else {
    // guide: 버튼 한 번으로 설치할 수 없는 경우 직접 설치하는 방법 안내
    let steps;
    if (env.isIOS) {
      title = '두 번만 더 누르면 설치돼요';
      steps = [
        '화면 아래 공유 버튼(□↑)을 누르세요. 안 보이면 ••• 버튼 → 공유',
        "목록에서 '홈 화면에 추가'를 누르세요",
        "오른쪽 위 '추가'를 누르면 끝!",
      ];
    } else if (env.isAndroid) {
      title = '메뉴에서 설치해주세요';
      steps = [
        '오른쪽 위 ⋮ 메뉴를 누르세요 (삼성 인터넷은 아래 ≡ 메뉴)',
        "'앱 설치' 또는 '홈 화면에 추가'를 누르세요",
        "'설치'를 누르면 끝!",
      ];
    } else {
      title = '브라우저 메뉴에서 설치해주세요';
      steps = [
        '주소창 오른쪽의 설치 아이콘을 누르거나, 브라우저 메뉴(⋮)를 여세요',
        "'앱 설치' 또는 '홈 화면에 추가'를 누르세요",
      ];
    }
    body = (
      <div>
        <StepList steps={steps} />
        {env.isIOS && <div className="text-2xl mt-3 animate-bounce" aria-hidden="true">👇</div>}
      </div>
    );
    actions = (
      <div className="space-y-2">
        {oneTapReady && !env.isIOS && (
          <button onClick={handleYes} className={primaryBtn}>바로 설치하기</button>
        )}
        <button onClick={dismiss} className={secondaryBtn}>닫기</button>
      </div>
    );
  }

  return (
    <div
      className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 px-4"
      style={{ paddingBottom: 'calc(1rem + env(safe-area-inset-bottom))' }}
      onClick={() => (mode === 'installed' ? setOpen(false) : dismiss())}
    >
      <div
        className="w-full max-w-sm bg-white rounded-3xl p-5 shadow-2xl text-center"
        onClick={(e) => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
      >
        <img src="icon-192.png" alt="" className="w-16 h-16 rounded-2xl mx-auto mb-3 shadow" />
        <p className="text-slate-900 font-bold text-base mb-2">{title}</p>
        <div className="mb-4">{body}</div>
        {actions}
      </div>
    </div>
  );
}

function Root() {
  return (
    <React.Fragment>
      <BasketballClubApp />
      <InstallPrompt />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
