        : [{ key: dk, path: ['predictionResult', 'finalized'], equals: true }]);
      applyValues(res.values);
      return { applied: res.applied };
    } finally {
      pendingRef.current -= 1;
    }
  };

  const handleClosePredictions = async () => {
    setError('');
    setBusy(true);
    try {
      const r = await closeDay(viewDate);
      if (r.reason === 'no-games') setError('오늘 팀끼리 기록된 경기가 없어요.');
      else if (r.reason === 'past-season') setError('지난 시즌 날짜는 마감할 수 없어요.');
      setConfirmingClose(false);
    } catch (e) {
      setError(`마감 처리 중 문제가 발생했습니다. (${serverErrorText(e)})`);
    } finally {
      setBusy(false);
    }
  };

  // ----- 자동 마감: 마감하지 않은 지난 날(최근 2주, 이번 시즌)을 찾아서 마감 -----
  // 오늘 팀끼리 경기 기록이 있는 지난 날만 마감해요. 단, 오늘 그날 기록을 입력하거나 고친 사람이 있으면
  // (지난 경기 사후입력 중) 하루 더 기다렸다가 마감해요. force면 기다리지 않고 마감 (시즌 종료 때)
  const autoCloseOpenDays = async ({ force = false, oncePerDay = false } = {}) => {
    if (!API_URL || API_URL.indexOf('PASTE_YOUR') === 0) return 0;
    // 앱을 열 때는 이 휴대폰에서 하루 한 번만 확인 (같은 날 다시 열면 추가 요청 없음)
    if (oncePerDay) {
      try {
        if (localStorage.getItem('autoCloseCheckedDate') === dateKey) return 0;
        localStorage.setItem('autoCloseCheckedDate', dateKey);
      } catch (e) { /* 저장이 막힌 환경이면 그냥 확인 */ }
    }
    const dates = [];
    for (let i = 1; i <= 14; i++) dates.push(shiftDate(dateKey, -i));
    const values = await api.getMany(['seasons', ...dates.map((d) => `daily:${d}`)]);
    const season = currentSeasonOf(parseJson(values.seasons, null));
    const open = dates.filter((d) => {
      if (season.startDate && d < season.startDate) return false;
      const day = parseJson(values[`daily:${d}`], null);
      if (!day || !day.teams || day.predictionResult?.finalized || day.result?.finalized) return false;
      const recs = day.records || [];
      if (!recs.some((r) => r.fromTeams)) return false; // 팀끼리 경기가 없으면 정산할 것이 없음 (사후입력 가능하게 열어둠)
      if (force) return true;
      const touchedToday = recs.some((r) => dateKeyOf(r.editedAt || r.createdAt || 0) >= dateKey);
      return !touchedToday;
    });
    let closed = 0;
    for (const d of open.sort()) {
      const r = await closeDay(d, { auto: true });
      if (r.applied) closed += 1;
    }
    return closed;
  };
  autoCloseRef.current = autoCloseOpenDays;

  // ----- 예측 점수 배당 재계산 -----
  // 배당 기능이 생기기 전에 마감된 이번 시즌의 날들을, 그날 투표 수로 배당을 계산해서 다시 매겨요.
  // 그때 받은 적중 점수와의 차이만큼만 더하고, 다시 계산한 날에는 표시를 남겨서 두 번 계산되지 않아요.
  // 개인 기록과 마감 로그의 점수도 함께 고쳐서, 나중에 그날 마감을 취소해도 정확히 되돌아가요.
  const recalcOddsPoints = async ({ auto = false } = {}) => {
    if (!API_URL || API_URL.indexOf('PASTE_YOUR') === 0) return null;
    const head = await api.getMany(['seasons', 'meta', 'players', 'updateLog']);
    const meta = parseJson(head.meta, {}) || {};
    if (auto && meta.oddsRecalcDone) return null;
    const season = currentSeasonOf(parseJson(head.seasons, null));
    const startAt = season.startAt ? new Date(season.startAt).getTime() : null;
    const keys = (await api.list('daily:')).filter((k) => k.slice('daily:'.length) <= dateKey);
    const dvals = keys.length ? await api.getMany(keys) : {};
    const freshPlayers = parsePlayers(head.players);
    const freshLogs = parseJson(head.updateLog, []);

    const delta = {};
    const histPatches = {};
    const logPatches = [];
    const ops = [];
    const requires = [];
    let days = 0;
    keys.forEach((k) => {
      const date = k.slice('daily:'.length);
      const day = parseJson(dvals[k], null);
      if (!day) return;
      const pr = day.predictionResult;
      const legacy = day.result;
      let winners;
      let ts;
      let field;
      let predictionId = null;
      if (pr?.finalized && !pr.void && !pr.odds) { winners = pr.winners || []; ts = pr.timestamp; field = 'predictionResult'; predictionId = pr.predictionId || null; }
      else if (!pr && legacy?.finalized && !legacy.odds) { winners = [legacy.winner]; ts = legacy.timestamp; field = 'result'; }
      else return;
      if (!winners.length) return;
      if (startAt && (!ts || new Date(ts).getTime() < startAt)) return; // 지난 시즌은 그대로
      const preds = day.predictions || {};
      const labels = TEAM_LABELS.filter((l) => day.teams?.[l]?.length);
      const pointsBy = {};
      Object.entries(preds).forEach(([pid, pick]) => {
        const credit = predictionCredit(pick, winners);
        const points = predictionPoints(pick, winners, preds);
        const odds = oddsFor(pick, preds);
        pointsBy[pid] = points;
        const d = r3(points - credit);
        if (d) delta[pid] = r3((delta[pid] || 0) + d);
        (histPatches[pid] = histPatches[pid] || []).push(predictionId
          ? { op: 'updateWhere', match: { predictionId }, set: { points, odds } }
          : { op: 'updateWhere', match: { date, kind: null }, set: { points, odds } });
      });
      ops.push({ key: k, type: 'json', patches: [{ op: 'set', path: [field, 'odds'], value: Object.fromEntries(labels.map((l) => [l, oddsFor(l, preds)])) }] });
      requires.push({ key: k, path: [field, 'odds'], absent: true });
      freshLogs
        .filter((l) => (predictionId ? l.predictionId === predictionId : (!l.type && l.date === date)))
        .forEach((l) => {
          const nd = (l.playerDeltas || []).map((d) => (d.playerId in pointsBy ? { ...d, predPointsDelta: pointsBy[d.playerId] } : d));
          logPatches.push({ op: 'updateWhere', match: { id: l.id }, set: { playerDeltas: nd } });
        });
      days += 1;
    });

    const changedIds = Object.keys(delta).filter((id) => freshPlayers[id]);
    if (changedIds.length) {
      ops.push({ key: 'players', type: 'json', patches: changedIds.map((id) => ({ op: 'set', path: [id, 'predPoints'], value: r3(predPointsOf(freshPlayers[id]) + delta[id]) })) });
    }
    Object.entries(histPatches).forEach(([pid, patches]) => ops.push({ key: `history:${pid}`, type: 'json', init: [], patches }));
    const nowIso = new Date().toISOString();
    if (days) {
      logPatches.push({ op: 'upsertById', prepend: true, limit: LOG_LIMIT, value: { id: uniqueId('recalc'), type: 'recalc', text: `이번 시즌 예측 ${days}일치를 배당 기준으로 다시 계산 (${changedIds.length}명 점수 변경)`, date: dateKey, season: season.number, timestamp: nowIso, adminName: auto ? '자동' : myName, undone: true } });
    }
    if (logPatches.length) ops.push({ key: 'updateLog', type: 'json', init: [], patches: logPatches });
    ops.push({ key: 'meta', type: 'json', patches: [{ op: 'set', path: ['oddsRecalcDone'], value: { at: nowIso, by: auto ? '자동' : myName, season: season.number, days } }] });
    pendingRef.current += 1;
    try {
      const res = await api.batchIf(ops, ['players', `daily:${viewDate}`, ...(tab === 'admin' ? ['updateLog'] : [])], requires);
      applyValues(res.values);
      return { applied: res.applied, days, changed: changedIds.length };
    } finally {
      pendingRef.current -= 1;
    }
  };
  recalcRef.current = recalcOddsPoints;

  const handleRecalcOdds = async () => {
    setError('');
    setRecalcMsg('');
    if (!can(me, 'undoLogs')) { setError('다시 계산할 권한이 없어요.'); return; }
    setBusy(true);
    try {
      const r = await recalcOddsPoints();
      if (!r) return;
      setRecalcMsg(!r.applied
        ? '방금 다른 곳에서 먼저 계산했어요. 다시 눌러 확인해주세요.'
        : r.days ? `${r.days}일치 예측을 배당 기준으로 다시 계산했어요. (${r.changed}명 점수 변경)` : '다시 계산할 예전 예측이 없어요. 모두 배당 기준이에요.');
    } catch (e) {
      setError(`다시 계산 중 문제가 발생했습니다. (${serverErrorText(e)})`);
    } finally {
      setBusy(false);
    }
  };

  // ----- 업데이트 로그에서 취소/삭제 (읽기 1번 + 저장 1번) -----
  const handleUndo = async (logId) => {
    setError('');
    const entry = logs.find((l) => l.id === logId);
    if (!entry || entry.undone) return;
    if ((entry.season || 1) < currentSeason.number) { setError('지난 시즌 기록은 바꿀 수 없어요.'); return; }
    const type = entry.type || 'legacy';
    setBusy(true);
    try {
      const dk = `daily:${entry.date}`;
      const fresh = await api.getMany(['players', dk]);
      const dayData = parseJson(fresh[dk], emptyDaily());
      const freshPlayers = await ensureMigrated(parsePlayers(fresh.players));
      const nextPlayers = { ...freshPlayers };
      const ops = [];
      let resettleAfter = null;

      if (type === 'record') {
        const rec = (dayData.records || []).find((r) => r.id === entry.recordId);
        if (rec?.fromTeams && dayData.predictionResult?.finalized) resettleAfter = entry.date;
        // 기록 삭제: 수정된 적이 있어도 지금 내용 그대로 되돌림
        if (rec) {
          const legacy = await loadLegacyHistories(rec);
          const applied = revertRecord(nextPlayers, rec, legacy);
          const ids = Object.keys(applied);
          ops.push({ key: 'players', type: 'json', patches: playerFieldPatches(nextPlayers, ids, RECORD_FIELDS) });
          ids.forEach((id) => ops.push({ key: `history:${id}`, type: 'json', init: [], patches: [{ op: 'removeWhere', match: { recordId: rec.id } }] }));
          ops.push({ key: dk, type: 'json', patches: [{ op: 'removeById', path: ['records'], id: rec.id }] });
        }
        ops.push({ key: 'updateLog', type: 'json', init: [], patches: [{ op: 'updateWhere', match: { recordId: entry.recordId }, set: { undone: true, deleted: true } }] });
      } else {
        // 예측 마감 취소, 또는 예전 방식(하루 1경기) 결과 취소: 기록해둔 변화량만큼 되돌림
        const ids = [];
        (entry.playerDeltas || []).forEach((d) => {
          const pl = nextPlayers[d.playerId];
          if (!pl) return;
          const stats = predictionStats(pl);
          const isPred = type === 'prediction';
          nextPlayers[d.playerId] = {
            ...pl,
            wins: (pl.wins || 0) - (d.winsDelta || 0),
            losses: (pl.losses || 0) - (d.lossesDelta || 0),
            predictionScore: r3((pl.predictionScore || 0) - (d.predictionScoreDelta || 0)),
            elo: eloOf(pl) - (d.eloDelta || 0),
            predTotal: stats.total - (isPred ? (d.predTotalDelta ?? 1) : 0),
            predCorrect: r3(stats.correct - (isPred ? (d.predCorrectDelta ?? d.predictionScoreDelta ?? 0) : 0)),
            predPoints: r3(predPointsOf(pl) - (isPred ? (d.predPointsDelta ?? d.predCorrectDelta ?? d.predictionScoreDelta ?? 0) : 0)),
          };
          ids.push(d.playerId);
          ops.push({
            key: `history:${d.playerId}`, type: 'json', init: [],
            patches: [isPred
              ? { op: 'removeWhere', match: { predictionId: entry.predictionId } }
              : { op: 'removeWhere', match: { date: entry.date, kind: null } }],
          });
        });
        ops.push({ key: 'players', type: 'json', patches: playerFieldPatches(nextPlayers, ids, ['wins', 'losses', 'predictionScore', 'elo', 'predTotal', 'predCorrect', 'predPoints']) });
        ops.push({ key: dk, type: 'json', patches: [{ op: 'delete', path: [type === 'prediction' ? 'predictionResult' : 'result'] }] });
        ops.push({ key: 'updateLog', type: 'json', init: [], patches: [{ op: 'updateWhere', match: { id: logId }, set: { undone: true } }] });
      }
      await write(ops, ['players', `daily:${viewDate}`, 'updateLog']);
      if (resettleAfter) await resettleDay(resettleAfter);
    } catch (e) {
      setError(`취소 처리 중 문제가 발생했습니다. (${serverErrorText(e)})`);
    } finally {
      setBusy(false);
    }
  };

  // 한 선수의 몇 칸만 바꾸기 (한 번 왕복, 다른 칸은 건드리지 않음)
  const patchPlayer = (id, fields) => write(
    [{ key: 'players', type: 'json', patches: Object.entries(fields).map(([f, v]) => ({ op: 'set', path: [id, f], value: v })) }],
    ['players'],
  );

  const handlePositionChange = async (newPos) => {
    const before = players;
    setPlayers((ps) => ({ ...ps, [currentPlayerId]: { ...ps[currentPlayerId], position: newPos } })); // 즉시 반영
    try {
      await patchPlayer(currentPlayerId, { position: newPos });
    } catch (e) {
      setPlayers(before);
      setError(`포지션 변경 중 문제가 발생했습니다. (${serverErrorText(e)})`);
    }
  };

  const handleHeightSave = async () => {
    setError('');
    const h = validHeight(heightDraft);
    if (h === null) { setError(`키는 ${MIN_HEIGHT}~${MAX_HEIGHT} 사이 숫자(cm)로 입력해주세요.`); return; }
    setBusy(true);
    try {
      await patchPlayer(currentPlayerId, { height: h });
      setHeightDraft(null);
    } catch (e) {
      setError(`키 저장 중 문제가 발생했습니다. (${serverErrorText(e)})`);
    } finally {
      setBusy(false);
    }
  };

  const setMemberDraft = (id, field, value) => {
    setMemberMsg('');
    setMemberDrafts((d) => ({ ...d, [id]: { ...(d[id] || {}), [field]: value } }));
  };

  const handleAdminSaveMember = async (id) => {
    setError('');
    setMemberMsg('');
    const draft = memberDrafts[id] || {};
    const update = {};
    if (draft.position !== undefined) {
      if (!can(me, 'editMembers')) { setError('회원 정보를 바꿀 권한이 없어요.'); return; }
      update.position = normalizePosition(draft.position);
    }
    if (draft.height !== undefined) {
      if (!can(me, 'editMembers')) { setError('회원 정보를 바꿀 권한이 없어요.'); return; }
      const h = validHeight(draft.height);
      if (h === null) { setError(`키는 ${MIN_HEIGHT}~${MAX_HEIGHT} 사이 숫자(cm)로 입력해주세요.`); return; }
      update.height = h;
    }
    if (draft.role !== undefined && draft.role !== roleOf(players[id])) {
      if (!rolesAssignable(me, players[id]).includes(draft.role)) { setError('이 권한으로 바꿀 수 없어요.'); return; }
      update.role = draft.role;
    }
    // 이름, 사번: 관리자 이상이 직접 추가한 회원(아직 앱 미가입)만
    const editingIdentity = (draft.name !== undefined && draft.name.trim() !== players[id]?.name)
      || (draft.empId !== undefined && draft.empId.trim() !== (players[id]?.employeeId || ''));
    if (editingIdentity) {
      if (!can(me, 'addMembers') || !isAppless(players[id])) { setError('이름과 사번은 관리자 이상이, 앱에 가입하지 않은 회원만 바꿀 수 있어요.'); return; }
      if (draft.name !== undefined) {
        if (!draft.name.trim()) { setError('이름을 입력해주세요.'); return; }
        update.name = draft.name.trim();
      }
      if (draft.empId !== undefined) update.employeeId = draft.empId.trim();
    }
    if (!Object.keys(update).length) return;
    setBusy(true);
    try {
      if (!players[id]) { setError('회원 정보를 찾을 수 없습니다.'); return; }
      if (update.employeeId) {
        // 다른 회원이 이미 쓰는 사번인지 최신 정보로 확인
        const fresh = parsePlayers((await api.getMany(['players'])).players);
        const other = findByEmp(fresh, update.employeeId);
        if (other && other.id !== id) { setError('이미 다른 회원이 쓰는 사번이에요.'); return; }
      }
      if (update.role && roleOf(players[id]) === 'owner' && update.role !== 'owner') {
        // 최종관리자는 항상 한 명 이상 남아 있어야 함 (최신 정보로 확인)
        const fresh = parsePlayers((await api.getMany(['players'])).players);
        const owners = Object.values(fresh).filter((p) => roleOf(p) === 'owner' && !isDeleted(p));
        if (owners.length <= 1) { setError('최종관리자는 최소 한 명 있어야 해요. 다른 사람을 먼저 최종관리자로 지정해주세요.'); return; }
      }
      await patchPlayer(id, update);
      setMemberDrafts((d) => { const n = { ...d }; delete n[id]; return n; });
      setMemberMsg(`${players[id].name}님 정보를 저장했어요.`);
    } catch (e) {
      setError(`회원 정보 저장 중 문제가 발생했습니다. (${serverErrorText(e)})`);
    } finally {
      setBusy(false);
    }
  };

  // ----- 시즌 종료 -----
  // 1) 마감 안 된 지난 날을 먼저 자동 마감  2) 오늘 경기가 열려 있으면 중단
  // 3) 이번 시즌 기록(승패, Rating, 예측)을 시즌 보관함에 저장  4) 모두 처음 상태로 초기화하고 다음 시즌 시작
  // 같은 시즌을 두 번 종료하지 않도록 서버에서 "아직 이 시즌일 때만" 저장
  const handleEndSeason = async () => {
    setError('');
    setSeasonMsg('');
    if (!can(me, 'endSeason')) { setError('시즌을 종료할 권한이 없어요.'); return; }
    setBusy(true);
    try {
      await autoCloseOpenDays({ force: true });
      const fresh = await api.getMany(['players', 'seasons', `daily:${dateKey}`]);
      const today = parseJson(fresh[`daily:${dateKey}`], emptyDaily());
      if (today.teams && (today.records || []).some((r) => r.fromTeams) && !today.predictionResult?.finalized) {
        setError('오늘 경기가 아직 마감되지 않았어요. 오늘 경기를 먼저 마감한 뒤 시즌을 종료해주세요.');
        return;
      }
      const seasonsData = parseJson(fresh.seasons, null);
      const cur = currentSeasonOf(seasonsData);
      if (cur.number !== currentSeason.number) {
        // 화면을 보는 사이 다른 사람이 이미 시즌을 종료함 → 다음 시즌을 실수로 종료하지 않도록 중단
        setSeasons(seasonsData);
        setConfirmingSeasonEnd(false);
        setSeasonMsg(`이미 다른 사람이 시즌 ${currentSeason.number}${eulReul(currentSeason.number)} 종료했어요. 지금은 시즌 ${cur.number}${ieyo(cur.number)}.`);
        return;
      }
      const freshPlayers = await ensureMigrated(parsePlayers(fresh.players));
      const nowIso = new Date().toISOString();
      const snapshotPlayers = {};
      Object.values(freshPlayers).forEach((p) => {
        const st = predictionStats(p);
        snapshotPlayers[p.id] = {
          id: p.id, name: p.name, position: p.position,
          wins: p.wins || 0, losses: p.losses || 0, elo: eloOf(p),
          predTotal: st.total, predCorrect: st.correct, predictionScore: p.predictionScore || 0, predPoints: predPointsOf(p),
          lastEloDelta: lastEloDeltaOf(p),
        };
      });
      const snapshot = { number: cur.number, startAt: cur.startAt, startDate: cur.startDate, endAt: nowIso, endDate: dateKey, endedBy: myName, players: snapshotPlayers };
      const next = { number: cur.number + 1, startAt: nowIso, startDate: dateKey };
      const reset = { wins: 0, losses: 0, elo: ELO_BASE, predictionScore: 0, predTotal: 0, predCorrect: 0, predPoints: 0, lastEloDelta: null, lastRecordId: null };
      const ids = Object.keys(freshPlayers);
      const ops = [
        { key: `season:${cur.number}`, type: 'set', value: JSON.stringify(snapshot) },
        { key: 'players', type: 'json', patches: ids.flatMap((id) => Object.entries(reset).map(([f, v]) => ({ op: 'set', path: [id, f], value: v }))) },
        {
          key: 'seasons', type: 'json',
          patches: [
            { op: 'set', path: ['current'], value: next },
            { op: 'upsertById', path: ['past'], value: { id: `season-${cur.number}`, number: cur.number, startAt: cur.startAt, startDate: cur.startDate, endAt: nowIso, endDate: dateKey, endedBy: myName } },
          ],
        },
        {
          key: 'updateLog', type: 'json', init: [],
          patches: [{ op: 'upsertById', prepend: true, limit: LOG_LIMIT, value: { id: uniqueId('season-end'), type: 'season-end', date: dateKey, season: cur.number, timestamp: nowIso, adminName: myName, undone: true } }],
        },
      ];
      const requires = cur.number === 1 && !seasonsData?.current
        ? [{ key: 'seasons', path: ['current'], absent: true }]
        : [{ key: 'seasons', path: ['current', 'number'], equals: cur.number }];
      pendingRef.current += 1;
      try {
        const res = await api.batchIf(ops, ['players', 'seasons', 'updateLog'], requires);
        applyValues(res.values);
        setSeasonMsg(res.applied ? `시즌 ${cur.number}${eulReul(cur.number)} 마치고 시즌 ${cur.number + 1}${eulReul(cur.number + 1)} 시작했어요.` : '이미 다른 사람이 시즌을 종료했어요.');
      } finally {
        pendingRef.current -= 1;
      }
      setConfirmingSeasonEnd(false);
      setSeasonView(null);
    } catch (e) {
      setError(`시즌 종료 중 문제가 발생했습니다. (${serverErrorText(e)})`);
    } finally {
      setBusy(false);
    }
  };

  // 지난 시즌 랭킹 보기: 보관된 기록 불러오기
  const openSeasonView = async (n) => {
    if (n === null) { setSeasonView(null); return; }
    if (!seasonSnapshots[n]) {
      try {
        const v = await api.getMany([`season:${n}`]);
        setSeasonSnapshots((m) => ({ ...m, [n]: parseJson(v[`season:${n}`], null) }));
      } catch (e) {
        setError(`지난 시즌 기록을 불러오지 못했어요. (${serverErrorText(e)})`);
        return;
      }
    }
    setSeasonView(n);
  };

  const handleChangePassword = async () => {
    setError('');
    setPwChangeMsg('');
    if (!curPassword || !newPassword || !newPasswordConfirm) { setError('현재 비밀번호와 새 비밀번호를 모두 입력해주세요.'); return; }
    if (newPassword.length < 4) { setError('새 비밀번호는 4자 이상으로 설정해주세요.'); return; }
    if (newPassword !== newPasswordConfirm) { setError('새 비밀번호가 일치하지 않습니다.'); return; }
    setBusy(true);
    try {
      const fresh = parsePlayers((await api.getMany(['players'])).players);
      const player = fresh[currentPlayerId];
      if (!player) { setError('내 정보를 찾을 수 없습니다.'); return; }
      const ok = await verifyPassword(curPassword, player);
      if (!ok) { setError('현재 비밀번호가 일치하지 않습니다.'); return; }
      const { hash, method } = await hashPassword(newPassword);
      await patchPlayer(currentPlayerId, { passwordHash: hash, passwordMethod: method, mustChangePassword: null });
      setCurPassword(''); setNewPassword(''); setNewPasswordConfirm('');
      setShowChangePassword(false);
      setPwChangeMsg('비밀번호가 변경됐어요.');
    } catch (e) {
      setError(`비밀번호 변경 중 문제가 발생했습니다. (${serverErrorText(e)})`);
    } finally {
      setBusy(false);
    }
  };

  const handleExportData = async () => {
    setError('');
    setBackupMsg('');
    setBusy(true);
    try {
      const dailyKeys = await api.list('daily:');
      const historyKeys = await api.list('history:');
      const seasonKeys = await api.list('season:');
      const values = await api.getMany(['players', 'updateLog', 'seasons', ...dailyKeys, ...historyKeys, ...seasonKeys]);
      const dailyData = {};
      dailyKeys.forEach((k) => { const v = parseJson(values[k], null); if (v) dailyData[k.slice('daily:'.length)] = v; });
      const histories = {};
      historyKeys.forEach((k) => { const v = parseJson(values[k], null); if (v) histories[k.slice('history:'.length)] = v; });

      const backup = {
        version: 2,
        exportedAt: new Date().toISOString(),
        players: parsePlayers(values.players),
        updateLog: parseJson(values.updateLog, []),
        daily: dailyData,
        history: histories,
        seasons: parseJson(values.seasons, null),
        seasonArchive: Object.fromEntries(seasonKeys.map((k) => [k.slice('season:'.length), parseJson(values[k], null)])),
      };

      setBackupText(JSON.stringify(backup));
      setBackupMsg(`백업 완료 (선수 ${Object.keys(backup.players).length}명, 경기기록 ${Object.keys(dailyData).length}일치)`);
    } catch (e) {
      setError(`백업 생성 중 문제가 발생했습니다. (${serverErrorText(e)})`);
    } finally {
      setBusy(false);
    }
  };

  const handleCopyBackup = async () => {
    try {
      await navigator.clipboard.writeText(backupText);
      setBackupMsg('클립보드에 복사했어요.');
    } catch (e) {
      setBackupMsg('자동 복사가 안 되면 위 텍스트 상자를 길게 눌러 전체 선택 후 복사해주세요.');
    }
  };

  const handleRestoreData = async () => {
    setError('');
    setBackupMsg('');
    let parsed;
    try {
      parsed = JSON.parse(restoreText.trim());
    } catch (e) {
      setError('백업 텍스트 형식이 올바르지 않습니다. 전체를 정확히 복사했는지 확인해주세요.');
      return;
    }
    if (!parsed || typeof parsed.players !== 'object') {
      setError('백업 데이터에 선수 정보가 없습니다. 올바른 백업 텍스트인지 확인해주세요.');
      return;
    }
    setBusy(true);
    try {
      parsed.players = normalizePlayers(parsed.players);
      const dailyEntries = Object.entries(parsed.daily || {});
      const ops = [
        { key: 'players', type: 'set', value: JSON.stringify(parsed.players) },
        { key: 'updateLog', type: 'set', value: JSON.stringify(parsed.updateLog || []) },
        ...dailyEntries.map(([date, data]) => ({ key: `daily:${date}`, type: 'set', value: JSON.stringify(data) })),
        ...Object.entries(parsed.history || {}).map(([id, h]) => ({ key: `history:${id}`, type: 'set', value: JSON.stringify(h) })),
        ...(parsed.seasons ? [{ key: 'seasons', type: 'set', value: JSON.stringify(parsed.seasons) }] : []),
        ...Object.entries(parsed.seasonArchive || {}).map(([n, v]) => ({ key: `season:${n}`, type: 'set', value: JSON.stringify(v) })),
      ];
      const values = await batchWithRetry(ops, ['players', 'updateLog', `daily:${viewDate}`]);
      // 예전 백업(선수 정보 안에 기록이 들어 있는 형식)이면 새 형식으로 나눠 저장
      setPlayers(await ensureMigrated(parsePlayers(values.players)));
      setLogs(parseJson(values.updateLog, []));
      setDaily(parseJson(values[`daily:${viewDate}`], emptyDaily()));

      if (!parsed.players[currentPlayerId]) {
        localStorage.removeItem('currentPlayerId');
        setCurrentPlayerId(null);
      }

      setRestoreText('');
      setConfirmingRestore(false);
      setBackupMsg(`복원 완료 (선수 ${Object.keys(parsed.players || {}).length}명, 경기기록 ${dailyEntries.length}일치 불러옴)`);
    } catch (e) {
      setError(`복원 중 문제가 발생했습니다. (${serverErrorText(e)})`);
    } finally {
      setBusy(false);
    }
  };

  // 랭킹 3가지를 각각 따로 정렬
  // - 승률 랭킹: 윌슨 점수, 20경기 이상만 순위 (나머지는 '랭킹 진입 전'에 경기 수 많은 순)
  // - 적중률 랭킹: 윌슨 점수
  // - Rating 랭킹: 엘로 점수, 20경기 이상만 순위
  // 이번 시즌이면 지금 회원 기록, 지난 시즌이면 보관된 기록으로 랭킹 계산
  const pastSeasons = [...(seasons?.past || [])].sort((a, b) => b.number - a.number);
  const viewingPast = seasonView !== null && !!seasonSnapshots[seasonView];
  const rankSource = viewingPast ? (seasonSnapshots[seasonView].players || {}) : Object.fromEntries(activePlayers.map((p) => [p.id, p]));
  const viewedSeasonNumber = viewingPast ? seasonView : currentSeason.number;
  const scoredPlayers = Object.values(rankSource).map((p) => {
    const games = gamesPlayed(p);
    const pred = predictionStats(p);

    return {
      ...p,
      games,
      pred,
      winScore: wilsonScore(p.wins || 0, games),
      predScore: wilsonScore(pred.correct, pred.total),
      points: predPointsOf(p),
      skill: eloOf(p),
      lastEloDelta: lastEloDeltaOf(p),
    };
  });
  const qualifies = (p) => p.games >= RANKING_MIN_GAMES;
  const hasGames = (p) => p.games > 0;
  // 순위에 든 사람이 먼저, 그다음 랭킹 진입 전 사람들도 같은 점수 기준으로 그들끼리 순위 (기록 없는 사람은 맨 아래)
  const winRanking = [...scoredPlayers].sort((a, b) =>
    (qualifies(b) - qualifies(a))
    || (hasGames(b) - hasGames(a))
    || (b.winScore - a.winScore) || (b.games - a.games));
  const predRanking = [...scoredPlayers].sort((a, b) => (b.predScore - a.predScore) || (b.pred.total - a.pred.total));
  const skillRanking = [...scoredPlayers].sort((a, b) =>
    (qualifies(b) - qualifies(a))
    || (hasGames(b) - hasGames(a))
    || (b.skill - a.skill) || (b.games - a.games));
  // 예측 점수: 점수 합계 순 (같으면 적중 많은 순, 그다음 예측 적게 한 순)
  const pointsRanking = [...scoredPlayers].sort((a, b) => ((b.pred.total > 0) - (a.pred.total > 0)) || (b.points - a.points) || (b.pred.correct - a.pred.correct) || (a.pred.total - b.pred.total));
  const rankedPlayers = { skill: skillRanking, prediction: predRanking, points: pointsRanking }[rankMode] || winRanking;

  // 화면과 이미지에 똑같이 쓰는 랭킹 한 줄씩
  let unrankedCount = 0;
  const rankingRows = rankedPlayers.map((p, idx) => {
    let ranked;
    let detail;
    let scoreLabel;
    const remaining = `랭킹 진입까지 ${RANKING_MIN_GAMES - p.games}경기`;
    if (rankMode === 'skill') {
      ranked = p.games >= RANKING_MIN_GAMES;
      const recent = typeof p.lastEloDelta === 'number' ? ` · 최근 ${p.lastEloDelta >= 0 ? '+' : ''}${Math.round(p.lastEloDelta)}` : '';
      detail = p.games === 0 ? '아직 경기 기록 없음' : `${p.games}경기${recent}${ranked ? '' : ` · ${remaining}`}`;
      scoreLabel = p.games > 0 ? `${Math.round(p.skill)}` : '-';
    } else if (rankMode === 'prediction') {
      ranked = p.pred.total > 0;
      detail = ranked ? `${p.pred.total}번 중 ${fmtNum(p.pred.correct)}번 적중 · ${pct(p.pred.correct, p.pred.total)}` : '아직 예측 기록 없음';
      scoreLabel = ranked ? `${Math.round(p.predScore * 100)}점` : '-';
    } else if (rankMode === 'points') {
      ranked = p.pred.total > 0;
      detail = ranked ? `${p.pred.total}번 중 ${fmtNum(p.pred.correct)}번 적중 · 적중률 ${pct(p.pred.correct, p.pred.total)}` : '아직 예측 기록 없음';
      scoreLabel = ranked ? `${fmtNum(p.points)}점` : '-';
    } else {
      ranked = p.games >= RANKING_MIN_GAMES;
      detail = p.games === 0 ? '아직 경기 기록 없음' : `${p.wins || 0}승 ${p.losses || 0}패 · 승률 ${pct(p.wins || 0, p.games)}${ranked ? '' : ` · ${remaining}`}`;
      scoreLabel = p.games > 0 ? `${Math.round(p.winScore * 100)}점` : '-';
    }
    // 랭킹 진입 전 사람들은 그 사람들끼리의 순위 (기록이 없으면 '-')
    const hasRecord = rankMode === 'prediction' || rankMode === 'points' ? p.pred.total > 0 : p.games > 0;
    const groupRank = !ranked && hasRecord ? ++unrankedCount : null;
    return { id: p.id, name: p.name, position: p.position, ranked, rank: ranked ? idx + 1 : null, groupRank, detail, scoreLabel, isTop: idx === 0 && ranked, isMe: p.id === currentPlayerId };
  });
  const rankingNeedsGames = rankMode !== 'prediction' && rankMode !== 'points';
  const firstUnrankedIdx = rankingRows.findIndex((r) => !r.ranked);

  const isIOSDevice = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const handleMakeRankingImage = async () => {
    setError('');
    setRankImageBusy(true);
    try {
      const d = new Date();
      const snap = viewingPast ? seasonSnapshots[seasonView] : null;
      const dateText = snap
        ? `시즌 ${snap.number} 최종 · ${snap.startDate ? formatDateLabel(snap.startDate) : '처음'} ~ ${formatDateLabel(snap.endDate)}`
        : `시즌 ${currentSeason.number} · ${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 기준`;
      const rule = rankMode === 'prediction'
        ? '적중률과 예측 횟수를 함께 본 점수 순'
        : rankMode === 'points'
        ? `맞힌 팀의 배당만큼 받은 예측 점수 합계 순 (최대 ${ODDS_CAP}배)`
        : rankMode === 'skill'
          ? `팀 전력을 고려한 Rating 순 · ${RANKING_MIN_GAMES}경기 이상만 순위`
          : `승률과 판수를 함께 본 점수 순 · ${RANKING_MIN_GAMES}경기 이상만 순위`;
      const stamp = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
      const blob = await renderRankingImage({
        clubName: CLUB_NAME,
        title: RANK_TITLES[rankMode],
        lines: [dateText, rule],
        rows: rankingRows,
        unrankedLabel: rankingNeedsGames ? `랭킹 진입 전 (${RANKING_MIN_GAMES}경기 미만)` : '예측 기록 없음',
      });
      if (rankImage) URL.revokeObjectURL(rankImage.url);
      // 파일 이름은 영문으로 (한글 파일 이름은 일부 휴대폰에서 'download'로 바뀌어 저장됨)
      const fileMode = { winrate: 'winrate', prediction: 'prediction', points: 'points', skill: 'rating' }[rankMode];
      setRankImage({ url: URL.createObjectURL(blob), blob, fileName: `ranking-s${viewedSeasonNumber}-${fileMode}-${stamp.replace(/\./g, '')}.png` });
    } catch (e) {
      setError(`이미지를 만드는 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setRankImageBusy(false);
    }
  };

  const handleSaveRankingImage = async () => {
    if (!rankImage) return;
    // 아이폰: 공유 메뉴의 '이미지 저장'으로 사진 앱에 저장 / 그 외: 바로 다운로드
    if (isIOSDevice && navigator.canShare) {
      try {
        const file = new File([rankImage.blob], rankImage.fileName, { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return; // 사용자가 공유 창을 닫음
      }
    }
    const a = document.createElement('a');
    a.href = rankImage.url;
    a.download = rankImage.fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  const closeRankImage = () => {
    if (rankImage) URL.revokeObjectURL(rankImage.url);
    setRankImage(null);
  };

  const myGames = gamesPlayed(me);
  const myPred = predictionStats(me);
  const mySkill = Math.round(eloOf(me));
  // 마이페이지 순위는 랭킹 화면에서 지난 시즌을 보고 있어도 항상 이번 시즌 기준
  const curScored = viewingPast
    ? activePlayers.map((p) => {
      const games = gamesPlayed(p);
      const pred = predictionStats(p);
      return { ...p, games, pred, winScore: wilsonScore(p.wins || 0, games), predScore: wilsonScore(pred.correct, pred.total), points: predPointsOf(p), skill: eloOf(p) };
    })
    : scoredPlayers;
  const curWin = viewingPast ? [...curScored].sort((a, b) => (qualifies(b) - qualifies(a)) || (hasGames(b) - hasGames(a)) || (b.winScore - a.winScore) || (b.games - a.games)) : winRanking;
  const curPred = viewingPast ? [...curScored].sort((a, b) => (b.predScore - a.predScore) || (b.pred.total - a.pred.total)) : predRanking;
  const curSkill = viewingPast ? [...curScored].sort((a, b) => (qualifies(b) - qualifies(a)) || (hasGames(b) - hasGames(a)) || (b.skill - a.skill) || (b.games - a.games)) : skillRanking;
  const myWinRankIdx = curWin.findIndex((p) => p.id === currentPlayerId);
  const myPredRankIdx = curPred.findIndex((p) => p.id === currentPlayerId);
  const curPoints = viewingPast ? [...curScored].sort((a, b) => ((b.pred.total > 0) - (a.pred.total > 0)) || (b.points - a.points) || (b.pred.correct - a.pred.correct) || (a.pred.total - b.pred.total)) : pointsRanking;
  const myPointsRankIdx = curPoints.findIndex((p) => p.id === currentPlayerId);
  const myPoints = predPointsOf(me);
  const mySkillRankIdx = curSkill.findIndex((p) => p.id === currentPlayerId);
  const entryLabel = myGames > 0 ? `랭킹 진입까지 ${RANKING_MIN_GAMES - myGames}경기` : '아직 경기 기록 없음';
  const myWinRankLabel = myGames >= RANKING_MIN_GAMES && myWinRankIdx >= 0 ? `승률 랭킹 ${myWinRankIdx + 1}위` : entryLabel;
  const mySkillRankLabel = myGames >= RANKING_MIN_GAMES && mySkillRankIdx >= 0 ? `Rating 랭킹 ${mySkillRankIdx + 1}위` : entryLabel;

  if (!apiConfigured) {
    return (
      <div className="font-body min-h-screen bg-slate-900 flex items-center justify-center px-6">
        <div className="max-w-sm text-center">
          <p className="text-white font-bold text-lg mb-2">⚙️ 설정이 필요해요</p>
          <p className="text-slate-400 text-sm leading-relaxed">
            config.js 안의 <code className="bg-slate-800 text-orange-400 px-1.5 py-0.5 rounded text-xs">API_URL</code> 값을
            배포한 Apps Script 웹 앱 URL로 바꿔주세요.
          </p>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div className="min-h-screen bg-slate-50 flex items-center justify-center">
        <div className="flex flex-col items-center gap-3 text-slate-400">
          <Spinner size={28} dark />
          <span className="text-sm font-medium">불러오는 중...</span>
        </div>
      </div>
    );
  }

  if (!currentPlayerId) {
    return (
      <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center px-6 py-10">
        <div className="w-full max-w-sm">
          <div className="text-center mb-8">
            <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-600 mb-4 text-3xl">🏀</div>
            <h1 className="font-display text-3xl text-white tracking-wide">{CLUB_NAME}</h1>
            <p className="text-slate-400 text-sm mt-1 font-medium">출석 · 팀편성 · 승부예측</p>
          </div>

          <div className="bg-white rounded-2xl p-5 shadow-xl">
            <div className="flex rounded-lg bg-slate-100 p-1 mb-5">
              <button
                onClick={() => { setAuthMode('login'); setError(''); }}
                className={`flex-1 py-2 rounded-md text-sm font-bold transition ${authMode === 'login' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
              >
                로그인
              </button>
              <button
                onClick={() => { setAuthMode('register'); setError(''); }}
                className={`flex-1 py-2 rounded-md text-sm font-bold transition ${authMode === 'register' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
              >
                회원가입
              </button>
            </div>

            {authMode === 'login' ? (
              <div className="space-y-3">
                <input
                  value={loginEmpId} onChange={(e) => setLoginEmpId(e.target.value)}
                  placeholder="사번" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                <input
                  value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} type="password"
                  placeholder="비밀번호" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                {error && <p className="text-red-500 text-xs font-medium">{error}</p>}
                <button
                  onClick={handleLogin} disabled={busy}
                  className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-bold flex items-center justify-center gap-2 disabled:opacity-60"
                >
                  {busy ? <Spinner size={16} /> : '로그인하기'}
                </button>
                <button
                  onClick={() => { setShowForgot((v) => !v); setForgotEmpId(loginEmpId); setForgotMsg(''); setError(''); }}
                  className="w-full text-xs text-slate-400 underline"
                >
                  비밀번호를 잊으셨나요?
                </button>
                {showForgot && (
                  <div className="bg-slate-50 rounded-xl p-3 space-y-2">
                    <p className="text-xs text-slate-600 leading-relaxed">
                      관리자에게 초기화를 요청하면 임시 비밀번호를 받을 수 있어요. 임시 비밀번호로 로그인하면 바로 새 비밀번호를 정하게 돼요.
                    </p>
                    {(() => {
                      const admins = Object.values(players).filter((p) => !isDeleted(p) && rankOf(p) >= ROLE_RANK.admin).map((p) => p.name);
                      return admins.length ? <p className="text-xs text-slate-500">관리자: <span className="font-bold">{admins.join(', ')}</span></p> : null;
                    })()}
                    <div className="flex gap-2">
                      <input
                        value={forgotEmpId} onChange={(e) => setForgotEmpId(e.target.value)} placeholder="내 사번"
                        className="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                      <button onClick={handleForgotRequest} disabled={busy} className="shrink-0 bg-orange-600 text-white rounded-lg px-3 text-xs font-bold disabled:opacity-60">초기화 요청</button>
                    </div>
                    {forgotMsg && <p className="text-xs text-emerald-600 font-medium">{forgotMsg}</p>}
                  </div>
                )}
              </div>
            ) : (
              <div className="space-y-3">
                <input value={regName} onChange={(e) => setRegName(e.target.value)} placeholder="이름" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regEmpId} onChange={(e) => setRegEmpId(e.target.value)} placeholder="사번" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regHeight} onChange={(e) => setRegHeight(e.target.value.replace(/[^0-9]/g, ''))} inputMode="numeric" placeholder="키 (cm, 예: 178)" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <div className="grid grid-cols-5 gap-1.5">
                  {POSITIONS.map((pos) => (
                    <button
                      key={pos} onClick={() => setRegPosition(pos)}
                      className={`py-2 rounded-lg border flex flex-col items-center leading-tight ${regPosition === pos ? 'bg-orange-600 text-white border-orange-600' : 'border-slate-200 text-slate-500'}`}
                    >
                      <span className="text-sm font-black">{POSITION_ABBR[pos]}</span>
                      <span className="text-xs font-medium">{POSITION_SHORT[pos]}</span>
                    </button>
                  ))}
                </div>
                <input value={regPassword} onChange={(e) => setRegPassword(e.target.value)} type="password" placeholder="비밀번호 (4자 이상)" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regPasswordConfirm} onChange={(e) => setRegPasswordConfirm(e.target.value)} type="password" placeholder="비밀번호 확인" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                {error && <p className="text-red-500 text-xs font-medium">{error}</p>}
                <button onClick={handleRegister} disabled={busy} className="w-full bg-orange-600 text-white rounded-lg py-2.5 text-sm font-bold flex items-center justify-center gap-2 disabled:opacity-60">
                  {busy ? <Spinner size={16} /> : '가입하기'}
                </button>
              </div>
            )}
          </div>
          <p className="text-center text-slate-500 text-xs mt-5 leading-relaxed">
            가장 먼저 가입하는 사람이 자동으로 관리자가 돼요.<br />비밀번호는 팀 내부용으로 간단히 보호되니 다른 곳과 같은 비밀번호는 피해주세요.
          </p>
          {!isStandaloneApp() && (
            <button onClick={openInstallPrompt} className="w-full mt-4 py-2 text-center text-orange-400 text-sm font-bold">
              📲 홈 화면에 앱으로 설치하기
            </button>
          )}
        </div>
      </div>
    );
  }

  if (!me) {
    return (
      <div className="min-h-screen bg-slate-50 flex items-center justify-center">
        <Spinner size={24} dark />
      </div>
    );
  }

  if (me.mustChangePassword) {
    return (
      <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center px-6 py-10">
        <div className="w-full max-w-sm bg-white rounded-2xl p-5 shadow-xl">
          <p className="text-slate-900 font-bold text-base">새 비밀번호를 정해주세요</p>
          <p className="text-xs text-slate-500 mt-1 leading-relaxed">
            {me.name}님은 임시 비밀번호로 로그인했어요{me.pwResetBy ? ` (${me.pwResetBy} 발급)` : ''}. 앞으로 쓸 비밀번호를 정하면 바로 앱을 쓸 수 있어요.
          </p>
          <div className="space-y-2 mt-4">
            <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="새 비밀번호 (4자 이상)" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
            <input type="password" value={newPasswordConfirm} onChange={(e) => setNewPasswordConfirm(e.target.value)} placeholder="새 비밀번호 확인" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
            {error && <p className="text-red-500 text-xs font-medium">{error}</p>}
            <button onClick={handleSetNewPassword} disabled={busy} className="w-full bg-orange-600 text-white rounded-lg py-2.5 text-sm font-bold disabled:opacity-60">
              {busy ? <Spinner size={16} /> : '새 비밀번호 저장'}
            </button>
            <button onClick={handleLogout} className="w-full text-xs text-slate-400 underline">로그아웃</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-200">
      <div className="max-w-md mx-auto min-h-screen bg-slate-50 pb-24 relative shadow-xl">

        <div className="bg-slate-900 px-4 pt-5 pb-4 sticky top-0 z-10">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-orange-600 flex items-center justify-center text-base">🏀</div>
              <h1 className="font-display text-lg text-white tracking-wide">{CLUB_NAME}</h1>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={handleInvite} className="text-xs font-bold text-white bg-orange-600 rounded-full px-3 py-1.5" aria-label="초대하기">📨 초대하기</button>
              <button onClick={manualRefresh} className="text-slate-400 text-lg" aria-label="새로고침">🔄</button>
              <button onClick={handleLogout} className="text-slate-400 text-lg" aria-label="로그아웃">🚪</button>
            </div>
          </div>
          <button onClick={() => setTab('mypage')} className="flex items-center gap-2 mt-4">
            <Avatar name={me.name} size="sm" tone="bg-orange-600" />
            <div className="text-left">
              <p className="text-white text-sm font-bold leading-tight">
                {me.name}{rankOf(me) > 0 && <span className="ml-1 text-xs text-orange-400 font-bold">{ROLE_LABEL[roleOf(me)]}</span>}
              </p>
              <p className="text-slate-400 text-xs font-medium">{me.position}</p>
            </div>
          </button>
        </div>

        <div className="px-4 pt-4">
          {error && (
            <div className="bg-red-50 text-red-600 text-xs font-medium px-3 py-2 rounded-lg mb-3">{error}</div>
          )}

          {tab === 'today' && (
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <button
                  onClick={() => goToDate(shiftDate(viewDate, -1))} disabled={busy}
                  className="w-9 h-9 rounded-full bg-white shadow-sm text-slate-600 text-lg font-bold"
                  aria-label="이전 날"
                >
                  ‹
                </button>
                <div className="text-center">
                  <p className="text-sm font-bold text-slate-800">{formatDateLabel(viewDate)}</p>
                  <p className="text-xs text-slate-400">{isToday ? '오늘의 경기' : '지난 경기 · 결과 사후입력'}</p>
                </div>
                <button
                  onClick={() => goToDate(shiftDate(viewDate, 1))} disabled={busy || isToday}
                  className="w-9 h-9 rounded-full bg-white shadow-sm text-slate-600 text-lg font-bold disabled:opacity-30"
                  aria-label="다음 날"
                >
                  ›
                </button>
              </div>
              <div className="flex items-center justify-center gap-3 -mt-2">
                <input
                  type="date" value={viewDate} max={dateKey}
                  onChange={(e) => goToDate(e.target.value)}
                  className="text-xs text-slate-500 bg-transparent focus:outline-none"
                />
                {!isToday && (
                  <button onClick={() => goToDate(dateKey)} className="text-xs font-bold text-orange-600">오늘로 돌아가기</button>
                )}
              </div>

              {noGame && (
                <div className="bg-white rounded-2xl p-6 shadow-sm text-center">
                  <p className="text-4xl">🏀💤</p>
                  <p className="font-display text-2xl text-slate-800 mt-3">{isToday ? '오늘은' : '이날은'} 경기 없음</p>
                  {dayInfo.reason
                    ? <p className="text-sm font-bold text-slate-600 mt-2">{becauseOf(dayInfo.reason)} 경기가 없어요</p>
                    : <p className="text-sm text-slate-500 mt-2">정기 경기 요일이 아니에요</p>}
                  {dayInfo.by && <p className="text-xs text-slate-400 mt-1">{dayInfo.by} 등록</p>}
                  {can(me, 'manageSchedule') && (
                    <button onClick={() => setTab('admin')} className="mt-4 text-xs font-bold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">일정 관리</button>
                  )}
                </div>
              )}

              {!noGame && dayInfo.special && (
                <div className="bg-orange-50 rounded-2xl px-4 py-3 text-center">
                  <p className="text-sm font-bold text-orange-700">⭐ 특별 경기일{dayInfo.note ? ` · ${dayInfo.note}` : ''}</p>
                </div>
              )}

              {isToday && upcomingExceptions.length > 0 && (
                <div className="bg-white rounded-2xl p-4 shadow-sm">
                  <p className="text-slate-800 font-bold text-sm mb-2">📅 다가오는 일정</p>
                  <div className="space-y-1.5">
                    {upcomingExceptions.map(([d, ex]) => (
                      <p key={d} className="text-xs text-slate-600">
                        <span className="font-bold">{formatDateLabel(d)}</span>{' '}
                        {ex.type === 'off'
                          ? <span className="text-red-600 font-bold">경기 없음</span>
                          : <span className="text-orange-600 font-bold">특별 경기</span>}
                        {ex.reason ? ` · ${ex.type === 'off' ? becauseOf(ex.reason) : ex.reason}` : ''}
                      </p>
                    ))}
                  </div>
                </div>
              )}

              {!noGame && isToday && !validHeight(me.height) && (
                <button onClick={() => setTab('mypage')} className="w-full bg-orange-50 text-orange-700 rounded-xl px-4 py-3 text-xs font-bold text-left">
                  키를 입력하면 팀 배정이 더 정확해져요. 마이페이지에서 입력하기
                </button>
              )}

              {/* 참가신청 */}
              {!noGame && (
              <div className="bg-white rounded-2xl p-4 shadow-sm">
                <div className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2 text-slate-800 font-bold text-sm flex-wrap">
                    <span>👥 참가신청 {attendeePlayers.length}명</span>
                    {isToday && more > 0 && (
                      <span className="text-xs font-black text-white bg-orange-600 rounded-full px-2 py-0.5 animate-pulse">{more} more!</span>
                    )}
                    {isToday && more === 0 && TEAM_COUNT_BY_SIZE[attendeePlayers.length] && (
                      <span className="text-xs font-bold text-emerald-700 bg-emerald-50 rounded-full px-2 py-0.5">{TEAM_COUNT_BY_SIZE[attendeePlayers.length]}팀 경기 가능</span>
                    )}
                  </div>
                  {signupOpen ? (
                    <button
                      onClick={handleToggleAttendance} disabled={busy}
                      className={`text-xs font-bold px-4 py-2 rounded-full shrink-0 ${iAttend ? 'bg-slate-100 text-slate-500' : 'bg-orange-600 text-white'}`}
                    >
                      {iAttend ? '✕ 신청 취소' : '✓ 참가신청'}
                    </button>
                  ) : (
                    <span className="text-xs font-bold text-slate-400 shrink-0">{isToday && nowMin < SIGNUP_OPEN_MIN ? '오전 5시 오픈' : '신청 마감'}</span>
                  )}
                </div>
                <p className="text-xs text-slate-400 mt-1 mb-3">
                  참가신청 오전 5:00 ~ 11:45{iAttend ? ' · 나는 신청 완료' : ''}
                </p>
                {attendeePlayers.length > 0 ? (
                  <div className="flex flex-wrap gap-2">
                    {attendeePlayers.map((p) => (
                      <div key={p.id} className="flex items-center gap-1 bg-slate-50 rounded-full pl-1 pr-2.5 py-1">
                        <Avatar name={p.name} size="sm" />
                        <span className="text-xs font-semibold text-slate-700">{p.name}</span>
                        {daily.attendanceBy?.[p.id] && <span className="text-xs text-slate-400">· {daily.attendanceBy[p.id]} 추가</span>}
                      </div>
                    ))}
                  </div>
                ) : (
                  <p className="text-slate-400 text-xs">아직 신청한 사람이 없어요.</p>
                )}

                {/* 부관리자 이상: 앱을 안 쓰는 회원도 참석 처리 */}
                {isToday && !dayClosed && can(me, 'manageAttendance') && (
                  <div className="mt-3 pt-3 border-t border-slate-100">
                    <button
                      onClick={() => { setShowAttendanceManager((v) => !v); setAttendanceSearch(''); }}
                      className="w-full text-xs font-bold text-slate-600 bg-slate-100 rounded-lg py-2"
                    >
                      {showAttendanceManager ? '참석자 관리 닫기' : '👥 참석자 추가/빼기 (관리)'}
                    </button>
                    {showAttendanceManager && (
                      <div className="mt-3">
                        <p className="text-xs text-slate-500 mb-2">이름을 누르면 참석에 넣거나 빠져요. 앱을 안 쓰는 회원도 넣을 수 있고, 신청 마감 뒤에도 바꿀 수 있어요.</p>
                        <input
                          value={attendanceSearch} onChange={(e) => setAttendanceSearch(e.target.value)}
                          placeholder="이름 검색"
                          className="w-full mb-2 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                        />
                        <div className="flex flex-wrap gap-1.5">
                          {activePlayers
                            .filter((p) => !attendanceSearch.trim() || (p.name || '').includes(attendanceSearch.trim()))
                            .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'))
                            .map((p) => {
                              const on = !!daily.attendance?.[p.id];
                              return (
                                <button
                                  key={p.id}
                                  onClick={() => handleProxyAttendance(p.id)}
                                  className={`text-xs font-bold rounded-full px-2.5 py-1.5 border ${on ? 'bg-orange-600 text-white border-orange-600' : 'border-slate-200 text-slate-500'}`}
                                >
                                  {on ? '✓ ' : ''}{p.name}{isAppless(p) ? ' (앱 미가입)' : ''}
                                </button>
                              );
                            })}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
              )}

              {/* 팀 나누기: 누구나. 이미 나눈 팀은 참가인원이 바뀌었을 때만 다시 나눌 수 있음 */}
              {!noGame && isToday && !dayClosed && (
                <div className="bg-white rounded-2xl p-4 shadow-sm">
                  <div className="flex items-center justify-between mb-3">
                    <p className="text-slate-800 font-bold text-sm">팀 나누기</p>
                    <p className="text-xs text-slate-400">신청 {attendeePlayers.length}명 기준 {autoTeamCount}팀</p>
                  </div>
                  {attendanceChanged && !cachedForCurrent && teamRecords.length === 0 && (
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      {[2, 3, 4].map((c) => (
                        <button
                          key={c}
                          onClick={() => setTeamCountChoice(c)}
                          className={`py-2 rounded-lg text-sm font-bold border ${teamCount === c ? 'bg-orange-600 text-white border-orange-600' : 'border-slate-200 text-slate-500'}`}
                        >
                          {c}팀{c === autoTeamCount ? ' (자동)' : ''}
                        </button>
                      ))}
                    </div>
                  )}
                  <button
                    onClick={handleGenerateTeams}
                    disabled={busy || !canGenerateTeams}
                    className="w-full bg-slate-900 text-white rounded-xl py-3 text-sm font-bold disabled:opacity-40"
                  >
                    {daily.teams && attendanceChanged && cachedForCurrent
                      ? '↺ 이 인원의 기존 팀으로 되돌리기'
                      : daily.teams ? '↻ 바뀐 인원으로 팀 다시 나누기' : '👥 팀 나누기'}
                  </button>
                  <p className="text-xs text-slate-400 mt-2">
                    {teamRecords.length > 0
                      ? '이 팀으로 기록된 경기가 있어서 다시 나눌 수 없어요.'
                      : daily.teams && !attendanceChanged
                        ? '이미 팀이 나뉘었어요. 참가인원이 바뀌면 다시 나눌 수 있어요.'
                        : attendanceChanged && cachedForCurrent
                          ? '지금과 같은 인원으로 나눈 팀이 이미 있어요. 같은 인원이면 항상 그 팀으로 정해져요.'
                          : attendeePlayers.length < teamCount * 2
                          ? `${teamCount}팀으로 나누려면 최소 ${teamCount * 2}명이 필요해요.`
                          : daily.teams
                            ? '참가인원이 바뀌었어요. 다시 나누면 승부예측은 초기화돼요.'
                            : '누구나 누를 수 있어요.'}
                  </p>
                </div>
              )}

              {/* 오늘의 팀 */}
              {!noGame && teamLabels.length > 0 && (
                <div className="bg-white rounded-2xl overflow-hidden shadow-sm">
                  <div className="bg-slate-900 py-3 px-2 flex items-center justify-center gap-2 flex-wrap">
                    {teamLabels.map((l, i) => (
                      <React.Fragment key={l}>
                        {i > 0 && <span className="font-display text-sm text-slate-500">VS</span>}
                        <span className={`font-display ${teamLabels.length > 2 ? 'text-lg' : 'text-xl'} ${TEAM_STYLE[l].light}`}>
                          {teamLabels.length > 2 ? l : `TEAM ${l}`}
                        </span>
                      </React.Fragment>
                    ))}
                  </div>
                  {daily.teamsBy && (
                    <div className="px-4 pt-2 flex items-center justify-between gap-2">
                      <p className="text-xs text-slate-400">팀 나눔 {daily.teamsBy}{daily.teamsAt ? ` · ${formatDateTime(daily.teamsAt)}` : ''}</p>
                      {(daily.teamHistory || []).length > 1 && (
                        <button onClick={() => setShowTeamHistory((v) => !v)} className="text-xs text-slate-400 underline shrink-0">
                          나눔 기록 {daily.teamHistory.length}회
                        </button>
                      )}
                    </div>
                  )}
                  {showTeamHistory && (daily.teamHistory || []).length > 1 && (
                    <div className="mx-4 mt-2 bg-slate-50 rounded-lg px-3 py-2 space-y-1">
                      {[...daily.teamHistory].reverse().map((h, i) => (
                        <p key={i} className="text-xs text-slate-500">
                          {formatDateTime(h.at)} · {h.auto ? '자동' : h.by} · {h.size}명 {h.teamCount}팀
                          {h.added?.length ? ` · +${h.added.join(', ')}` : ''}
                          {h.removed?.length ? ` · -${h.removed.join(', ')}` : ''}
                          {h.restored ? ' · 같은 인원의 기존 팀으로 되돌림' : ''}
                        </p>
                      ))}
                    </div>
                  )}
                  {teamLabels.map((l) => {
                    const sm = teamSummary(daily.teams[l], players);
                    return (
                      <div key={l} className="border-t border-slate-100">
                        <div className="flex items-center justify-between px-4 pt-3">
                          <p className={`font-display text-base ${TEAM_STYLE[l].dark}`}>TEAM {l}</p>
                          <p className="text-xs text-slate-400">{daily.teams[l].length}명 · 평균 Rating {sm.avgElo ?? '-'}</p>
                        </div>
                        <div className="grid grid-cols-2 gap-x-3 px-4 pb-2">
                          {daily.teams[l].map((id) => <PlayerRow key={id} player={players[id]} tone={TEAM_STYLE[l].tone} />)}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* 승부예측 */}
              {!noGame && teamLabels.length > 0 && (
                <div className="bg-white rounded-2xl p-4 shadow-sm">
                  <p className="text-slate-800 font-bold text-sm">승부예측</p>
                  <p className="text-xs text-slate-400 mt-0.5">
                    {dayClosed
                      ? '예측이 마감됐어요.'
                      : !isToday
                        ? '지난 날의 예측이에요. 관리자가 마감하면 결과가 확정돼요.'
                        : predictionTimeOver
                        ? '오후 12시 30분에 예측이 마감됐어요.'
                        : predictionLocked
                          ? '경기 결과가 입력돼서 예측이 마감됐어요.'
                          : '오늘 가장 많이 이길 팀을 골라주세요. 오후 12:30 마감'}
                  </p>
                  <p className="text-xs text-slate-400 mb-3">배당 = 전체 예측 인원 ÷ 그 팀을 고른 인원 (최대 5배). 적게 고른 팀을 맞힐수록 점수가 커요.</p>
                  <div className={`grid ${teamLabels.length === 3 ? 'grid-cols-3' : 'grid-cols-2'} gap-2`}>
                    {teamLabels.map((l) => {
                      const count = Object.values(daily.predictions || {}).filter((v) => v === l).length;
                      const mine = daily.predictions?.[currentPlayerId] === l;
                      return (
                        <button
                          key={l}
                          onClick={() => handlePredict(l)}
                          disabled={busy || predictionLocked}
                          className={`rounded-xl py-3 text-center border-2 transition ${mine ? TEAM_STYLE[l].soft : 'border-slate-100'} disabled:opacity-70`}
                        >
                          <p className={`font-display text-lg ${TEAM_STYLE[l].dark}`}>{l}팀</p>
                          <p className="text-slate-400 text-xs font-medium mt-0.5">{count}표 · 배당 {fmtOdds(oddsFor(l, daily.predictions))}</p>
                          {mine && <p className="text-xs font-bold text-slate-600 mt-0.5">내 예측</p>}
                        </button>
                      );
                    })}
                  </div>
                  {daily.predictionResult?.finalized && (
                    <p className="text-center text-xs font-bold mt-3">
                      {(() => {
                        const pr = daily.predictionResult;
                        const pick = daily.predictions?.[currentPlayerId];
                        if (pr.void) return <span className="text-slate-400">오늘 팀끼리 경기가 없어서 예측 없이 마감됐어요</span>;
                        if (!pick) return <span className="text-slate-400">이번에는 예측하지 않았어요</span>;
                        const credit = predictionCredit(pick, pr.winners);
                        const points = predictionPoints(pick, pr.winners, daily.predictions);
                        const odds = fmtOdds(oddsFor(pick, daily.predictions));
                        if (credit >= 1) return <span className="text-emerald-600">내 예측 적중! 배당 {odds} → {fmtNum(points)}점 🎉</span>;
                        if (credit > 0) return <span className="text-emerald-600">공동 1위를 맞혔어요. 배당 {odds} × {fmtNum(credit)} → {fmtNum(points)}점</span>;
                        return <span className="text-slate-400">내 예측은 빗나갔어요</span>;
                      })()}
                    </p>
                  )}
                </div>
              )}

              {/* 오늘 우승 팀 */}
              {daily.predictionResult?.finalized && !daily.predictionResult.void && (
                <div className={`rounded-2xl p-4 text-center ${daily.predictionResult.winners.length === 1 ? (TEAM_STYLE[daily.predictionResult.winners[0]]?.tone || 'bg-slate-900') : 'bg-slate-900'}`}>
                  <p className="text-white text-xs font-bold opacity-80">{isToday ? '오늘' : '그날'} 경기 마감{daily.predictionResult.auto ? ' (자동)' : ''}</p>
                  <p className="font-display text-2xl text-white mt-0.5">
                    {daily.predictionResult.winners.length === 1 ? `${daily.predictionResult.winners[0]}팀 최다승` : `${daily.predictionResult.winners.join('·')}팀 공동 1위`}
                  </p>
                  <p className="text-white text-xs mt-1 opacity-80">
                    {Object.entries(daily.predictionResult.standings || {}).map(([l, w]) => `${l} ${w}승`).join(' · ')}
                  </p>
                </div>
              )}

              {/* 예전 방식으로 마감된 날 */}
              {legacyFinal && (
                <div className={`rounded-2xl p-4 text-center ${daily.result.winner === 'A' ? 'bg-blue-600' : 'bg-orange-600'}`}>
                  <p className="text-white text-xs font-bold opacity-80">경기 종료</p>
                  <p className="font-display text-2xl text-white mt-0.5">{daily.result.winner}팀 승리</p>
                  <p className="text-white text-xs mt-1 opacity-80">{formatDateTime(daily.result.timestamp)} 기록</p>
                </div>
              )}

              {/* 오늘 경기 기록 */}
              {(!noGame || records.length > 0) && (
                <div className="bg-white rounded-2xl p-4 shadow-sm">
                  <div className="flex items-center justify-between">
                    <p className="text-slate-800 font-bold text-sm">{isToday ? '오늘 경기 기록' : '그날 경기 기록'}</p>
                    {teamRecords.length > 0 && (
                      <p className="text-xs font-bold text-slate-500">{teamLabels.map((l) => `${l} ${standings[l]}승`).join(' · ')}</p>
                    )}
                  </div>

                  {records.length === 0 ? (
                    <p className="text-slate-400 text-xs mt-2">아직 기록된 경기가 없어요.</p>
                  ) : (
                    <div className="mt-3 space-y-2">
                      {records.map((r) => (
                        <div key={r.id} className={`bg-slate-50 rounded-xl px-3 py-2.5 ${editingRecordId === r.id && showRecordForm ? 'ring-2 ring-orange-500' : ''}`}>
                          <div className="flex items-center justify-between gap-2">
                            <p className="text-sm font-bold text-slate-700 min-w-0">
                              {sideName(r.sideA.label)} vs {sideName(r.sideB.label)}
                              {!r.fromTeams && <span className="ml-1.5 text-xs text-slate-400 font-medium">직접 구성</span>}
                            </p>
                            <div className="flex items-center gap-2 shrink-0">
                              <p className="text-sm font-black text-slate-800">{r.winsA} : {r.winsB}</p>
                              {!showRecordForm && !isPastSeasonRecord(r) && (
                                <button
                                  onClick={() => openRecordForm(r)}
                                  disabled={busy || lockedByOther}
                                  className="text-xs font-bold text-slate-500 bg-white border border-slate-200 rounded-full px-2 py-0.5 disabled:opacity-40"
                                >
                                  수정
                                </button>
                              )}
                            </div>
                          </div>
                          <p className="text-xs text-slate-400 mt-0.5">
                            {r.games}판 · 입력 {r.enteredBy || '-'}{r.editedBy ? ` · 수정 ${r.editedBy}` : ''}
                          </p>
                          {!r.fromTeams && (
                            <div className="text-xs text-slate-500 mt-1 space-y-0.5">
                              <p>팀1: {r.sideA.members.map((id) => players[id]?.name || '?').join(', ')}</p>
                              <p>팀2: {r.sideB.members.map((id) => players[id]?.name || '?').join(', ')}</p>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}

                  {/* 누가 입력 중이면 안내 */}
                  {!showRecordForm && (lockedByOther || lockNotice) && (
                    <p className="mt-3 text-xs font-bold text-amber-700 bg-amber-50 rounded-lg px-3 py-2">
                      ✍️ 다른 사람이 입력중입니다.{lockedByOther && editLock?.name ? ` (${editLock.name}님)` : ''}
                    </p>
                  )}

                  {viewBeforeSeason && (
                    <p className="mt-3 text-xs text-slate-400">지난 시즌 날짜라 기록을 넣거나 고칠 수 없어요.</p>
                  )}

                  {/* 결과 입력: 누구나 */}
                  {!showRecordForm && !viewBeforeSeason && !noGame && (
                    <button
                      onClick={() => openRecordForm()}
                      disabled={busy || lockedByOther}
                      className="w-full mt-3 bg-slate-900 text-white rounded-xl py-2.5 text-sm font-bold disabled:opacity-40"
                    >
                      + 경기 결과 입력
                    </button>
                  )}

                  {showRecordForm && (() => {
                    const canUseTeams = teamLabels.length >= 2;
                    const mode = canUseTeams ? recMode : 'custom';
                    const nameA = mode === 'teams' && activePair ? `${activePair[0]}팀` : '팀1';
                    const nameB = mode === 'teams' && activePair ? `${activePair[1]}팀` : '팀2';
                    const pickerPlayers = activePlayers
                      .filter((p) => recShowAll || daily.attendance?.[p.id] || recAssign[p.id])
                      .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));
                    const count1 = Object.values(recAssign).filter((v) => v === 1).length;
                    const count2 = Object.values(recAssign).filter((v) => v === 2).length;
                    return (
                      <div className="mt-3 border-t border-slate-100 pt-3 space-y-3">
                        <p className="text-sm font-bold text-slate-800">{editingRecordId ? '✏️ 기록 수정' : '✍️ 경기 결과 입력'}</p>
                        <div className="flex rounded-lg bg-slate-100 p-1">
                          <button
                            onClick={() => { setRecMode('teams'); setConfirmingRecord(false); }}
                            disabled={!canUseTeams}
                            className={`flex-1 py-2 rounded-md text-xs font-bold disabled:opacity-40 ${mode === 'teams' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
                          >
                            {isToday ? '오늘' : '그날'} 팀끼리
                          </button>
                          <button
                            onClick={() => { setRecMode('custom'); setConfirmingRecord(false); }}
                            className={`flex-1 py-2 rounded-md text-xs font-bold ${mode === 'custom' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
                          >
                            직접 구성
                          </button>
                        </div>
                        {!canUseTeams && (
                          <p className="text-xs text-slate-400 -mt-1">{isToday ? '오늘' : '그날'} 나눈 팀이 없어서 '직접 구성'으로만 입력할 수 있어요.</p>
                        )}

                        {mode === 'teams' ? (
                          <div>
                            <p className="text-xs text-slate-500 mb-2">맞붙은 두 팀을 고르세요. 이 기록은 {isToday ? '오늘' : '그날'} 승부예측에 반영돼요.</p>
                            {daily.predictionResult?.finalized && (
                              <p className="text-xs font-bold text-amber-700 bg-amber-50 rounded-lg px-2.5 py-1.5 mb-2">이미 마감된 날이에요. 저장하면 승부예측 결과가 바뀐 기록 기준으로 자동으로 다시 정산돼요.</p>
                            )}
                            <div className="flex flex-wrap gap-2">
                              {teamPairs.map(([a, b]) => {
                                const selected = activePair && activePair[0] === a && activePair[1] === b;
                                return (
                                  <button
                                    key={a + b}
                                    onClick={() => { setRecPair([a, b]); setRecWinsA(null); setConfirmingRecord(false); }}
                                    className={`px-3 py-2 rounded-lg text-sm font-bold border ${selected ? 'bg-slate-900 text-white border-slate-900' : 'border-slate-200 text-slate-600'}`}
                                  >
                                    {a} vs {b}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ) : (
                          <div>
                            <p className="text-xs text-slate-500 mb-2">이름을 누를 때마다 팀1 → 팀2 → 빼기 순으로 바뀌어요. 승부예측에는 반영되지 않아요.</p>
                            {teamLabels.length > 0 && (
                              <div className="flex flex-wrap gap-1.5 mb-2">
                                {teamLabels.map((l) => (
                                  <React.Fragment key={l}>
                                    <button onClick={() => loadTeamInto(l, 1)} className="text-xs font-bold text-blue-600 bg-blue-50 rounded-lg px-2 py-1">{l}팀 → 팀1</button>
                                    <button onClick={() => loadTeamInto(l, 2)} className="text-xs font-bold text-orange-600 bg-orange-50 rounded-lg px-2 py-1">{l}팀 → 팀2</button>
                                  </React.Fragment>
                                ))}
                              </div>
                            )}
                            <div className="flex flex-wrap gap-1.5">
                              {pickerPlayers.map((p) => {
                                const side = recAssign[p.id];
                                return (
                                  <button
                                    key={p.id}
                                    onClick={() => cycleAssign(p.id)}
                                    className={`text-xs font-bold rounded-full px-2.5 py-1.5 border ${side === 1 ? 'bg-blue-600 text-white border-blue-600' : side === 2 ? 'bg-orange-600 text-white border-orange-600' : 'border-slate-200 text-slate-500'}`}
                                  >
                                    {side ? `${side} ` : ''}{p.name}
                                  </button>
                                );
                              })}
                              {pickerPlayers.length === 0 && <p className="text-xs text-slate-400">참석자가 없어요. 아래에서 전체 회원을 불러오세요.</p>}
                            </div>
                            <div className="flex items-center justify-between mt-2">
                              <p className="text-xs font-bold text-slate-500">
                                <span className="text-blue-600">팀1 {count1}명</span> · <span className="text-orange-600">팀2 {count2}명</span>
                              </p>
                              <div className="flex gap-3">
                                {count1 + count2 > 0 && (
                                  <button onClick={() => { setRecAssign({}); setConfirmingRecord(false); }} className="text-xs text-slate-400 underline">모두 빼기</button>
                                )}
                                <button onClick={() => setRecShowAll((v) => !v)} className="text-xs text-slate-400 underline">
                                  {recShowAll ? '참석자만 보기' : '전체 회원 보기'}
                                </button>
                              </div>
                            </div>
                          </div>
                        )}

                        <div className="flex items-center justify-between">
                          <span className="text-sm font-semibold text-slate-600">이 구성으로 한 판수</span>
                          <div className="flex items-center gap-2">
                            <button onClick={() => changeRecGames(-1)} className="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 font-bold">−</button>
                            <span className="w-6 text-center font-black text-slate-800">{recGames}</span>
                            <button onClick={() => changeRecGames(1)} className="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 font-bold">+</button>
                          </div>
                        </div>

                        {recGames === 1 ? (
                          <div className="grid grid-cols-2 gap-2">
                            {[[1, nameA], [0, nameB]].map(([w, name]) => (
                              <button
                                key={name}
                                onClick={() => { setRecWinsA(w); setConfirmingRecord(false); }}
                                className={`py-2.5 rounded-xl text-sm font-bold ${recWinsA === w ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}
                              >
                                {name} 승
                              </button>
                            ))}
                          </div>
                        ) : (
                          <div className="bg-slate-50 rounded-xl px-3 py-2.5">
                            <p className="text-xs text-slate-500 mb-2">{nameA}의 승수를 정하면 {nameB} 승수는 자동으로 계산돼요.</p>
                            <div className="flex items-center justify-between">
                              <span className="text-sm font-bold text-slate-700">{nameA}</span>
                              <div className="flex items-center gap-2">
                                <button onClick={() => { setRecWinsA((w) => Math.max(0, (w ?? 1) - 1)); setConfirmingRecord(false); }} className="w-8 h-8 rounded-lg bg-white text-slate-600 font-bold border border-slate-200">−</button>
                                <span className="w-14 text-center font-black text-slate-800">
                                  {recWinsA === null ? '- : -' : `${recWinsA} : ${recGames - recWinsA}`}
                                </span>
                                <button onClick={() => { setRecWinsA((w) => Math.min(recGames, (w ?? 0) + 1)); setConfirmingRecord(false); }} className="w-8 h-8 rounded-lg bg-white text-slate-600 font-bold border border-slate-200">+</button>
                              </div>
                              <span className="text-sm font-bold text-slate-700">{nameB}</span>
                            </div>
                          </div>
                        )}

                        {!confirmingRecord ? (
                          <div className="grid grid-cols-2 gap-2">
                            <button onClick={closeRecordForm} disabled={busy} className="py-2.5 rounded-xl text-sm font-bold text-slate-500 bg-slate-100">닫기</button>
                            <button onClick={askSaveRecord} disabled={busy} className="py-2.5 rounded-xl text-sm font-bold text-white bg-orange-600 disabled:opacity-40">저장</button>
                          </div>
                        ) : (
                          <div className="bg-slate-50 rounded-xl p-3 text-center">
                            <p className="text-sm font-bold text-slate-700 mb-3">
                              {nameA} {recWinsA} : {recGames - recWinsA} {nameB} ({recGames}판)으로 {editingRecordId ? '수정' : '저장'}할까요?
                            </p>
                            <div className="grid grid-cols-2 gap-2">
                              <button onClick={() => setConfirmingRecord(false)} className="py-2 rounded-lg text-sm font-bold text-slate-500 bg-white">취소</button>
                              <button onClick={handleSaveRecord} disabled={busy} className="py-2 rounded-lg text-sm font-bold text-white bg-slate-900">{editingRecordId ? '수정' : '저장'}</button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  {/* 관리자: 그날 경기 마감 (지난 날도 가능) */}
                  {can(me, 'closeDay') && !showRecordForm && teamRecords.length > 0 && !daily.predictionResult?.finalized && !viewBeforeSeason && (
                    !confirmingClose ? (
                      <button
                        onClick={() => setConfirmingClose(true)}
                        className="w-full mt-2 border border-slate-200 text-slate-700 rounded-xl py-2.5 text-sm font-bold"
                      >
                        {isToday ? '오늘' : '그날'} 경기 마감 (예측 결과 확정)
                      </button>
                    ) : (
                      <div className="bg-slate-50 rounded-xl p-3 mt-2 text-center">
                        <p className="text-sm font-bold text-slate-700 mb-1">
                          {leaders.length === 1
                            ? `${leaders[0]}팀이 ${topWins}승으로 1위예요. ${leaders[0]}팀을 고른 사람은 ${fmtNum(predictionPoints(leaders[0], leaders, daily.predictions))}점씩`
                            : `${leaders.join(', ')}팀이 ${topWins}승으로 공동 1위예요. ${leaders.map((l) => `${l}팀 ${fmtNum(predictionPoints(l, leaders, daily.predictions))}점`).join(', ')}`}
                        </p>
                        <p className="text-xs text-slate-400 mb-3">마감하면 참가신청과 예측이 닫혀요. 마감 뒤에 경기 기록을 추가하거나 고치면 예측 결과가 자동으로 다시 정산돼요.</p>
                        <div className="grid grid-cols-2 gap-2">
