const { useState, useEffect } = React;

// ============================================================
// 설정값은 config.js에서 불러와요 (이 파일에서는 수정할 필요 없음)
// ============================================================
const APP_CONFIG = window.APP_CONFIG || {};
const API_URL = APP_CONFIG.API_URL || 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
const CLUB_NAME = APP_CONFIG.CLUB_NAME || '점농회';
const ADMIN_CODE = APP_CONFIG.ADMIN_CODE || 'HOOP2026';
const POSITIONS = ['포인트가드', '슈팅가드', '스몰포워드', '파워포워드', '센터'];
const POSITION_ABBR = { '포인트가드': 'PG', '슈팅가드': 'SG', '스몰포워드': 'SF', '파워포워드': 'PF', '센터': 'C' };
const POSITION_SHORT = { '포인트가드': '포인트', '슈팅가드': '슈팅', '스몰포워드': '스몰', '파워포워드': '파워', '센터': '센터' };
const GUARD_POSITIONS = ['포인트가드', '슈팅가드'];
const BIG_POSITIONS = ['파워포워드', '센터'];

// 예전 3단계 포지션(가드/포워드/센터)으로 가입한 회원은 자동으로 바꿔서 읽어요
const LEGACY_POSITION_MAP = { '가드': '슈팅가드', '포워드': '스몰포워드' };

function normalizePosition(pos) {
  if (POSITIONS.includes(pos)) return pos;
  return LEGACY_POSITION_MAP[pos] || '스몰포워드';
}

function normalizePlayers(map) {
  const out = {};
  Object.entries(map || {}).forEach(([id, p]) => { out[id] = { ...p, position: normalizePosition(p.position) }; });
  return out;
}

function parsePlayers(res) {
  return res ? normalizePlayers(JSON.parse(res.value)) : {};
}

// ============================================================
// API 레이어 (Apps Script 백엔드와 통신)
// ============================================================
const api = {
  async get(key) {
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'get failed');
    return data.value === null ? null : { key, value: data.value };
  },
  async set(key, value) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'set', key, value }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'set failed');
    return true;
  },
  async delete(key) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', key }),
    });
    const data = await res.json();
    return data.ok;
  },
  async list(prefix) {
    const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix || '')}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'list failed');
    return { keys: data.keys };
  },
};

async function apiSetWithRetry(key, value) {
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      return await api.set(key, value);
    } catch (e) {
      lastErr = e;
      if (attempt < 2) await new Promise((r) => setTimeout(r, 400 * (attempt + 1)));
    }
  }
  throw lastErr;
}

// ============================================================
// 유틸 함수
// ============================================================
function isStandaloneApp() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}

function openInstallPrompt() {

}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function shiftDate(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function sha256Hex(pw) {
  const data = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function simpleHashHex(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

async function hashPassword(pw) {
  try {
    if (window.crypto && window.crypto.subtle && window.crypto.subtle.digest) {
      return { hash: await sha256Hex(pw), method: 'sha256' };
    }
  } catch (e) { /* 폴백으로 진행 */ }
  return { hash: simpleHashHex(pw), method: 'simple' };
}

async function verifyPassword(pw, player) {
  const method = player.passwordMethod || 'sha256';
  if (method === 'simple') return simpleHashHex(pw) === player.passwordHash;
  try {
    return (await sha256Hex(pw)) === player.passwordHash;
  } catch (e) {
    return false;
  }
}

// ============================================================
// 점수 계산
// - 팀 배정: Rating(엘로 점수) + 키 + 포지션 (아래 '팀 배정' 부분 참고)
// - Rating 랭킹: 엘로 점수, 20경기 이상만 순위에 포함
// - 승률 랭킹: 윌슨 점수, 20경기 이상만 순위에 포함
// - 적중률 랭킹: 윌슨 점수 (95% 신뢰구간 하한, 판수가 적을수록 낮게 매김)
// 승률과 적중률은 서로 섞지 않고 따로 계산해요.
// ============================================================
const RANKING_MIN_GAMES = 20; // 승률 랭킹, Rating 랭킹에 들어가기 위한 최소 경기 수

function gamesPlayed(p) {
  return (p?.wins || 0) + (p?.losses || 0);
}

function wilsonScore(success, total) {
  if (!total) return 0;
  const z = 1.96;
  const z2 = z * z;
  const p = success / total;
  const center = p + z2 / (2 * total);
  const margin = z * Math.sqrt((p * (1 - p)) / total + z2 / (4 * total * total));
  return (center - margin) / (1 + z2 / total);
}

// 승부예측 기록: 예측한 횟수와 맞힌 횟수
function predictionStats(p) {
  const history = p?.history || [];
  const total = history.filter((h) => h.predicted).length;
  const correct = history.filter((h) => h.predicted && h.predictionCorrect).length;
  return { correct, total };
}

function pct(success, total) {
  return total ? `${Math.round((success / total) * 100)}%` : '-';
}

function winRatePct(p) {
  return pct(p?.wins || 0, gamesPlayed(p));
}

// ============================================================
// Rating (엘로 점수)
// 경기 전 두 팀의 예상 승리 확률을 계산하고, 예상보다 잘하면 오르고 못하면 내려가요.
// ============================================================
const ELO_BASE = 1500;     // 처음 시작 점수
const ELO_K_NEW = 40;      // 경기 수가 적은 사람은 점수가 빨리 자리 잡도록 크게 움직임
const ELO_K = 24;          // 경기를 어느 정도 한 사람
const ELO_NEW_GAMES = 10;  // 이 경기 수 미만이면 '새로 온 사람'으로 봄

function eloOf(p) {
  return typeof p?.elo === 'number' ? p.elo : ELO_BASE;
}

function teamAverageElo(ids, playerMap) {
  const list = ids.map((id) => playerMap[id]).filter(Boolean);
  if (!list.length) return ELO_BASE;
  return list.reduce((sum, p) => sum + eloOf(p), 0) / list.length;
}

// A팀이 이길 예상 확률
function expectedWinA(eloA, eloB) {
  return 1 / (1 + Math.pow(10, (eloB - eloA) / 400));
}

// ============================================================
// 팀 배정
// 1) 무조건 지킬 규칙을 어기면 큰 벌점
// 2) 리바운드 > 포지션 구성 > 실력 > 평균 키 순으로 두 팀의 차이를 점수화
// 3) 가능한 조합을 전부 계산해서 가장 공평한 조합들 중 하나를 무작위로 선택
// 팀 수: 6·8·10명 2팀, 9·12·15명 3팀, 16명 4팀 (관리자가 바꿀 수 있음)
// ============================================================
// 리바운드용 유효 키 보정(cm)
const POSITION_HEIGHT_BONUS = { '포인트가드': 0, '슈팅가드': 1, '스몰포워드': 3, '파워포워드': 5, '센터': 6 };
// 두 팀의 포지션 수가 다를 때 벌점 크기 (센터 차이를 가장 크게 봄)
const POSITION_BALANCE_WEIGHT = { '포인트가드': 0.5, '슈팅가드': 0.3, '스몰포워드': 0.3, '파워포워드': 0.7, '센터': 1.0 };
const TEAM_WEIGHTS = { rebound: 4, position: 3, skill: 2, height: 1 };
const MIN_HEIGHT = 140;
const MAX_HEIGHT = 220;
const DEFAULT_HEIGHT = 175;
const MAX_EXHAUSTIVE = { 2: 22, 3: 15, 4: 12 }; // 팀 수별로 이 인원까지는 모든 조합을 다 계산
const HARD_PENALTY = 1000;

function validHeight(h) {
  const n = Number(h);
  return n >= MIN_HEIGHT && n <= MAX_HEIGHT ? n : null;
}

function stdDev(values, floor) {
  if (values.length < 2) return floor;
  const mean = values.reduce((a, b) => a + b, 0) / values.length;
  const variance = values.reduce((a, b) => a + (b - mean) * (b - mean), 0) / values.length;
  return Math.max(Math.sqrt(variance), floor);
}

const TEAM_LABELS = ['A', 'B', 'C', 'D'];
const TEAM_STYLE = {
  A: { light: 'text-blue-400', dark: 'text-blue-600', tone: 'bg-blue-600', soft: 'border-blue-600 bg-blue-50' },
  B: { light: 'text-orange-400', dark: 'text-orange-600', tone: 'bg-orange-600', soft: 'border-orange-600 bg-orange-50' },
  C: { light: 'text-emerald-400', dark: 'text-emerald-600', tone: 'bg-emerald-600', soft: 'border-emerald-600 bg-emerald-50' },
  D: { light: 'text-violet-400', dark: 'text-violet-600', tone: 'bg-violet-600', soft: 'border-violet-600 bg-violet-50' },
};

// 참가 인원별 팀 수
const TEAM_COUNT_BY_SIZE = { 6: 2, 8: 2, 10: 2, 9: 3, 12: 3, 15: 3, 16: 4 };
const VALID_SIZES = Object.keys(TEAM_COUNT_BY_SIZE).map(Number).sort((a, b) => a - b);

// 팀을 짤 수 있는 인원까지 몇 명 더 필요한지 (5, 7, 11, 14명 → 1명 / 4, 13명 → 2명)
function moreNeeded(n) {
  if (n <= 0 || TEAM_COUNT_BY_SIZE[n]) return 0;
  const next = VALID_SIZES.find((v) => v > n);
  return next ? next - n : 0;
}

// 기본 팀 수: 표에 있으면 그대로, 없으면 다음 목표 인원의 팀 수 (16명 초과는 4팀)
function defaultTeamCount(n) {
  if (TEAM_COUNT_BY_SIZE[n]) return TEAM_COUNT_BY_SIZE[n];
  const next = VALID_SIZES.find((v) => v > n);
  return next ? TEAM_COUNT_BY_SIZE[next] : 4;
}

// 하루 일정 (휴대폰 시간 기준)
const SIGNUP_OPEN_MIN = 5 * 60;           // 참가신청 오픈 05:00
const SIGNUP_CLOSE_MIN = 11 * 60 + 45;    // 참가신청 마감 11:45
const PREDICTION_CLOSE_MIN = 12 * 60 + 30; // 결과예측 마감 12:30

// 겹치지 않는 고유 번호 (같은 순간에 두 사람이 저장해도 다르게)
function uniqueId(prefix) {
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

function minutesOfDay(d) {
  return d.getHours() * 60 + d.getMinutes();
}

// 경기 결과 입력 잠금: 마지막 신호 후 이 시간이 지나면 자동으로 풀림
const EDIT_LOCK_TTL_MS = 3 * 60 * 1000;
const EDIT_LOCK_HEARTBEAT_MS = 45 * 1000;

function lockActive(lock) {
  return !!lock && Date.now() - new Date(lock.at).getTime() < EDIT_LOCK_TTL_MS;
}

// 팀 이름 표시 (A → A팀, 직접 구성의 '팀1'은 그대로)
function sideName(label) {
  return TEAM_LABELS.includes(label) ? `${label}팀` : label;
}

function generateTeams(attendeePlayers, teamCount) {
  const n = attendeePlayers.length;
  const k = Math.max(2, Math.min(teamCount || defaultTeamCount(n), 4, Math.floor(n / 2) || 2));
  if (n < 2) return { A: attendeePlayers.map((p) => p.id), B: [] };

  // 키를 입력하지 않은 사람은 오늘 참석자 평균 키로 계산
  const known = attendeePlayers.map((p) => validHeight(p.height)).filter((h) => h !== null);
  const fallbackHeight = known.length ? known.reduce((a, b) => a + b, 0) / known.length : DEFAULT_HEIGHT;

  const pos = attendeePlayers.map((p) => normalizePosition(p.position));
  const height = attendeePlayers.map((p) => validHeight(p.height) ?? fallbackHeight);
  const eff = height.map((h, i) => h + (POSITION_HEIGHT_BONUS[pos[i]] || 0));
  const elo = attendeePlayers.map(eloOf);
  const posIdx = pos.map((p) => POSITIONS.indexOf(p));
  const isC = pos.map((p) => (p === '센터' ? 1 : 0));
  const isBig = pos.map((p) => (BIG_POSITIONS.includes(p) ? 1 : 0));
  const isGuard = pos.map((p) => (GUARD_POSITIONS.includes(p) ? 1 : 0));
  const totalC = isC.reduce((a, b) => a + b, 0);
  const totalGuard = isGuard.reduce((a, b) => a + b, 0);
  const balanceWeight = POSITIONS.map((p) => POSITION_BALANCE_WEIGHT[p]);
  const P = POSITIONS.length;

  // 단위가 다른 값을 같은 눈금으로 맞추기 위한 기준 (오늘 참석자들 사이의 표준편차)
  const sdEff = stdDev(eff, 3);
  const sdHeight = stdDev(height, 3);
  const sdElo = stdDev(elo, 50);

  const assign = new Int8Array(n); // 선수별 팀 번호 (0, 1, 2)
  const tN = new Float64Array(k), tElo = new Float64Array(k), tH = new Float64Array(k);
  const tC = new Int32Array(k), tBig = new Int32Array(k), tGuard = new Int32Array(k);
  const top1 = new Float64Array(k), top2 = new Float64Array(k);
  const cnt = new Int32Array(k * P);

  function cost() {
    tN.fill(0); tElo.fill(0); tH.fill(0); tC.fill(0); tBig.fill(0); tGuard.fill(0); cnt.fill(0);
    top1.fill(-Infinity); top2.fill(-Infinity);
    for (let i = 0; i < n; i++) {
      const t = assign[i];
      tN[t]++; tElo[t] += elo[i]; tH[t] += height[i];
      tC[t] += isC[i]; tBig[t] += isBig[i]; tGuard[t] += isGuard[i];
      cnt[t * P + posIdx[i]]++;
      const v = eff[i];
      if (v > top1[t]) { top2[t] = top1[t]; top1[t] = v; } else if (v > top2[t]) { top2[t] = v; }
    }

    // 1) 무조건 지킬 규칙
    let penalty = 0;
    let minC = Infinity, maxC = -Infinity, minBig = Infinity, maxBig = -Infinity, minGuard = Infinity;
    for (let t = 0; t < k; t++) {
      minC = Math.min(minC, tC[t]); maxC = Math.max(maxC, tC[t]);
      minBig = Math.min(minBig, tBig[t]); maxBig = Math.max(maxBig, tBig[t]);
      minGuard = Math.min(minGuard, tGuard[t]);
    }
    if (totalC >= k ? minC < 1 : maxC > 1) penalty += HARD_PENALTY;      // 센터는 팀마다 고르게 (팀 수 이상이면 팀마다 1명 이상)
    if (maxBig - minBig > 1) penalty += HARD_PENALTY;                      // 빅맨(PF+C) 수 차이 1명 이하
    if (totalGuard >= k && minGuard < 1) penalty += HARD_PENALTY;          // 가드(PG+SG)가 팀 수 이상이면 팀마다 1명 이상

    // 2) 모든 팀 쌍을 서로 비교해서 차이를 합산
    let rebound = 0, position = 0, skill = 0, heightTerm = 0;
    for (let a = 0; a < k; a++) {
      for (let b = a + 1; b < k; b++) {
        // 리바운드: 팀에서 가장 큰 빅맨끼리, 두 번째 빅맨끼리 비교 (첫 번째가 더 중요)
        const d1 = (top1[a] - top1[b]) / sdEff;
        const d2 = Number.isFinite(top2[a]) && Number.isFinite(top2[b]) ? (top2[a] - top2[b]) / sdEff : 0;
        rebound += d1 * d1 + 0.5 * d2 * d2;
        // 포지션 구성: 포지션별 인원 차이에 비중을 곱해서 합산
        for (let q = 0; q < P; q++) {
          const d = cnt[a * P + q] - cnt[b * P + q];
          position += balanceWeight[q] * d * d;
        }
        // Rating: 팀 평균 차이
        const ds = (tElo[a] / tN[a] - tElo[b] / tN[b]) / sdElo;
        skill += ds * ds;
        // 평균 키 차이
        const dh = (tH[a] / tN[a] - tH[b] / tN[b]) / sdHeight;
        heightTerm += dh * dh;
      }
    }

    return penalty
      + TEAM_WEIGHTS.rebound * rebound
      + TEAM_WEIGHTS.position * position
      + TEAM_WEIGHTS.skill * skill
      + TEAM_WEIGHTS.height * heightTerm;
  }

  // 가장 공평한 점수에 아주 가까운 조합까지 후보로 인정 (다시 나누기를 누를 때마다 다른 조합이 나오도록)
  const nearBest = (best) => best + Math.max(0.15, best * 0.1);
  const minSize = Math.floor(n / k);
  const maxSize = Math.ceil(n / k);
  let chosen = null;

  if (n <= (MAX_EXHAUSTIVE[k] || 0)) {
    // 모든 조합 계산 (팀 이름만 바뀐 같은 조합은 한 번만 계산)
    const codes = [];
    const costs = [];
    const sizes = new Int32Array(k);
    let best = Infinity;
    const rec = (i, used) => {
      if (i === n) {
        const c = cost();
        let code = 0;
        for (let j = n - 1; j >= 0; j--) code = code * k + assign[j];
        codes.push(code);
        costs.push(c);
        if (c < best) best = c;
        return;
      }
      let need = 0; // 남은 인원으로 모든 팀을 최소 인원까지 채울 수 있는지 확인
      for (let t = 0; t < k; t++) need += Math.max(0, minSize - sizes[t]);
      if (n - i < need) return;
      const limit = Math.min(used + 1, k);
      for (let t = 0; t < limit; t++) {
        if (sizes[t] >= maxSize) continue;
        assign[i] = t;
        sizes[t]++;
        rec(i + 1, t === used ? used + 1 : used);
        sizes[t]--;
      }
    };
    rec(0, 0);
    const threshold = nearBest(best);
    const pool = [];
    for (let j = 0; j < costs.length; j++) if (costs[j] <= threshold) pool.push(codes[j]);
    let code = pool[Math.floor(Math.random() * pool.length)];
    chosen = new Int8Array(n);
    for (let j = 0; j < n; j++) { chosen[j] = code % k; code = Math.floor(code / k); }
  } else {
    // 인원이 아주 많으면: 무작위로 나눈 뒤 선수를 한 명씩 맞바꾸며 개선하는 방식
    const order = [...Array(n).keys()];
    const candidates = [];
    for (let t = 0; t < 120; t++) {
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      order.forEach((playerIdx, idx) => { assign[playerIdx] = idx % k; });
      let current = cost();
      let improved = true;
      while (improved) {
        improved = false;
        for (let i = 0; i < n && !improved; i++) {
          for (let j = i + 1; j < n; j++) {
            if (assign[i] === assign[j]) continue;
            const ti = assign[i];
            assign[i] = assign[j];
            assign[j] = ti;
            const c = cost();
            if (c < current - 1e-9) { current = c; improved = true; break; }
            assign[j] = assign[i];
            assign[i] = ti;
          }
        }
      }
      candidates.push({ cost: current, pick: Int8Array.from(assign) });
    }
    let best = Infinity;
    for (const c of candidates) if (c.cost < best) best = c.cost;
    const threshold = nearBest(best);
    const pool = candidates.filter((c) => c.cost <= threshold);
    chosen = pool[Math.floor(Math.random() * pool.length)].pick;
  }

  // 팀 이름(A, B, C)도 무작위로 붙이기
  const labels = TEAM_LABELS.slice(0, k);
  for (let i = labels.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [labels[i], labels[j]] = [labels[j], labels[i]];
  }
  const teams = {};
  TEAM_LABELS.slice(0, k).forEach((l) => { teams[l] = []; });
  attendeePlayers.forEach((p, i) => teams[labels[chosen[i]]].push(p.id));
  return teams;
}

// 경기 기록 한 건을 선수들에게 반영 (승패, Rating, 개인 기록). 여러 판이면 한 번에 반영
// basis: 기록을 수정할 때 처음 계산했던 예상 승률과 K값을 그대로 쓰기 위한 값 (같은 팀원일 때)
function applyRecord(nextPlayers, record, basis = null) {
  const { sideA, sideB, games, winsA, winsB, fromTeams, id: recordId, date } = record;
  const expectA = basis && typeof basis.expectA === 'number'
    ? basis.expectA
    : expectedWinA(teamAverageElo(sideA.members, nextPlayers), teamAverageElo(sideB.members, nextPlayers));
  const deltas = [];
  const apply = (ids, myLabel, oppLabel, myWins, myLosses, expected) => {
    ids.forEach((id) => {
      const pl = nextPlayers[id];
      if (!pl) return;
      const k = basis?.kByPlayer?.[id] ?? (gamesPlayed(pl) < ELO_NEW_GAMES ? ELO_K_NEW : ELO_K);
      const eloDelta = Math.round(k * (myWins - games * expected) * 10) / 10;
      nextPlayers[id] = {
        ...pl,
        wins: (pl.wins || 0) + myWins,
        losses: (pl.losses || 0) + myLosses,
        elo: eloOf(pl) + eloDelta,
        history: [...(pl.history || []), { kind: 'record', recordId, date, team: myLabel, opponent: oppLabel, wins: myWins, losses: myLosses, eloDelta, k, manual: !fromTeams }],
      };
      deltas.push({ playerId: id, winsDelta: myWins, lossesDelta: myLosses, predictionScoreDelta: 0, eloDelta });
    });
  };
  apply(sideA.members, sideA.label, sideB.label, winsA, winsB, expectA);
  apply(sideB.members, sideB.label, sideA.label, winsB, winsA, 1 - expectA);
  return { deltas, expectA };
}

// 참가 인원 구성을 하나의 문자열로 (순서 무관)
function attendanceKey(ids) {
  return [...ids].sort().join(',');
}

// 팀 나누기 기억장치: 한 번 나눈 인원 구성에는 항상 그때 나눈 팀을 그대로 씀
// (참가 취소 후 다시 신청해서 팀을 새로 뽑는 꼼수 방지)
// 지금 화면의 팀을 그 팀의 인원 구성으로 저장해두고, 갱신된 기억장치를 돌려줌
function rememberCurrentTeams(day) {
  const cache = { ...(day.teamCache || {}) };
  if (day.teams) {
    const ids = TEAM_LABELS.flatMap((l) => day.teams[l] || []);
    const key = attendanceKey(ids);
    cache[key] = { ...(cache[key] || {}), teams: day.teams, teamsBy: day.teamsBy || null, teamsAt: day.teamsAt || null, predictions: day.predictions || {} };
  }
  return cache;
}

function sameMembers(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  const x = [...a].sort();
  const y = [...b].sort();
  return x.every((v, i) => v === y[i]);
}

// 경기 기록 한 건이 선수들에게 반영된 것을 개인 기록 기준으로 정확히 되돌림 (수정된 기록도 현재 내용 그대로 되돌려짐)
function revertRecord(nextPlayers, recordId) {
  Object.keys(nextPlayers).forEach((id) => {
    const pl = nextPlayers[id];
    const entries = (pl.history || []).filter((h) => h.recordId === recordId);
    if (!entries.length) return;
    const sum = (f) => entries.reduce((a, h) => a + (h[f] || 0), 0);
    nextPlayers[id] = {
      ...pl,
      wins: (pl.wins || 0) - sum('wins'),
      losses: (pl.losses || 0) - sum('losses'),
      elo: eloOf(pl) - sum('eloDelta'),
      history: pl.history.filter((h) => h.recordId !== recordId),
    };
  });
}

const RANK_TITLES = { winrate: '승률 랭킹', prediction: '적중률 랭킹', skill: 'Rating 랭킹' };
const POSITION_PILL = {
  '포인트가드': ['#dbeafe', '#1d4ed8'],
  '슈팅가드': ['#e0f2fe', '#0369a1'],
  '스몰포워드': ['#fef3c7', '#b45309'],
  '파워포워드': ['#ffedd5', '#c2410c'],
  '센터': ['#e2e8f0', '#334155'],
};
const MEDAL_COLORS = ['#f59e0b', '#94a3b8', '#b45309'];

function fillRoundRect(ctx, x, y, w, h, r, color) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawBall(ctx, cx, cy, r) {
  ctx.save();
  ctx.fillStyle = '#f97316';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = r * 0.09; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.stroke();
  const k = r * 0.707;
  ctx.beginPath(); ctx.moveTo(cx - k, cy - k); ctx.quadraticCurveTo(cx - r * 0.25, cy, cx - k, cy + k); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + k, cy - k); ctx.quadraticCurveTo(cx + r * 0.25, cy, cx + k, cy + k); ctx.stroke();
  ctx.restore();
}

function fitText(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxWidth) t = t.slice(0, -1);
  return t + '…';
}

async function renderRankingImage({ clubName, title, lines, rows, unrankedLabel }) {
  const FONT = '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  const DISPLAY = `"Black Han Sans", ${FONT}`;
  try {
    await Promise.all([
      document.fonts.load(`700 34px ${FONT}`),
      document.fonts.load(`400 24px ${FONT}`),
      document.fonts.load(`48px ${DISPLAY}`),
    ]);
  } catch (e) { /* 기본 글꼴로 그림 */ }

  const W = 1080;
  const ROW_H = 104;
  const CARD_X = 40;
  const CARD_W = W - CARD_X * 2;
  const L = CARD_X + 28;
  const R = W - CARD_X - 28;
  const HEADER_H = 326 + Math.max(0, lines.length - 2) * 34;
  const ranked = rows.filter((r) => r.ranked);
  const unranked = rows.filter((r) => !r.ranked);
  const rankedRows = Math.max(ranked.length, 1);
  const rankedCardH = rankedRows * ROW_H + 16;
  const unrankedBlockH = unranked.length ? 70 + unranked.length * ROW_H + 16 : 0;
  const FOOTER_H = 44;
  const H = HEADER_H + 36 + rankedCardH + unrankedBlockH + FOOTER_H;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.textBaseline = 'alphabetic';

  // 배경과 머리말
  ctx.fillStyle = '#f1f5f9'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, W, HEADER_H);
  fillRoundRect(ctx, L - 8, 52, 76, 76, 20, '#ea580c');
  drawBall(ctx, L + 30, 90, 26);
  ctx.fillStyle = '#ffffff'; ctx.font = `44px ${DISPLAY}`; ctx.textAlign = 'left';
  ctx.fillText(clubName, L + 92, 106);
  ctx.fillStyle = '#fb923c'; ctx.font = `64px ${DISPLAY}`;
  ctx.fillText(title, L - 6, 208);
  ctx.fillStyle = '#94a3b8'; ctx.font = `500 25px ${FONT}`;
  lines.forEach((line, i) => ctx.fillText(fitText(ctx, line, R - L), L - 4, 252 + i * 34));

  const drawRow = (row, y) => {
    const cy = y + ROW_H / 2;
    const medal = row.ranked && row.rank <= 3 ? MEDAL_COLORS[row.rank - 1] : null;
    // 순위
    ctx.textAlign = 'center';
    ctx.font = `40px ${DISPLAY}`;
    ctx.fillStyle = medal || (row.ranked ? '#cbd5e1' : '#e2e8f0');
    ctx.fillText(row.ranked ? String(row.rank) : (row.groupRank ? String(row.groupRank) : '-'), L + 22, cy + 14);
    // 이름 첫 글자
    ctx.beginPath(); ctx.arc(L + 92, cy, 30, 0, Math.PI * 2);
    ctx.fillStyle = medal || (row.ranked ? '#334155' : '#cbd5e1'); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = `700 26px ${FONT}`;
    ctx.fillText((row.name || '?').slice(0, 1), L + 92, cy + 9);
    // 점수
    ctx.textAlign = 'right';
    ctx.font = `800 36px ${FONT}`;
    ctx.fillStyle = row.ranked ? '#0f172a' : '#cbd5e1';
    ctx.fillText(row.scoreLabel, R - 8, cy + 13);
    const scoreW = ctx.measureText(row.scoreLabel).width;
    // 이름 + 포지션
    const nameX = L + 140;
    const maxText = R - 8 - scoreW - 32 - nameX;
    ctx.textAlign = 'left';
    ctx.font = `700 32px ${FONT}`;
    ctx.fillStyle = '#1e293b';
    const pos = normalizePosition(row.position);
    const pill = POSITION_ABBR[pos] || '';
    ctx.font = `800 20px ${FONT}`;
    const pillW = pill ? ctx.measureText(pill).width + 24 : 0;
    ctx.font = `700 32px ${FONT}`;
    const name = fitText(ctx, row.name || '?', maxText - pillW - 14);
    ctx.fillText(name, nameX, cy - 6);
    if (pill) {
      const nameW = ctx.measureText(name).width;
      const [bg, fg] = POSITION_PILL[pos] || ['#f1f5f9', '#475569'];
      fillRoundRect(ctx, nameX + nameW + 14, cy - 36, pillW, 34, 8, bg);
      ctx.fillStyle = fg; ctx.font = `800 20px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(pill, nameX + nameW + 14 + pillW / 2, cy - 12);
      ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#64748b'; ctx.font = `400 23px ${FONT}`;
    ctx.fillText(fitText(ctx, row.detail || '', maxText), nameX, cy + 30);
  };

  // 순위에 든 사람
  let y = HEADER_H + 36;
  fillRoundRect(ctx, CARD_X, y, CARD_W, rankedCardH, 28, '#ffffff');
  y += 8;
  if (!ranked.length) {
    ctx.fillStyle = '#94a3b8'; ctx.font = `500 26px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText('아직 순위에 든 사람이 없어요', W / 2, y + ROW_H / 2 + 9);
    y += ROW_H;
  }
  ranked.forEach((row, i) => {
    drawRow(row, y);
    if (i < ranked.length - 1) { ctx.fillStyle = '#f1f5f9'; ctx.fillRect(L, y + ROW_H - 1, R - L, 2); }
    y += ROW_H;
  });
  y += 8;

  // 아직 순위에 들지 못한 사람
  if (unranked.length) {
    y += 22;
    ctx.fillStyle = '#64748b'; ctx.font = `700 24px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText(unrankedLabel, CARD_X + 8, y + 26);
    y += 48;
    fillRoundRect(ctx, CARD_X, y, CARD_W, unranked.length * ROW_H + 16, 28, '#ffffff');
    y += 8;
    unranked.forEach((row, i) => {
      drawRow(row, y);
      if (i < unranked.length - 1) { ctx.fillStyle = '#f1f5f9'; ctx.fillRect(L, y + ROW_H - 1, R - L, 2); }
      y += ROW_H;
    });
    y += 8;
  }

  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('이미지를 만들지 못했어요'))), 'image/png');
  });
}

// 팀 배정 결과 화면에 보여줄 팀별 요약
function teamSummary(ids, playerMap) {
  const list = ids.map((id) => playerMap[id]).filter(Boolean);
  const heights = list.map((p) => validHeight(p.height)).filter((h) => h !== null);
  return {
    avgHeight: heights.length ? Math.round(heights.reduce((a, b) => a + b, 0) / heights.length) : null,
    maxHeight: heights.length ? Math.max(...heights) : null,
    count: Object.fromEntries(POSITIONS.map((pos) => [pos, list.filter((p) => normalizePosition(p.position) === pos).length])),
    avgElo: list.length ? Math.round(teamAverageElo(ids, playerMap)) : null,
  };
}

  const handleLogout = () => {

  const me = currentPlayerId ? players[currentPlayerId] : null;

  const attendeeIds = Object.keys(daily.attendance || {}).filter((id) => daily.attendance[id]);
  const attendeePlayers = attendeeIds.map((id) => players[id]).filter(Boolean);
  const iAttend = currentPlayerId ? !!daily.attendance?.[currentPlayerId] : false;

  // 내 기록: 최신 날짜가 위로, 같은 날은 나중에 입력한 기록이 위로
  const sortedHistory = [...(me?.history || [])].reverse().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));

  // 오늘 경기 상태
  const teamLabels = daily.teams ? TEAM_LABELS.filter((l) => Array.isArray(daily.teams[l]) && daily.teams[l].length) : [];
  const records = daily.records || [];
  const teamRecords = records.filter((r) => r.fromTeams);
  const legacyFinal = !!daily.result?.finalized; // 예전 방식(1경기 승패)으로 마감된 날
  const dayClosed = !!daily.predictionResult?.finalized || legacyFinal;
  const isToday = viewDate === dateKey;
  const nowMin = minutesOfDay(now);
  const signupOpen = isToday && nowMin >= SIGNUP_OPEN_MIN && nowMin < SIGNUP_CLOSE_MIN && !dayClosed;
  const predictionTimeOver = !isToday || nowMin >= PREDICTION_CLOSE_MIN;
  // 결과예측은 12:30에 마감. 그 전에 오늘 팀끼리 첫 경기가 기록돼도 바로 마감 (지난 날은 예측 불가)
  const predictionLocked = dayClosed || predictionTimeOver || teamRecords.length > 0;

  // 팀 나누기: 아직 팀이 없거나, 팀을 나눈 뒤 참가인원이 바뀌었을 때만 가능 (누구나)
  const teamMemberIds = teamLabels.flatMap((l) => daily.teams[l]);
  const attendanceChanged = !daily.teams || !sameMembers(attendeePlayers.map((p) => p.id), teamMemberIds);
  // 지금 인원 구성으로 예전에 나눈 팀이 있으면, 다시 나누기는 그 팀으로 되돌리기만 함
  const cachedForCurrent = !!daily.teamCache?.[attendanceKey(attendeePlayers.map((p) => p.id))];
  const more = moreNeeded(attendeePlayers.length);
  const myName = me?.name || currentPlayerId;
  const lockedByOther = lockActive(editLock) && editLock.by !== currentPlayerId;
  const standings = Object.fromEntries(teamLabels.map((l) => [l, 0]));
  teamRecords.forEach((r) => {
    if (r.sideA.label in standings) standings[r.sideA.label] += r.winsA;
    if (r.sideB.label in standings) standings[r.sideB.label] += r.winsB;
  });
  const topWins = teamLabels.length ? Math.max(...teamLabels.map((l) => standings[l])) : 0;
  const leaders = teamLabels.filter((l) => standings[l] === topWins);
  const autoTeamCount = defaultTeamCount(attendeePlayers.length);
  const teamCount = teamCountChoice || autoTeamCount;
  const canGenerateTeams = isToday && !dayClosed && attendanceChanged && teamRecords.length === 0 && (cachedForCurrent || attendeePlayers.length >= teamCount * 2);
  const teamPairs = [];
  teamLabels.forEach((a, i) => teamLabels.slice(i + 1).forEach((b) => teamPairs.push([a, b])));
  const activePair = teamPairs.find(([a, b]) => a === recPair[0] && b === recPair[1]) || teamPairs[0] || null;

  const emptyDaily = () => ({ attendance: {}, teams: null, predictions: {}, records: [] });

  const loadFreshDaily = async (date = viewDate) => {

  const loadFreshPlayers = async () => {

  const handleGenerateTeams = async () => {
    setError('');

      if ((fresh.records || []).some((r) => r.fromTeams)) {
        setError('이미 오늘 팀으로 기록된 경기가 있어서 다시 나눌 수 없어요. 관리자 탭에서 기록을 먼저 취소해주세요.');

      const attendeeIds = attendees.map((p) => p.id);
      const key = attendanceKey(attendeeIds);
      const cache = rememberCurrentTeams(fresh);
      const nowIso = new Date().toISOString();
      const nameOf = (id) => players[id]?.name || id;
      let teams;
      let teamsBy;

        ({ teams, teamsBy, teamsAt } = cache[key]);
        predictions = cache[key].predictions || {};
        restored = true;
      } else {
        const count = Math.min(teamCount, 4);
        if (attendees.length < count * 2) { setError(`${count}팀으로 나누려면 최소 ${count * 2}명이 참석해야 해요.`); return; }

      setTeamCountChoice(null);

  // ----- 경기 결과 입력 폼 -----
  const recSides = () => {

      return { sideA: { label: a, members: daily.teams[a] }, sideB: { label: b, members: daily.teams[b] }, fromTeams: true };
    }
    const m1 = Object.keys(recAssign).filter((id) => recAssign[id] === 1 && players[id]);
    const m2 = Object.keys(recAssign).filter((id) => recAssign[id] === 2 && players[id]);
    return { sideA: { label: '팀1', members: m1 }, sideB: { label: '팀2', members: m2 }, fromTeams: false };

  const changeRecGames = (delta) => {
    const g = Math.min(20, Math.max(1, recGames + delta));

      return next;
    });
  };

  const loadTeamInto = (label, side) => {
    setConfirmingRecord(false);
    setRecAssign((a) => {
      const next = {};
      Object.entries(a).forEach(([id, v]) => { if (v !== side) next[id] = v; });
      (daily.teams?.[label] || []).forEach((id) => { next[id] = side; });
      return next;

  // ----- 경기 결과 입력 잠금 (한 번에 한 사람만 입력) -----
  const lockKey = `editLock:${viewDate}`;
  const readLock = async () => {
    const r = await api.get(lockKey).catch(() => null);
    return r ? JSON.parse(r.value) : null;

  const acquireLock = async () => {
    const current = await readLock();
    if (lockActive(current) && current.by !== currentPlayerId) { setEditLock(current); return false; }
    const mine = { by: currentPlayerId, name: myName, at: new Date().toISOString() };
    await apiSetWithRetry(lockKey, JSON.stringify(mine));
    // 거의 동시에 누른 사람이 있었는지 한 번 더 확인
    await new Promise((r) => setTimeout(r, 600));
    const check = await readLock();
    setEditLock(check);
    return !!check && check.by === currentPlayerId;

  const releaseLock = async () => {

  const openRecordForm = async (record = null) => {
    setError('');

      setError('마감된 날의 오늘 팀끼리 기록은 관리자가 마감을 취소한 뒤에 수정할 수 있어요.');
      return;

    setBusy(true);
    try {
      const ok = await acquireLock();
      if (!ok) { setLockNotice('다른 사람이 입력중입니다.'); return; }
      if (record) {
        setEditingRecordId(record.id);
        setRecGames(record.games);
        setRecWinsA(record.winsA);
        if (record.fromTeams) {
          setRecMode('teams');
          setRecPair([record.sideA.label, record.sideB.label]);
        } else {
          setRecMode('custom');
          const a = {};
          record.sideA.members.forEach((id) => { a[id] = 1; });
          record.sideB.members.forEach((id) => { a[id] = 2; });
          setRecAssign(a);
        }
      } else {
        setEditingRecordId(null);
        setRecGames(1);
        setRecWinsA(null);
        setRecMode(teamLabels.length >= 2 && !dayClosed ? 'teams' : 'custom');
      }
      setConfirmingRecord(false);
      setShowRecordForm(true);
    } catch (e) {
      setError(`입력 화면을 여는 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const closeRecordForm = async () => {
    setShowRecordForm(false);
    setConfirmingRecord(false);
    setEditingRecordId(null);
    try { await releaseLock(); } catch (e) { /* 3분 뒤 자동으로 풀림 */ }
  };

  const askSaveRecord = () => {
    setError('');
    const sides = recSides();
    if (!sides) { setError('맞붙을 두 팀을 골라주세요.'); return; }
    if (!sides.sideA.members.length || !sides.sideB.members.length) { setError('두 팀에 각각 1명 이상 넣어주세요.'); return; }
    if (recWinsA === null) { setError('승패를 입력해주세요.'); return; }
    setConfirmingRecord(true);
  };

  // 기록 추가 또는 수정의 실제 저장 (잠금은 부르는 쪽에서 잡고 풀어요)
  const saveRecordCore = async ({ editingId, sideA, sideB, games, winsA, fromTeams }) => {
    const freshDaily = await loadFreshDaily();
    const existing = editingId ? (freshDaily.records || []).find((r) => r.id === editingId) : null;
    if (editingId && !existing) throw new Error('이 기록은 이미 삭제됐어요');
    if (freshDaily.predictionResult?.finalized && (fromTeams || existing?.fromTeams)) {
      throw new Error('마감된 날에는 오늘 팀끼리 기록을 추가하거나 수정할 수 없어요. 직접 구성으로 입력해주세요');
    }
    const freshPlayers = await loadFreshPlayers();
    const nextPlayers = { ...freshPlayers };
    const nowIso = new Date().toISOString();
    const recordId = existing ? existing.id : uniqueId(`rec-${viewDate}`);
    // 같은 팀원으로 점수만 고치는 경우: 처음 계산했던 예상 승률과 K값을 그대로 써서, 고치거나 되돌려도 Rating이 정확히 맞도록
    let basis = null;
    if (existing && sameMembers(existing.sideA.members, sideA.members) && sameMembers(existing.sideB.members, sideB.members)) {
      const kByPlayer = {};
      Object.values(nextPlayers).forEach((pl) => {
        const h = (pl.history || []).find((x) => x.recordId === recordId && typeof x.k === 'number');
        if (h) kByPlayer[pl.id] = h.k;
      });
      basis = { expectA: existing.expectA, kByPlayer };
    }
    if (existing) revertRecord(nextPlayers, recordId);
    const record = {
      ...(existing || {}),
      id: recordId, date: viewDate, sideA, sideB, games, winsA, winsB: games - winsA, fromTeams,
      createdAt: existing?.createdAt || nowIso,
      enteredBy: existing?.enteredBy || myName,
      ...(existing ? { editedBy: myName, editedAt: nowIso } : {}),
    };
    const { deltas, expectA } = applyRecord(nextPlayers, record, basis);
    record.expectA = expectA;
    await savePlayers(nextPlayers);
    const nextRecords = existing
      ? freshDaily.records.map((r) => (r.id === recordId ? record : r))
      : [...(freshDaily.records || []), record];
    await saveDaily({ ...freshDaily, records: nextRecords });

    const snapshot = (r) => ({ sideA: r.sideA, sideB: r.sideB, games: r.games, winsA: r.winsA, winsB: r.winsB, fromTeams: r.fromTeams });
    const freshLogs = await loadFreshLogs();
    const logEntry = existing
      ? { id: uniqueId(`edit-${viewDate}`), type: 'record-edit', recordId, date: viewDate, timestamp: nowIso, adminName: myName, before: snapshot(existing), after: snapshot(record), undone: false }
      : { id: recordId, type: 'record', recordId, date: viewDate, timestamp: nowIso, adminName: myName, labelA: sideA.label, labelB: sideB.label, games, winsA, winsB: games - winsA, fromTeams, playerDeltas: deltas, undone: false };
    await saveLogs([logEntry, ...freshLogs]);
    return logEntry;
  };

  const handleSaveRecord = async () => {
    setError('');
    const sides = recSides();
    if (!sides || recWinsA === null) return;
    setBusy(true);
    try {
      // 잠금이 내 것인지 확인 (오래 자리를 비워 풀렸으면 다시 잡아봄)
      const lock = await readLock();
      if (!lock || lock.by !== currentPlayerId) {
        const ok = await acquireLock();
        if (!ok) { setError('다른 사람이 입력중입니다. 잠시 후 다시 시도해주세요.'); return; }
      }
      await saveRecordCore({ editingId: editingRecordId, ...sides, games: recGames, winsA: recWinsA });
      await releaseLock();
      setShowRecordForm(false);
      setEditingRecordId(null);
      setConfirmingRecord(false);
      setRecWinsA(null);
      setRecGames(1);
    } catch (e) {
      setError(`결과 저장 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  // 관리자 로그: 수정 전 내용으로 되돌리기
  const handleRevertEdit = async (logId) => {
    setError('');
    const entry = logs.find((l) => l.id === logId);
    if (!entry || entry.undone) return;
    setBusy(true);
    try {
      const ok = await acquireLock();
      if (!ok) { setError('다른 사람이 입력중입니다. 잠시 후 다시 시도해주세요.'); return; }
      try {
        await saveRecordCore({ editingId: entry.recordId, ...entry.before });
        const freshLogs = await loadFreshLogs();
        await saveLogs(freshLogs.map((l) => (l.id === logId ? { ...l, undone: true } : l)));
      } finally {
        await releaseLock();
      }
    } catch (e) {
      setError(`되돌리는 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  // ----- 오늘 경기 마감 + 승부예측 결과 확정 -----
  const handleClosePredictions = async () => {
    setError('');
    setBusy(true);
    try {
      const freshDaily = await loadFreshDaily();
      if (freshDaily.predictionResult?.finalized) return;
      const labels = TEAM_LABELS.filter((l) => freshDaily.teams?.[l]?.length);
      const recs = (freshDaily.records || []).filter((r) => r.fromTeams);
      if (!recs.length) { setError('오늘 팀끼리 기록된 경기가 없어요.'); return; }
      const st = Object.fromEntries(labels.map((l) => [l, 0]));
      recs.forEach((r) => {
        if (r.sideA.label in st) st[r.sideA.label] += r.winsA;
        if (r.sideB.label in st) st[r.sideB.label] += r.winsB;
      });
      const max = Math.max(...labels.map((l) => st[l]));
      const winners = labels.filter((l) => st[l] === max);
      const isVoid = winners.length !== 1; // 1위가 동률이면 예측은 무효
      const predictionId = uniqueId(`pred-${viewDate}`);
      const deltas = [];

      if (!isVoid) {
        const freshPlayers = await loadFreshPlayers();
        const nextPlayers = { ...freshPlayers };
        Object.entries(freshDaily.predictions || {}).forEach(([pid, pick]) => {
          const pl = nextPlayers[pid];
          if (!pl) return;
          const correct = pick === winners[0];
          nextPlayers[pid] = {
            ...pl,
            predictionScore: (pl.predictionScore || 0) + (correct ? 1 : 0),
            history: [...(pl.history || []), { kind: 'prediction', predictionId, date: viewDate, predicted: pick, predictionCorrect: correct }],
          };
          deltas.push({ playerId: pid, winsDelta: 0, lossesDelta: 0, predictionScoreDelta: correct ? 1 : 0, eloDelta: 0 });
        });
        await savePlayers(nextPlayers);
      }

      await saveDaily({
        ...freshDaily,
        predictionResult: { finalized: true, winners, void: isVoid, standings: st, predictionId, timestamp: new Date().toISOString() },
      });
      const freshLogs = await loadFreshLogs();
      await saveLogs([{
        id: predictionId, type: 'prediction', predictionId, date: viewDate, timestamp: new Date().toISOString(),
        adminName: me?.name || currentPlayerId, winners, void: isVoid, playerDeltas: deltas, undone: false,
      }, ...freshLogs]);
      setConfirmingClose(false);
    } catch (e) {
      setError(`마감 처리 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  // ----- 업데이트 로그에서 취소 -----
  const handleUndo = async (logId) => {
    setError('');
    const entry = logs.find((l) => l.id === logId);
    if (!entry || entry.undone) return;
    const type = entry.type || 'legacy';
    setBusy(true);
    try {
      const dayData = await loadFreshDaily(entry.date);
      if (type === 'record') {
        const rec = (dayData.records || []).find((r) => r.id === entry.recordId);
        if (rec?.fromTeams && dayData.predictionResult?.finalized) {
          setError('이 날은 예측 결과가 이미 확정됐어요. 로그에서 "예측 결과 확정"을 먼저 취소한 뒤 다시 시도해주세요.');
          return;
        }
      }

      const freshPlayers = await loadFreshPlayers();
      const nextPlayers = { ...freshPlayers };

      if (type === 'record') {
        // 기록 삭제: 수정된 적이 있어도 지금 내용 그대로 되돌림
        revertRecord(nextPlayers, entry.recordId);
        await savePlayers(nextPlayers);
        const nextDay = { ...dayData, records: (dayData.records || []).filter((r) => r.id !== entry.recordId) };
        if (entry.date === viewDate) await saveDaily(nextDay);
        else await apiSetWithRetry(`daily:${entry.date}`, JSON.stringify(nextDay));
        const freshLogs = await loadFreshLogs();
        await saveLogs(freshLogs.map((l) => (l.recordId === entry.recordId ? { ...l, undone: true, deleted: true } : l)));
        return;
      }

      const keepHistory = (h) => {
        if (type === 'record') return h.recordId !== entry.recordId;
        if (type === 'prediction') return h.predictionId !== entry.predictionId;
        return !(h.date === entry.date && !h.kind); // 예전 방식 기록
      };
      (entry.playerDeltas || []).forEach((d) => {
        const pl = nextPlayers[d.playerId];
        if (!pl) return;
        nextPlayers[d.playerId] = {
          ...pl,
          wins: (pl.wins || 0) - (d.winsDelta || 0),
          losses: (pl.losses || 0) - (d.lossesDelta || 0),
          predictionScore: (pl.predictionScore || 0) - (d.predictionScoreDelta || 0),
          elo: eloOf(pl) - (d.eloDelta || 0),
          history: (pl.history || []).filter(keepHistory),
        };
      });
      await savePlayers(nextPlayers);

      let nextDay = { ...dayData };
      if (type === 'record') nextDay.records = (dayData.records || []).filter((r) => r.id !== entry.recordId);
      else if (type === 'prediction') nextDay.predictionResult = null;
      else nextDay.result = null;
      if (entry.date === viewDate) await saveDaily(nextDay);
      else await apiSetWithRetry(`daily:${entry.date}`, JSON.stringify(nextDay));

      const freshLogs = await loadFreshLogs();
      await saveLogs(freshLogs.map((l) => (l.id === logId ? { ...l, undone: true } : l)));
    } catch (e) {
      setError(`취소 처리 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setBusy(false);
    }
  };

  const handleChangePassword = async () => {
    setError('');
    setPwChangeMsg('');
    if (!curPassword || !newPassword || !newPasswordConfirm) { setError('현재 비밀번호와 새 비밀번호를 모두 입력해주세요.'); return; }

  // 랭킹 3가지를 각각 따로 정렬
  // - 승률 랭킹: 윌슨 점수, 20경기 이상만 순위 (나머지는 '랭킹 진입 전'에 경기 수 많은 순)
  // - 적중률 랭킹: 윌슨 점수
  // - Rating 랭킹: 엘로 점수, 20경기 이상만 순위
  const scoredPlayers = Object.values(players).map((p) => {
    const games = gamesPlayed(p);
    const pred = predictionStats(p);
    const lastElo = [...(p.history || [])].reverse().find((h) => typeof h.eloDelta === 'number');
    return {
      ...p,
      games,
      pred,
      winScore: wilsonScore(p.wins || 0, games),
      predScore: wilsonScore(pred.correct, pred.total),
      skill: eloOf(p),
      lastEloDelta: lastElo ? lastElo.eloDelta : null,
    };
  });
  const qualifies = (p) => p.games >= RANKING_MIN_GAMES;
  const hasGames = (p) => p.games > 0;
  // 순위에 든 사람이 먼저, 그다음 랭킹 진입 전 사람들도 같은 점수 기준으로 그들끼리 순위 (기록 없는 사람은 맨 아래)
  const winRanking = [...scoredPlayers].sort((a, b) =>
    (qualifies(b) - qualifies(a))
    || (hasGames(b) - hasGames(a))
    || (b.winScore - a.winScore) || (b.games - a.games));
  const predRanking = [...scoredPlayers].sort((a, b) => (b.predScore - a.predScore) || (b.pred.total - a.pred.total));
  const skillRanking = [...scoredPlayers].sort((a, b) =>
    (qualifies(b) - qualifies(a))
    || (hasGames(b) - hasGames(a))
    || (b.skill - a.skill) || (b.games - a.games));
  const rankedPlayers = rankMode === 'skill' ? skillRanking : (rankMode === 'prediction' ? predRanking : winRanking);

  // 화면과 이미지에 똑같이 쓰는 랭킹 한 줄씩
  let unrankedCount = 0;
  const rankingRows = rankedPlayers.map((p, idx) => {
    let ranked;
    let detail;
    let scoreLabel;
    const remaining = `랭킹 진입까지 ${RANKING_MIN_GAMES - p.games}경기`;
    if (rankMode === 'skill') {
      ranked = p.games >= RANKING_MIN_GAMES;
      const recent = typeof p.lastEloDelta === 'number' ? ` · 최근 ${p.lastEloDelta >= 0 ? '+' : ''}${Math.round(p.lastEloDelta)}` : '';
      detail = p.games === 0 ? '아직 경기 기록 없음' : `${p.games}경기${recent}${ranked ? '' : ` · ${remaining}`}`;
      scoreLabel = p.games > 0 ? `${Math.round(p.skill)}` : '-';
    } else if (rankMode === 'prediction') {
      ranked = p.pred.total > 0;
      detail = ranked ? `${p.pred.total}번 중 ${p.pred.correct}번 적중 · ${pct(p.pred.correct, p.pred.total)}` : '아직 예측 기록 없음';
      scoreLabel = ranked ? `${Math.round(p.predScore * 100)}점` : '-';
    } else {
      ranked = p.games >= RANKING_MIN_GAMES;
      detail = p.games === 0 ? '아직 경기 기록 없음' : `${p.wins || 0}승 ${p.losses || 0}패 · 승률 ${pct(p.wins || 0, p.games)}${ranked ? '' : ` · ${remaining}`}`;
      scoreLabel = p.games > 0 ? `${Math.round(p.winScore * 100)}점` : '-';
    }
    // 랭킹 진입 전 사람들은 그 사람들끼리의 순위 (기록이 없으면 '-')
    const hasRecord = rankMode === 'prediction' ? p.pred.total > 0 : p.games > 0;
    const groupRank = !ranked && hasRecord ? ++unrankedCount : null;
    return { id: p.id, name: p.name, position: p.position, ranked, rank: ranked ? idx + 1 : null, groupRank, detail, scoreLabel, isTop: idx === 0 && ranked, isMe: p.id === currentPlayerId };
  });
  const rankingNeedsGames = rankMode !== 'prediction';
  const firstUnrankedIdx = rankingRows.findIndex((r) => !r.ranked);

  const isIOSDevice = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const handleMakeRankingImage = async () => {
    setError('');
    setRankImageBusy(true);
    try {
      const d = new Date();
      const dateText = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 기준`;
      const rule = rankMode === 'prediction'
        ? '적중률과 예측 횟수를 함께 본 점수 순'
        : rankMode === 'skill'
          ? `팀 전력을 고려한 Rating 순 · ${RANKING_MIN_GAMES}경기 이상만 순위`
          : `승률과 판수를 함께 본 점수 순 · ${RANKING_MIN_GAMES}경기 이상만 순위`;
      const stamp = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
      const blob = await renderRankingImage({
        clubName: CLUB_NAME,
        title: RANK_TITLES[rankMode],
        lines: [dateText, rule],
        rows: rankingRows,
        unrankedLabel: rankingNeedsGames ? `랭킹 진입 전 (${RANKING_MIN_GAMES}경기 미만)` : '예측 기록 없음',
      });
      if (rankImage) URL.revokeObjectURL(rankImage.url);
      // 파일 이름은 영문으로 (한글 파일 이름은 일부 휴대폰에서 'download'로 바뀌어 저장됨)
      const fileMode = { winrate: 'winrate', prediction: 'prediction', skill: 'rating' }[rankMode];
      setRankImage({ url: URL.createObjectURL(blob), blob, fileName: `ranking-${fileMode}-${stamp.replace(/\./g, '')}.png` });
    } catch (e) {
      setError(`이미지를 만드는 중 문제가 발생했습니다. (${e?.message || '알 수 없는 오류'})`);
    } finally {
      setRankImageBusy(false);
    }
  };

  const handleSaveRankingImage = async () => {
    if (!rankImage) return;
    // 아이폰: 공유 메뉴의 '이미지 저장'으로 사진 앱에 저장 / 그 외: 바로 다운로드
    if (isIOSDevice && navigator.canShare) {
      try {
        const file = new File([rankImage.blob], rankImage.fileName, { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return; // 사용자가 공유 창을 닫음
      }
    }
    const a = document.createElement('a');
    a.href = rankImage.url;
    a.download = rankImage.fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  const closeRankImage = () => {
    if (rankImage) URL.revokeObjectURL(rankImage.url);
    setRankImage(null);
  };

  const myGames = gamesPlayed(me);
  const myPred = predictionStats(me);
  const mySkill = Math.round(eloOf(me));
  const myWinRankIdx = winRanking.findIndex((p) => p.id === currentPlayerId);
  const myPredRankIdx = predRanking.findIndex((p) => p.id === currentPlayerId);
  const mySkillRankIdx = skillRanking.findIndex((p) => p.id === currentPlayerId);
  const entryLabel = myGames > 0 ? `랭킹 진입까지 ${RANKING_MIN_GAMES - myGames}경기` : '아직 경기 기록 없음';
  const myWinRankLabel = myGames >= RANKING_MIN_GAMES && myWinRankIdx >= 0 ? `승률 랭킹 ${myWinRankIdx + 1}위` : entryLabel;
  const myPredRankLabel = myPred.total > 0 && myPredRankIdx >= 0 ? `적중률 랭킹 ${myPredRankIdx + 1}위` : '아직 예측 기록 없음';
  const mySkillRankLabel = myGames >= RANKING_MIN_GAMES && mySkillRankIdx >= 0 ? `Rating 랭킹 ${mySkillRankIdx + 1}위` : entryLabel;

  if (!apiConfigured) {
    return (
      <div className="font-body min-h-screen bg-slate-900 flex items-center justify-center px-6">
        <div className="max-w-sm text-center">
          <p className="text-white font-bold text-lg mb-2">⚙️ 설정이 필요해요</p>
          <p className="text-slate-400 text-sm leading-relaxed">
            config.js 안의 <code className="bg-slate-800 text-orange-400 px-1.5 py-0.5 rounded text-xs">API_URL</code> 값을
            배포한 Apps Script 웹 앱 URL로 바꿔주세요.
          </p>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div className="min-h-screen bg-slate-50 flex items-center justify-center">
        <div className="flex flex-col items-center gap-3 text-slate-400">
          <Spinner size={28} dark />
          <span className="text-sm font-medium">불러오는 중...</span>
        </div>
      </div>
    );
  }

  if (!currentPlayerId) {
    return (
      <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center px-6 py-10">
        <div className="w-full max-w-sm">
          <div className="text-center mb-8">
            <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-600 mb-4 text-3xl">🏀</div>
            <h1 className="font-display text-3xl text-white tracking-wide">{CLUB_NAME}</h1>
            <p className="text-slate-400 text-sm mt-1 font-medium">출석 · 팀편성 · 승부예측</p>
          </div>

          <div className="bg-white rounded-2xl p-5 shadow-xl">
            <div className="flex rounded-lg bg-slate-100 p-1 mb-5">
              <button
                onClick={() => { setAuthMode('login'); setError(''); }}
                className={`flex-1 py-2 rounded-md text-sm font-bold transition ${authMode === 'login' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
              >
                로그인
              </button>
              <button
                onClick={() => { setAuthMode('register'); setError(''); }}
                className={`flex-1 py-2 rounded-md text-sm font-bold transition ${authMode === 'register' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
              >
                회원가입
              </button>
            </div>

            {authMode === 'login' ? (
              <div className="space-y-3">
                <input
                  value={loginEmpId} onChange={(e) => setLoginEmpId(e.target.value)}
                  placeholder="사번" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                <input
                  value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} type="password"
                  placeholder="비밀번호" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                {error && <p className="text-red-500 text-xs font-medium">{error}</p>}
                <button
                  onClick={handleLogin} disabled={busy}
                  className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-bold flex items-center justify-center gap-2 disabled:opacity-60"

                  {busy ? <Spinner size={16} /> : '로그인하기'}
                </button>
              </div>
            ) : (
              <div className="space-y-3">
                <input value={regName} onChange={(e) => setRegName(e.target.value)} placeholder="이름" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regEmpId} onChange={(e) => setRegEmpId(e.target.value)} placeholder="사번" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regHeight} onChange={(e) => setRegHeight(e.target.value.replace(/[^0-9]/g, ''))} inputMode="numeric" placeholder="키 (cm, 예: 178)" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <div className="grid grid-cols-5 gap-1.5">
                  {POSITIONS.map((pos) => (
                    <button
                      key={pos} onClick={() => setRegPosition(pos)}
                      className={`py-2 rounded-lg border flex flex-col items-center leading-tight ${regPosition === pos ? 'bg-orange-600 text-white border-orange-600' : 'border-slate-200 text-slate-500'}`}
                    >
                      <span className="text-sm font-black">{POSITION_ABBR[pos]}</span>
                      <span className="text-xs font-medium">{POSITION_SHORT[pos]}</span>
                    </button>
                  ))}
                </div>
                <input value={regPassword} onChange={(e) => setRegPassword(e.target.value)} type="password" placeholder="비밀번호 (4자 이상)" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                <input value={regPasswordConfirm} onChange={(e) => setRegPasswordConfirm(e.target.value)} type="password" placeholder="비밀번호 확인" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
                {error && <p className="text-red-500 text-xs font-medium">{error}</p>}
                <button onClick={handleRegister} disabled={busy} className="w-full bg-orange-600 text-white rounded-lg py-2.5 text-sm font-bold flex items-center justify-center gap-2 disabled:opacity-60">
                  {busy ? <Spinner size={16} /> : '가입하기'}
                </button>
              </div>
            )}
          </div>
          <p className="text-center text-slate-500 text-xs mt-5 leading-relaxed">
            가장 먼저 가입하는 사람이 자동으로 관리자가 돼요.<br />비밀번호는 팀 내부용으로 간단히 보호되니 다른 곳과 같은 비밀번호는 피해주세요.
          </p>
          {!isStandaloneApp() && (
            <button onClick={openInstallPrompt} className="w-full mt-4 py-2 text-center text-orange-400 text-sm font-bold">
              📲 홈 화면에 앱으로 설치하기
            </button>
          )}
        </div>
      </div>
    );
  }

  if (!me) {
    return (
      <div className="min-h-screen bg-slate-50 flex items-center justify-center">
        <Spinner size={24} dark />
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-200">
      <div className="max-w-md mx-auto min-h-screen bg-slate-50 pb-24 relative shadow-xl">

        <div className="bg-slate-900 px-4 pt-5 pb-4 sticky top-0 z-10">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-orange-600 flex items-center justify-center text-base">🏀</div>
              <h1 className="font-display text-lg text-white tracking-wide">{CLUB_NAME}</h1>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={manualRefresh} className="text-slate-400 text-lg" aria-label="새로고침">🔄</button>
              <button onClick={handleLogout} className="text-slate-400 text-lg" aria-label="로그아웃">🚪</button>
            </div>
          </div>
          <button onClick={() => setTab('mypage')} className="flex items-center gap-2 mt-4">
            <Avatar name={me.name} size="sm" tone="bg-orange-600" />
            <div className="text-left">
              <p className="text-white text-sm font-bold leading-tight">
                {me.name}{me.isAdmin && <span className="ml-1 text-xs text-orange-400 font-bold">관리자</span>}
              </p>
              <p className="text-slate-400 text-xs font-medium">{me.position}</p>
            </div>
          </button>
        </div>

        <div className="px-4 pt-4">
          {error && (
            <div className="bg-red-50 text-red-600 text-xs font-medium px-3 py-2 rounded-lg mb-3">{error}</div>
          )}

          {tab === 'today' && (
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <button
                  onClick={() => goToDate(shiftDate(viewDate, -1))} disabled={busy}
                  className="w-9 h-9 rounded-full bg-white shadow-sm text-slate-600 text-lg font-bold"
                  aria-label="이전 날"
                >
                  ‹
                </button>
                <div className="text-center">
                  <p className="text-sm font-bold text-slate-800">{formatDateLabel(viewDate)}</p>
                  <p className="text-xs text-slate-400">{isToday ? '오늘의 경기' : '지난 경기 · 결과 사후입력'}</p>
                </div>
                <button
                  onClick={() => goToDate(shiftDate(viewDate, 1))} disabled={busy || isToday}
                  className="w-9 h-9 rounded-full bg-white shadow-sm text-slate-600 text-lg font-bold disabled:opacity-30"
                  aria-label="다음 날"
                >
                  ›
                </button>
              </div>
              <div className="flex items-center justify-center gap-3 -mt-2">
                <input
                  type="date" value={viewDate} max={dateKey}
                  onChange={(e) => goToDate(e.target.value)}
                  className="text-xs text-slate-500 bg-transparent focus:outline-none"
                />
                {!isToday && (
                  <button onClick={() => goToDate(dateKey)} className="text-xs font-bold text-orange-600">오늘로 돌아가기</button>
                )}
              </div>

              {isToday && !validHeight(me.height) && (
                <button onClick={() => setTab('mypage')} className="w-full bg-orange-50 text-orange-700 rounded-xl px-4 py-3 text-xs font-bold text-left">
                  키를 입력하면 팀 배정이 더 정확해져요. 마이페이지에서 입력하기
                </button>
              )}

              {/* 참가신청 */}
              <div className="bg-white rounded-2xl p-4 shadow-sm">
                <div className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2 text-slate-800 font-bold text-sm flex-wrap">
                    <span>👥 참가신청 {attendeePlayers.length}명</span>
                    {isToday && more > 0 && (
                      <span className="text-xs font-black text-white bg-orange-600 rounded-full px-2 py-0.5 animate-pulse">{more} more!</span>
                    )}
                    {isToday && more === 0 && TEAM_COUNT_BY_SIZE[attendeePlayers.length] && (
                      <span className="text-xs font-bold text-emerald-700 bg-emerald-50 rounded-full px-2 py-0.5">{TEAM_COUNT_BY_SIZE[attendeePlayers.length]}팀 경기 가능</span>
                    )}
                  </div>
                  {signupOpen ? (
                    <button
                      onClick={handleToggleAttendance} disabled={busy}
                      className={`text-xs font-bold px-4 py-2 rounded-full shrink-0 ${iAttend ? 'bg-slate-100 text-slate-500' : 'bg-orange-600 text-white'}`}
                    >
                      {iAttend ? '✕ 신청 취소' : '✓ 참가신청'}
                    </button>
                  ) : (
                    <span className="text-xs font-bold text-slate-400 shrink-0">{isToday && nowMin < SIGNUP_OPEN_MIN ? '오전 5시 오픈' : '신청 마감'}</span>
                  )}
                </div>
                <p className="text-xs text-slate-400 mt-1 mb-3">
                  참가신청 오전 5:00 ~ 11:45{iAttend ? ' · 나는 신청 완료' : ''}
                </p>
                {attendeePlayers.length > 0 ? (
                  <div className="flex flex-wrap gap-2">
                    {attendeePlayers.map((p) => (
                      <div key={p.id} className="flex items-center gap-1 bg-slate-50 rounded-full pl-1 pr-2.5 py-1">
                        <Avatar name={p.name} size="sm" />
                        <span className="text-xs font-semibold text-slate-700">{p.name}</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p className="text-slate-400 text-xs">아직 신청한 사람이 없어요.</p>
                )}
              </div>

              {/* 팀 나누기: 누구나. 이미 나눈 팀은 참가인원이 바뀌었을 때만 다시 나눌 수 있음 */}
              {isToday && !dayClosed && (
                <div className="bg-white rounded-2xl p-4 shadow-sm">
                  <div className="flex items-center justify-between mb-3">
                    <p className="text-slate-800 font-bold text-sm">팀 나누기</p>
                    <p className="text-xs text-slate-400">신청 {attendeePlayers.length}명 기준 {autoTeamCount}팀</p>
                  </div>
                  {attendanceChanged && !cachedForCurrent && teamRecords.length === 0 && (
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      {[2, 3, 4].map((c) => (
                        <button
                          key={c}
                          onClick={() => setTeamCountChoice(c)}
                          className={`py-2 rounded-lg text-sm font-bold border ${teamCount === c ? 'bg-orange-600 text-white border-orange-600' : 'border-slate-200 text-slate-500'}`}
                        >
                          {c}팀{c === autoTeamCount ? ' (자동)' : ''}
                        </button>
                      ))}
                    </div>
                  )}
                  <button
                    onClick={handleGenerateTeams}
                    disabled={busy || !canGenerateTeams}
                    className="w-full bg-slate-900 text-white rounded-xl py-3 text-sm font-bold disabled:opacity-40"
                  >
                    {daily.teams && attendanceChanged && cachedForCurrent
                      ? '↺ 이 인원의 기존 팀으로 되돌리기'
                      : daily.teams ? '↻ 바뀐 인원으로 팀 다시 나누기' : '👥 팀 나누기'}
                  </button>
                  <p className="text-xs text-slate-400 mt-2">
                    {teamRecords.length > 0
                      ? '이 팀으로 기록된 경기가 있어서 다시 나눌 수 없어요.'
                      : daily.teams && !attendanceChanged
                        ? '이미 팀이 나뉘었어요. 참가인원이 바뀌면 다시 나눌 수 있어요.'
                        : attendanceChanged && cachedForCurrent
                          ? '지금과 같은 인원으로 나눈 팀이 이미 있어요. 같은 인원이면 항상 그 팀으로 정해져요.'
                          : attendeePlayers.length < teamCount * 2
                          ? `${teamCount}팀으로 나누려면 최소 ${teamCount * 2}명이 필요해요.`
                          : daily.teams
                            ? '참가인원이 바뀌었어요. 다시 나누면 승부예측은 초기화돼요.'

                  </p>
                </div>
              )}

              {/* 오늘의 팀 */}
              {teamLabels.length > 0 && (
                <div className="bg-white rounded-2xl overflow-hidden shadow-sm">
                  <div className="bg-slate-900 py-3 px-2 flex items-center justify-center gap-2 flex-wrap">
                    {teamLabels.map((l, i) => (
                      <React.Fragment key={l}>
                        {i > 0 && <span className="font-display text-sm text-slate-500">VS</span>}
                        <span className={`font-display ${teamLabels.length > 2 ? 'text-lg' : 'text-xl'} ${TEAM_STYLE[l].light}`}>
                          {teamLabels.length > 2 ? l : `TEAM ${l}`}
                        </span>
                      </React.Fragment>
                    ))}
                  </div>
                  {daily.teamsBy && (
                    <div className="px-4 pt-2 flex items-center justify-between gap-2">
                      <p className="text-xs text-slate-400">팀 나눔 {daily.teamsBy}{daily.teamsAt ? ` · ${formatDateTime(daily.teamsAt)}` : ''}</p>
                      {(daily.teamHistory || []).length > 1 && (
                        <button onClick={() => setShowTeamHistory((v) => !v)} className="text-xs text-slate-400 underline shrink-0">
                          나눔 기록 {daily.teamHistory.length}회
                        </button>
                      )}
                    </div>
                  )}
                  {showTeamHistory && (daily.teamHistory || []).length > 1 && (
                    <div className="mx-4 mt-2 bg-slate-50 rounded-lg px-3 py-2 space-y-1">
                      {[...daily.teamHistory].reverse().map((h, i) => (
                        <p key={i} className="text-xs text-slate-500">
                          {formatDateTime(h.at)} · {h.auto ? '자동' : h.by} · {h.size}명 {h.teamCount}팀
                          {h.added?.length ? ` · +${h.added.join(', ')}` : ''}
                          {h.removed?.length ? ` · -${h.removed.join(', ')}` : ''}
                          {h.restored ? ' · 같은 인원의 기존 팀으로 되돌림' : ''}
                        </p>
                      ))}
                    </div>
                  )}
                  {teamLabels.map((l) => {

                                  {recShowAll ? '참석자만 보기' : '전체 회원 보기'}

                              </div>
                            </div>

                                onClick={() => { setRecWinsA(w); setConfirmingRecord(false); }}
                                className={`py-2.5 rounded-xl text-sm font-bold ${recWinsA === w ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}

                                {name} 승

                              <span className="text-sm font-bold text-slate-700">{nameB}</span>
                            </div>
                          </div>

                            </div>
                          </div>

                      </div>

                          <button onClick={handleClosePredictions} disabled={busy} className="py-2 rounded-lg text-sm font-bold text-white bg-slate-900">마감</button>

                  <button
                    key={mode}
                    onClick={() => setRankMode(mode)}
                    className={`flex-1 py-2 rounded-md text-xs font-bold ${rankMode === mode ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}

                    {label}
                  </button>

          </button>

            <button onClick={() => setTab('admin')} className={`flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-xl ${tab === 'admin' ? 'text-orange-600' : 'text-slate-400'}`}>

            </button>
          )}
        </div>
      </div>
    </div>
  );

// ============================================================
// 앱 설치 팝업 ("설치하시겠습니까?")
// ============================================================
const INSTALL_DISMISS_KEY = 'installPromptDismissedAt';
const INSTALL_DISMISS_MS = 24 * 60 * 60 * 1000; // '나중에'를 누르면 하루 동안 자동으로 안 띄움

function getInstallEnv() {
  const ua = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);
  const isKakao = /KAKAOTALK/i.test(ua);
  const isInApp = isKakao
    || /NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua)
    || (isAndroid && /; wv\)/i.test(ua));
  return { isIOS, isAndroid, isKakao, isInApp };
}

function recentlyDismissed() {
  try {
    const t = Number(localStorage.getItem(INSTALL_DISMISS_KEY) || 0);
    return Date.now() - t < INSTALL_DISMISS_MS;
  } catch (e) {
    return false;
  }
}

function openInExternalBrowser(env) {
  const here = window.location.href;
  if (env.isKakao) {
    window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here);
  } else if (env.isAndroid) {
    const u = new URL(here);
    window.location.href = `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=https;package=com.android.chrome;end`;
  }
}

function StepList({ steps }) {
  return (
    <ol className="space-y-2 text-left">
      {steps.map((s, i) => (
        <li key={i} className="flex gap-3 items-start bg-slate-50 rounded-xl px-3 py-2.5">
          <span className="w-5 h-5 rounded-full bg-orange-600 text-white text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">{i + 1}</span>
          <span className="text-sm text-slate-700 leading-relaxed">{s}</span>
        </li>
      ))}
    </ol>
  );
}

function InstallPrompt() {
  const [env] = useState(() => getInstallEnv());
  const [open, setOpen] = useState(false);
  const [mode, setMode] = useState('ask'); // ask: 물어보기 / guide: 설치 방법 안내 / installed: 설치 완료
  const [oneTapReady, setOneTapReady] = useState(() => !!window.__deferredInstallPrompt);
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (isStandaloneApp()) return undefined; // 이미 설치된 앱으로 실행 중이면 아무것도 안 띄움

    const onAvailable = () => {
      setOneTapReady(true);
      if (!recentlyDismissed()) setOpen(true);
    };
    const onInstalled = () => { setMode('installed'); setOpen(true); };
    const onManualOpen = () => { setMode('ask'); setOpen(true); };

    window.addEventListener('install-available', onAvailable);
    window.addEventListener('appinstalled', onInstalled);
    window.addEventListener('open-install-prompt', onManualOpen);

    // 카카오톡 안의 브라우저에서는 설치가 안 되니 외부 브라우저로 자동 전환
    if (env.isKakao) openInExternalBrowser(env);

    let timer;
    if (!recentlyDismissed() && (env.isIOS || env.isAndroid || env.isInApp || window.__deferredInstallPrompt)) {
      timer = setTimeout(() => setOpen(true), 700);
    }

    return () => {
      clearTimeout(timer);
      window.removeEventListener('install-available', onAvailable);
      window.removeEventListener('appinstalled', onInstalled);
      window.removeEventListener('open-install-prompt', onManualOpen);
    };
  }, []);

  const dismiss = () => {
    try { localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now())); } catch (e) { /* 무시 */ }
    setOpen(false);
  };

  const handleYes = async () => {
    const dp = window.__deferredInstallPrompt;
    if (!dp) { setMode('guide'); return; }
    try {
      dp.prompt(); // 브라우저 자체 설치 확인창이 뜸
      const choice = await dp.userChoice;
      window.__deferredInstallPrompt = null;
      setOneTapReady(false);
      if (choice && choice.outcome === 'accepted') setMode('installed');
      else setOpen(false);
    } catch (e) {
      setMode('guide');
    }
  };

  const copyLink = async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      setCopied(true);
    } catch (e) {
      setCopied(false);
    }
  };

  if (!open) return null;

  const primaryBtn = 'w-full bg-orange-600 text-white rounded-xl py-3 text-sm font-bold';
  const secondaryBtn = 'w-full bg-slate-100 text-slate-500 rounded-xl py-3 text-sm font-bold';

  let title;
  let body;
  let actions;

  if (mode === 'installed') {
    title = '설치 완료! 🎉';
    body = (
      <p className="text-sm text-slate-500 leading-relaxed">
        홈 화면(또는 앱 목록)에 생긴 🏀 아이콘으로 열어주세요.<br />다음부터는 링크 없이 아이콘만 누르면 돼요.
      </p>
    );
    actions = <button onClick={() => setOpen(false)} className={primaryBtn}>확인</button>;
  } else if (env.isInApp) {
    title = '브라우저에서 열어주세요';
    if (env.isKakao || env.isAndroid) {
      body = (
        <p className="text-sm text-slate-500 leading-relaxed">
          {env.isKakao ? '카카오톡' : '지금 앱'} 안에서는 설치가 안 돼요.<br />아래 버튼을 눌러 {env.isKakao ? '브라우저' : 'Chrome'}로 열어주세요.
        </p>
      );
      actions = (
        <div className="space-y-2">
          <button onClick={() => openInExternalBrowser(env)} className={primaryBtn}>
            {env.isKakao ? '브라우저로 열기' : 'Chrome으로 열기'}
          </button>
          <button onClick={dismiss} className={secondaryBtn}>닫기</button>
        </div>
      );
    } else {
      body = (
        <div className="space-y-3">
          <p className="text-sm text-slate-500 leading-relaxed">지금 앱 안에서는 설치가 안 돼요.</p>
          <StepList steps={['화면의 ••• 또는 공유 메뉴를 누르세요', "'Safari로 열기'를 누르세요", '열린 Safari에서 설치를 진행하세요']} />
          {copied && <p className="text-emerald-600 text-xs font-medium">링크를 복사했어요. Safari 주소창에 붙여넣어도 돼요.</p>}
        </div>
      );
      actions = (
        <div className="space-y-2">
          <button onClick={copyLink} className={primaryBtn}>링크 복사하기</button>
          <button onClick={dismiss} className={secondaryBtn}>닫기</button>
        </div>
      );
    }
  } else if (mode === 'ask') {
    title = `${CLUB_NAME} 앱을 설치하시겠습니까?`;
    body = (
      <p className="text-sm text-slate-500 leading-relaxed">
        홈 화면에 아이콘이 생기고, 주소창 없이 앱처럼 열려요.
      </p>
    );
    actions = (
      <div className="grid grid-cols-2 gap-2">
        <button onClick={dismiss} className={secondaryBtn}>나중에</button>
        <button onClick={handleYes} className={primaryBtn}>예, 설치할게요</button>
      </div>
    );
  } else {
    // guide: 버튼 한 번으로 설치할 수 없는 경우 직접 설치하는 방법 안내
    let steps;
    if (env.isIOS) {
      title = '두 번만 더 누르면 설치돼요';
      steps = [
        '화면 아래 공유 버튼(□↑)을 누르세요. 안 보이면 ••• 버튼 → 공유',
        "목록에서 '홈 화면에 추가'를 누르세요",
        "오른쪽 위 '추가'를 누르면 끝!",
      ];
    } else if (env.isAndroid) {
      title = '메뉴에서 설치해주세요';
      steps = [
        '오른쪽 위 ⋮ 메뉴를 누르세요 (삼성 인터넷은 아래 ≡ 메뉴)',
        "'앱 설치' 또는 '홈 화면에 추가'를 누르세요",
        "'설치'를 누르면 끝!",
      ];
    } else {
      title = '브라우저 메뉴에서 설치해주세요';
      steps = [
        '주소창 오른쪽의 설치 아이콘을 누르거나, 브라우저 메뉴(⋮)를 여세요',
        "'앱 설치' 또는 '홈 화면에 추가'를 누르세요",
      ];
    }
    body = (
      <div>
        <StepList steps={steps} />
        {env.isIOS && <div className="text-2xl mt-3 animate-bounce" aria-hidden="true">👇</div>}
      </div>
    );
    actions = (
      <div className="space-y-2">
        {oneTapReady && !env.isIOS && (
          <button onClick={handleYes} className={primaryBtn}>바로 설치하기</button>
        )}
        <button onClick={dismiss} className={secondaryBtn}>닫기</button>
      </div>
    );
  }

  return (
    <div
      className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 px-4"
      style={{ paddingBottom: 'calc(1rem + env(safe-area-inset-bottom))' }}
      onClick={() => (mode === 'installed' ? setOpen(false) : dismiss())}
    >
      <div
        className="w-full max-w-sm bg-white rounded-3xl p-5 shadow-2xl text-center"
        onClick={(e) => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
      >
        <img src="icon-192.png" alt="" className="w-16 h-16 rounded-2xl mx-auto mb-3 shadow" />
        <p className="text-slate-900 font-bold text-base mb-2">{title}</p>
        <div className="mb-4">{body}</div>
        {actions}
      </div>
    </div>
  );
}

function Root() {
  return (
    <React.Fragment>
      <BasketballClubApp />
      <InstallPrompt />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
