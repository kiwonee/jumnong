                          <button onClick={() => setConfirmingClose(false)} className="py-2 rounded-lg text-sm font-bold text-slate-500 bg-white">취소</button>
                          <button onClick={handleClosePredictions} disabled={busy} className="py-2 rounded-lg text-sm font-bold text-white bg-slate-900">마감</button>
                        </div>
                      </div>
                    )
                  )}
                  {teamRecords.length > 0 && !daily.predictionResult?.finalized && (
                    <p className="text-xs text-slate-400 mt-2 text-center">관리자가 마감하지 않으면 다음 날 자동으로 마감돼요.</p>
                  )}
                </div>
              )}
            </div>
          )}

          {tab === 'ranking' && (
            <div className="space-y-3">
              {pastSeasons.length > 0 && (
                <div className="flex gap-2 overflow-x-auto pb-1">
                  <button
                    onClick={() => openSeasonView(null)}
                    className={`shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border ${!viewingPast ? 'bg-slate-900 text-white border-slate-900' : 'border-slate-200 text-slate-500 bg-white'}`}
                  >
                    시즌 {currentSeason.number} (이번 시즌)
                  </button>
                  {pastSeasons.map((ps) => (

            <div className="w-full max-w-sm bg-white rounded-3xl p-5 shadow-2xl" onClick={(e) => e.stopPropagation()}>
              <p className="text-slate-900 font-bold text-base mb-2">초대 링크</p>
              <p className="text-xs text-slate-500 mb-2">자동 복사가 안 되는 환경이에요. 아래 글을 길게 눌러 전체 선택 후 복사해주세요.</p>
              <textarea
                readOnly value={inviteFallback} onFocus={(e) => e.target.select()}
                className="w-full h-28 border border-slate-200 rounded-lg p-2 text-xs text-slate-700 resize-none focus:outline-none"
              />
              <button onClick={() => setInviteFallback('')} className="w-full mt-3 bg-slate-100 text-slate-600 rounded-xl py-3 text-sm font-bold">닫기</button>
            </div>
          </div>
        )}

        {rankImage && (
          <div className="fixed inset-0 z-50 bg-black/70 flex flex-col" onClick={closeRankImage}>
            <div className="flex-1 overflow-y-auto p-4" style={{ paddingTop: 'calc(1rem + env(safe-area-inset-top))' }}>
              <img
                src={rankImage.url} alt="랭킹 이미지"
                className="w-full max-w-md mx-auto rounded-xl shadow-2xl"
                onClick={(e) => e.stopPropagation()}
              />
            </div>
            <div
              className="bg-white w-full max-w-md mx-auto rounded-t-2xl p-4 space-y-2"
              style={{ paddingBottom: 'calc(1rem + env(safe-area-inset-bottom))' }}
              onClick={(e) => e.stopPropagation()}
            >
              <p className="text-xs text-slate-400 text-center">저장이 안 되면 위 이미지를 길게 눌러서 저장하세요.</p>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={closeRankImage} className="py-3 rounded-xl text-sm font-bold text-slate-500 bg-slate-100">닫기</button>
                <button onClick={handleSaveRankingImage} className="py-3 rounded-xl text-sm font-bold text-white bg-orange-600">
                  {isIOSDevice ? '사진에 저장' : '이미지 저장'}
                </button>
              </div>
            </div>
          </div>
        )}

        <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-100 flex px-2 pt-2" style={{ paddingBottom: 'calc(0.5rem + env(safe-area-inset-bottom))' }}>
          <button onClick={() => setTab('today')} className={`flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-xl ${tab === 'today' ? 'text-orange-600' : 'text-slate-400'}`}>
            <span className="text-lg leading-none">🏀</span><span className="text-xs font-bold">오늘</span>
          </button>
          <button onClick={() => setTab('ranking')} className={`flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-xl ${tab === 'ranking' ? 'text-orange-600' : 'text-slate-400'}`}>
            <span className="text-lg leading-none">📊</span><span className="text-xs font-bold">랭킹</span>
          </button>
          <button onClick={() => setTab('mypage')} className={`flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-xl ${tab === 'mypage' ? 'text-orange-600' : 'text-slate-400'}`}>
            <span className="text-lg leading-none">👤</span><span className="text-xs font-bold">마이</span>
          </button>
          {can(me, 'closeDay') && (
            <button onClick={() => setTab('admin')} className={`flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-xl ${tab === 'admin' ? 'text-orange-600' : 'text-slate-400'}`}>
              <span className="text-lg leading-none">🛡️</span><span className="text-xs font-bold">관리</span>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// 앱 설치 팝업 ("설치하시겠습니까?")
// ============================================================
const INSTALL_DISMISS_KEY = 'installPromptDismissedAt';
const INSTALL_DISMISS_MS = 24 * 60 * 60 * 1000; // '나중에'를 누르면 하루 동안 자동으로 안 띄움

function getInstallEnv() {
  const ua = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);
  const isKakao = /KAKAOTALK/i.test(ua);
  const isInApp = isKakao
    || /NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua)
    || (isAndroid && /; wv\)/i.test(ua));
  return { isIOS, isAndroid, isKakao, isInApp };
}

function recentlyDismissed() {
  try {
    const t = Number(localStorage.getItem(INSTALL_DISMISS_KEY) || 0);
    return Date.now() - t < INSTALL_DISMISS_MS;
  } catch (e) {
    return false;
  }
}

function openInExternalBrowser(env) {
  const here = window.location.href;
  if (env.isKakao) {
    window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here);
  } else if (env.isAndroid) {
    const u = new URL(here);
    window.location.href = `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=https;package=com.android.chrome;end`;
  }
}

function StepList({ steps }) {
  return (
    <ol className="space-y-2 text-left">
      {steps.map((s, i) => (
        <li key={i} className="flex gap-3 items-start bg-slate-50 rounded-xl px-3 py-2.5">
          <span className="w-5 h-5 rounded-full bg-orange-600 text-white text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">{i + 1}</span>
          <span className="text-sm text-slate-700 leading-relaxed">{s}</span>
        </li>
      ))}
    </ol>
  );
}

function InstallPrompt() {
  const [env] = useState(() => getInstallEnv());
  const [open, setOpen] = useState(false);
  const [mode, setMode] = useState('ask'); // ask: 물어보기 / guide: 설치 방법 안내 / installed: 설치 완료
  const [oneTapReady, setOneTapReady] = useState(() => !!window.__deferredInstallPrompt);
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (isStandaloneApp()) return undefined; // 이미 설치된 앱으로 실행 중이면 아무것도 안 띄움

    const onAvailable = () => {
      setOneTapReady(true);
      if (!recentlyDismissed()) setOpen(true);
    };
    const onInstalled = () => { setMode('installed'); setOpen(true); };
    const onManualOpen = () => { setMode('ask'); setOpen(true); };

    window.addEventListener('install-available', onAvailable);
    window.addEventListener('appinstalled', onInstalled);
    window.addEventListener('open-install-prompt', onManualOpen);

    // 카카오톡 안의 브라우저에서는 설치가 안 되니 외부 브라우저로 자동 전환
    if (env.isKakao) openInExternalBrowser(env);

    let timer;
    if (!recentlyDismissed() && (env.isIOS || env.isAndroid || env.isInApp || window.__deferredInstallPrompt)) {
      timer = setTimeout(() => setOpen(true), 700);
    }

    return () => {
      clearTimeout(timer);
      window.removeEventListener('install-available', onAvailable);
      window.removeEventListener('appinstalled', onInstalled);
      window.removeEventListener('open-install-prompt', onManualOpen);
    };
  }, []);

  const dismiss = () => {
    try { localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now())); } catch (e) { /* 무시 */ }
    setOpen(false);
  };

  const handleYes = async () => {
    const dp = window.__deferredInstallPrompt;
    if (!dp) { setMode('guide'); return; }
    try {
      dp.prompt(); // 브라우저 자체 설치 확인창이 뜸
      const choice = await dp.userChoice;
      window.__deferredInstallPrompt = null;
      setOneTapReady(false);
      if (choice && choice.outcome === 'accepted') setMode('installed');
      else setOpen(false);
    } catch (e) {
      setMode('guide');
    }
  };

  const copyLink = async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      setCopied(true);
    } catch (e) {
      setCopied(false);
    }
  };

  if (!open) return null;

  const primaryBtn = 'w-full bg-orange-600 text-white rounded-xl py-3 text-sm font-bold';
  const secondaryBtn = 'w-full bg-slate-100 text-slate-500 rounded-xl py-3 text-sm font-bold';

  let title;
  let body;
  let actions;

  if (mode === 'installed') {
    title = '설치 완료! 🎉';
    body = (
      <p className="text-sm text-slate-500 leading-relaxed">
        홈 화면(또는 앱 목록)에 생긴 🏀 아이콘으로 열어주세요.<br />다음부터는 링크 없이 아이콘만 누르면 돼요.
      </p>
    );
    actions = <button onClick={() => setOpen(false)} className={primaryBtn}>확인</button>;
  } else if (env.isInApp) {
    title = '브라우저에서 열어주세요';
    if (env.isKakao || env.isAndroid) {
      body = (
        <p className="text-sm text-slate-500 leading-relaxed">
          {env.isKakao ? '카카오톡' : '지금 앱'} 안에서는 설치가 안 돼요.<br />아래 버튼을 눌러 {env.isKakao ? '브라우저' : 'Chrome'}로 열어주세요.
        </p>
      );
      actions = (
        <div className="space-y-2">
          <button onClick={() => openInExternalBrowser(env)} className={primaryBtn}>
            {env.isKakao ? '브라우저로 열기' : 'Chrome으로 열기'}
          </button>
          <button onClick={dismiss} className={secondaryBtn}>닫기</button>
        </div>
      );
    } else {
      body = (
        <div className="space-y-3">
          <p className="text-sm text-slate-500 leading-relaxed">지금 앱 안에서는 설치가 안 돼요.</p>
          <StepList steps={['화면의 ••• 또는 공유 메뉴를 누르세요', "'Safari로 열기'를 누르세요", '열린 Safari에서 설치를 진행하세요']} />
          {copied && <p className="text-emerald-600 text-xs font-medium">링크를 복사했어요. Safari 주소창에 붙여넣어도 돼요.</p>}
        </div>
      );
      actions = (
        <div className="space-y-2">
          <button onClick={copyLink} className={primaryBtn}>링크 복사하기</button>
          <button onClick={dismiss} className={secondaryBtn}>닫기</button>
        </div>
      );
    }
  } else if (mode === 'ask') {
    title = `${CLUB_NAME} 앱을 설치하시겠습니까?`;
    body = (
      <p className="text-sm text-slate-500 leading-relaxed">
        홈 화면에 아이콘이 생기고, 주소창 없이 앱처럼 열려요.
      </p>
    );
    actions = (
      <div className="grid grid-cols-2 gap-2">
        <button onClick={dismiss} className={secondaryBtn}>나중에</button>
        <button onClick={handleYes} className={primaryBtn}>예, 설치할게요</button>
      </div>
    );
  } else {
    // guide: 버튼 한 번으로 설치할 수 없는 경우 직접 설치하는 방법 안내
    let steps;
    if (env.isIOS) {
      title = '두 번만 더 누르면 설치돼요';
      steps = [
        '화면 아래 공유 버튼(□↑)을 누르세요. 안 보이면 ••• 버튼 → 공유',
        "목록에서 '홈 화면에 추가'를 누르세요",
        "오른쪽 위 '추가'를 누르면 끝!",
      ];
    } else if (env.isAndroid) {
      title = '메뉴에서 설치해주세요';
      steps = [
        '오른쪽 위 ⋮ 메뉴를 누르세요 (삼성 인터넷은 아래 ≡ 메뉴)',
        "'앱 설치' 또는 '홈 화면에 추가'를 누르세요",
        "'설치'를 누르면 끝!",
      ];
    } else {
      title = '브라우저 메뉴에서 설치해주세요';
      steps = [
        '주소창 오른쪽의 설치 아이콘을 누르거나, 브라우저 메뉴(⋮)를 여세요',
        "'앱 설치' 또는 '홈 화면에 추가'를 누르세요",
      ];
    }
    body = (
      <div>
        <StepList steps={steps} />
        {env.isIOS && <div className="text-2xl mt-3 animate-bounce" aria-hidden="true">👇</div>}
      </div>
    );
    actions = (
      <div className="space-y-2">
        {oneTapReady && !env.isIOS && (
          <button onClick={handleYes} className={primaryBtn}>바로 설치하기</button>
        )}
        <button onClick={dismiss} className={secondaryBtn}>닫기</button>
      </div>
    );
  }

  return (
    <div
      className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 px-4"
      style={{ paddingBottom: 'calc(1rem + env(safe-area-inset-bottom))' }}
      onClick={() => (mode === 'installed' ? setOpen(false) : dismiss())}
    >
      <div
        className="w-full max-w-sm bg-white rounded-3xl p-5 shadow-2xl text-center"
        onClick={(e) => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
      >
        <img src="icon-192.png" alt="" className="w-16 h-16 rounded-2xl mx-auto mb-3 shadow" />
        <p className="text-slate-900 font-bold text-base mb-2">{title}</p>
        <div className="mb-4">{body}</div>
        {actions}
      </div>
    </div>
  );
}

function Root() {
  return (
    <React.Fragment>
      <BasketballClubApp />
      <InstallPrompt />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

</script>
</body>
